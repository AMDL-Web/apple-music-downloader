openapi: 3.1.0
info:
  title: AMDL Backend API
  version: 1.0.0
  description: Apple Music download jobs and wrapper-manager management API.
servers:
  - url: /
tags:
  - name: System
  - name: Wrapper
  - name: Quality
  - name: Downloads
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: The backend is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The local database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/logs:
    get:
      tags: [System]
      summary: Query process logs
      description: >-
        Queries the recent structured logs retained by logging.buffer_size, returned
        in ascending time order. The first query returns the most recent `limit`
        entries; follow-up queries with `after` page onward from that cursor, and
        next_cursor can be used directly for the next page. oldest_sequence is the
        oldest sequence number still retained; truncated means entries between
        `after` and it have already been evicted from the in-memory ring. Sensitive
        attributes are redacted uniformly before they enter the buffer or any
        external output.
      operationId: listLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogAfter'
        - $ref: '#/components/parameters/LogLimit'
      responses:
        '200':
          description: Matching logs and the cursor for the next query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/logs/stream:
    get:
      tags: [System]
      summary: Stream process logs live
      description: >-
        SSE log stream. Matching entries still in memory after the cursor are
        replayed first, then new entries keep being pushed; every event is named log
        and its SSE id equals the log sequence. When `after` is omitted, the
        Last-Event-ID request header is used; with a cursor, every matching entry
        still in memory is replayed, and when both are omitted the most recent
        entries are replayed up to `limit`. The server sends a keepalive comment
        every 15 seconds; if the client keeps reading too slowly the connection is
        closed, and the client should reconnect with the last id it received to
        catch up.
      operationId: streamLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogAfter'
        - $ref: '#/components/parameters/LogLimit'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: text/event-stream; data is LogEntry JSON.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/logs/stream/ws:
    get:
      tags: [System]
      summary: Stream process logs live (WebSocket)
      description: |
        WebSocket version of /api/v1/logs/stream for mobile clients (e.g. iOS
        URLSessionWebSocketTask), with filter semantics identical to the SSE
        endpoint. After a successful handshake the server first replays the matching
        entries in memory, then keeps pushing new ones; each LogEntry is sent as one
        JSON text message whose content is identical to the SSE endpoint's data
        field. To resume after a disconnect, pass the last sequence received in the
        `after` query parameter (WebSocket has no Last-Event-ID header convention).
        The server sends a WebSocket ping every 15 seconds to detect half-open
        connections; the connection is a server-to-client push only, and a data
        frame sent by the client closes it. If the client keeps reading too slowly
        the server closes the connection, and the client should reconnect with the
        last sequence it received to catch up.
      operationId: streamLogsWebSocket
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogAfter'
        - $ref: '#/components/parameters/LogLimit'
      responses:
        '101':
          description: Protocol switch succeeded; log replay and push begin.
        '400':
          $ref: '#/components/responses/BadRequest'
        '426':
          description: The request is not a WebSocket handshake (it lacks upgrade headers such as Upgrade/Connection) and is rejected directly by the handshake library.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/config:
    get:
      tags: [System]
      summary: Read the current runtime configuration (mutable fields only)
      description: >-
        Returns the runtime-mutable part of the effective configuration: the download
        section (except max_running_jobs, max_parallel_downloads,
        max_parallel_decrypts and max_parallel_wrapper_requests),
        logging.level/access_log, the simulate section, the library_sync section, and
        catalog.album_track_url_mode/media_user_token/signed_mode_hls_source/motion_artwork_enabled.
        Startup-only fields (server, database, the other logging fields, wrapper,
        tools, the other catalog fields) are not returned — they cannot be changed
        through this API; edit the startup configuration configs/config.yaml and
        restart instead.

        All fields live in configs/config.yaml. Every GET re-reads that file's
        runtime fields before responding, so mutable fields hand-edited while the
        service runs take effect on the next GET without a restart; startup-only
        fields still require a restart. AMDL_<SECTION>_<KEY> environment variable
        overrides (section and key names in upper case) are applied on every
        re-read as well and take precedence over file values. While the file is
        unreadable or fails validation (for example when it is half-edited), the
        last valid configuration keeps being returned, together with a reload_error
        field explaining why.
      operationId: getConfig
      responses:
        '200':
          description: The current runtime-mutable configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
    put:
      tags: [System]
      summary: Update the runtime configuration
      description: >-
        The request body overrides the current runtime configuration with merge
        semantics: omitted fields keep their current values, and fields that are
        present (including whole sections) are replaced. The merged result must pass
        the same full validation as the configuration file.

        Only the fields returned by GET can be changed: the download section (except
        max_running_jobs, max_parallel_downloads, max_parallel_decrypts and
        max_parallel_wrapper_requests), logging.level/access_log, the simulate
        section, the library_sync section, and
        catalog.album_track_url_mode/media_user_token/signed_mode_hls_source/motion_artwork_enabled.
        Every other field is consumed only at process startup, and a request that
        changes one is rejected with 422 — edit the startup configuration
        configs/config.yaml and restart instead. As the only exception,
        catalog.media_user_token_priority sent by old clients is still accepted,
        but the field is deprecated, its value is ignored, and it no longer takes
        part in token selection. Fields overridden by an AMDL_<SECTION>_<KEY>
        environment variable (section and key names in upper case) also return 422:
        the write would be masked again by the environment variable's value on the
        next configuration reload, so change the environment variable and restart
        instead.

        Changes take effect immediately for new requests and newly started jobs
        (running jobs keep the configuration snapshot taken when they started), and
        the complete configuration, startup fields included, is written back to
        configs/config.yaml, so it still applies after a restart. That file is
        managed by the backend (rewritten in full on every PUT, comments are not
        kept); the fully commented field documentation is
        configs/config.example.yaml, which serves as the template for config.yaml
        on first start.

        Note for frontends: before confirming a write, GET once and build the
        request body from its response. PUT merges onto the backend's current
        in-memory configuration, while GET first re-reads the configuration file and
        syncs hand edits made while the service runs into memory — a PUT without
        the preceding GET may, working from a stale view, overwrite values just
        changed elsewhere (another page or a hand edit).
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: The updated runtime configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          description: The request body is not valid JSON or contains unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            The merged result fails configuration validation, or the request tries
            to change a startup-only field, or a field overridden by an AMDL_*
            environment variable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hooks:
    get:
      tags: [System]
      summary: List the available job hooks
      description: >-
        Returns the global switch and entry metadata loaded from hooks.yaml at
        process startup, in file order, so clients can build an overrides.hooks
        allow-list. An entry's enabled value is the result after defaults are
        applied; an empty job_types array matches every job type. The response never
        includes the URL, headers, command, workdir or any other configuration field
        that may carry secrets.
      operationId: listHooks
      responses:
        '200':
          description: The redacted hooks configuration; when nothing is configured, enabled is false and entries is an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksResponse'
  /api/v1/developer-token:
    get:
      tags: [System]
      summary: Get a locally signed Apple Music developer token
      description: >-
        Available only in local signing mode: signs a fresh JWT with the configured
        .p8 private key, valid for catalog.developer_token_ttl_hours (default 1
        hour); when catalog.allowed_origins is configured, an origin claim is added.
        Returns 409 in legacy scraping mode (the scraped token is origin-restricted
        and cannot be handed out).
      operationId: getDeveloperToken
      responses:
        '200':
          description: A newly issued developer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperTokenResponse'
        '409':
          description: The service is in legacy scraping mode, which does not support issuing a developer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/library-sync:
    get:
      tags: [System]
      summary: Get the library monitor status
      description: >-
        Returns the monitor's current state: the switch and interval from the
        configuration, plus what the most recent poll observed. It is returned even
        when the feature is off, so clients do not have to guess the switch state.

        Apple does not expose when a track was added to the library (library-songs
        has no dateAdded attribute, and a library album's dateAdded is when the
        album's first track was added and does not change when songs are added to it
        later), but the **order** of sort=-dateAdded is reliable. So the watermark is
        a position rather than a time: the newest batch of track ids is remembered
        as the anchor, each poll reads newest-first until it reaches the oldest
        track in the anchor, and anything in between that is not in the anchor is
        new. anchor_size is the number of ids in that batch.
      operationId: getLibrarySyncStatus
      responses:
        '200':
          description: Monitor status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncStatus'
        '503':
          description: This process has no library monitor wired in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/library-sync/reset:
    post:
      tags: [System]
      summary: Reset the library monitor anchor
      description: >-
        Clears the anchor. The next poll finds no anchor, so it re-anchors on the
        library as it is **at that moment** and **submits no albums** — this
        "forgets history" rather than "replays history", and will not flood the
        download queue.

        Use it when the monitor's idea of what is "already there" has drifted from
        reality. To download a particular album again, submit it directly with
        POST /api/v1/downloads; this endpoint cannot do that.
      operationId: resetLibrarySyncAnchor
      responses:
        '200':
          description: The anchor has been cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncResetResponse'
        '503':
          description: This process has no library monitor wired in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/wrapper/status:
    get:
      tags: [Wrapper]
      summary: Get wrapper-manager status
      description: Probes wrapper-manager connectivity and runtime state such as login and regions; use it before downloading or managing accounts.
      operationId: getWrapperStatus
      responses:
        '200':
          description: Wrapper status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrapperStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/wrapper/login:
    post:
      tags: [Wrapper]
      summary: Log in to a wrapper account
      description: Login may succeed immediately, or return a login_id that requires a two-step verification code.
      operationId: loginWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '202':
          description: A two-step verification code must be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedsTwoStepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/login/{login_id}/2fa:
    post:
      tags: [Wrapper]
      summary: Submit a two-step verification code
      operationId: submitWrapperTwoStepCode
      parameters:
        - $ref: '#/components/parameters/LoginID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/logout:
    post:
      tags: [Wrapper]
      summary: Log out of a wrapper account
      operationId: logoutWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/quality:
    post:
      tags: [Quality]
      summary: Query the available audio qualities of the songs in a link
      description: |
        Resolves an Apple Music song, album, playlist, artist or station URL that the
        backend supports and returns, for each song, a summary of the codecs,
        bitrates, sample rates and bit depths its master playlist currently declares;
        no download job is created.
        Every link type returns a tracks array: a song has one element, and
        collections keep Apple Music's original order and repeated track occurrences.
        The i parameter on an album URL still follows the runtime
        catalog.album_track_url_mode; station resolution uses the runtime
        catalog.media_user_token. Internally this reuses the download jobs' region
        check, collection resolution, track metadata refresh, retries, concurrency
        scheduling, HLS source selection and codec/ALAC filtering rules. On the
        normal success path, each track occurrence reads its master playlist once
        and all qualities are summarized from it; on failure the source is fetched
        again and the master re-read, up to download.max_attempts. The query does
        not read individual media playlists, does not verify media segments, and
        never enters the encrypted media transfer. The region check requires the
        wrapper/decryptor to be ready and the URL's storefront to be among the
        regions it reports. music-video is not supported.
      operationId: queryQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityRequest'
      responses:
        '200':
          description: Summary of the available qualities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/downloads:
    get:
      tags: [Downloads]
      summary: List download jobs
      description: |
        Returns a snapshot of the download job list, with pagination,
        status/type/storefront filters, substring search over title and input URL,
        and filtering by creation/update time windows. Sorted by created_at
        descending by default.
        Multi-value parameters (status, type) accept repeated keys or comma
        separation; for example `status=failed&status=cancelled` is equivalent to
        `status=failed,cancelled`.
      operationId: listDownloads
      parameters:
        - name: limit
          in: query
          description: Number of jobs to return; default 50, maximum 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of jobs to skip, for pagination; default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: >-
            Filter by job status; repeat the parameter or separate values with
            commas. Allowed values: queued, running, completed, failed, cancelled.
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, completed, failed, cancelled]
          style: form
          explode: true
        - name: type
          in: query
          description: >-
            Filter by job type; repeat the parameter or separate values with commas.
            Allowed values: song, album, playlist, artist, station.
          schema:
            type: array
            items:
              type: string
              enum: [song, album, playlist, artist, station]
          style: form
          explode: true
        - name: storefront
          in: query
          description: Exact match on the Apple Music storefront, e.g. us, cn, jp.
          schema:
            type: string
        - name: q
          in: query
          description: >-
            Substring search over the job's title and input (SQLite LIKE;
            case-insensitive for ASCII letters). `%` and `_` match literally.
          schema:
            type: string
        - name: created_after
          in: query
          description: >-
            Only return jobs with created_at >= this instant. Accepts RFC3339 (with
            optional nanoseconds) or YYYY-MM-DD (start of the UTC day, 00:00:00).
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: >-
            Only return jobs with created_at <= this instant. Accepts RFC3339 (with
            optional nanoseconds) or YYYY-MM-DD (end of the UTC day,
            23:59:59.999999999).
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: >-
            Only return jobs with updated_at >= this instant. Accepts RFC3339 (with
            optional nanoseconds) or YYYY-MM-DD (start of the UTC day, 00:00:00).
          schema:
            type: string
            format: date-time
        - name: updated_before
          in: query
          description: >-
            Only return jobs with updated_at <= this instant. Accepts RFC3339 (with
            optional nanoseconds) or YYYY-MM-DD (end of the UTC day,
            23:59:59.999999999).
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Sort field; default created_at.
          schema:
            type: string
            enum: [created_at, updated_at]
            default: created_at
        - name: order
          in: query
          description: Sort direction; default desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Snapshot of the download job list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
        '400':
          description: Invalid query parameters (unknown enum value, bad time format, limit/offset out of range, and so on).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Downloads]
      summary: Create download jobs in bulk
      description: >-
        Submits a batch of URLs and returns the enqueue result for each one;
        duplicate, unsupported or queue-full URLs are flagged individually in
        results without affecting the other URLs. The optional overrides field
        applies to the jobs created by this request and overrides the download
        section of the runtime configuration; overrides.media_user_token overrides
        the catalog.media_user_token fallback and follows its own rules for
        on-demand persistence, clearing at terminal states, and redaction from
        responses; overrides.hooks selects which hooks.yaml entries the jobs in this
        batch may run.
      operationId: createDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '202':
          description: At least one URL was enqueued; see results for the per-URL outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: >-
            The request body cannot be parsed, contains unknown fields (for example
            the old top-level media_user_token, or a misspelled key inside
            overrides), urls is empty, or it exceeds the per-request limit (100
            URLs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            Every URL was rejected (the body is a BatchSubmitResponse; see results
            for each reason), or overrides failed configuration validation
            (including unknown entry names in hooks; the body is an ErrorResponse).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchSubmitResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /api/v1/downloads/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download list changes (SSE)
      description: |
        Overview event stream: GET /downloads is a one-off snapshot of the list,
        while this endpoint pushes incremental changes live as the list changes;
        both are ways to read the same state. Each push is a DownloadFeedMessage:
        - download_upserted: a job was created or changed (queued, started,
          progress as each song finishes, terminal state); data.job is the job's
          latest snapshot (done_items/failed_items computed from live progress);
        - download_deleted: a job was deleted; data.job_id is the deleted job's id.
        Both message types carry status_counts, the latest status counts of all
        jobs at the moment the message was generated; in a delete message the
        deleted job has already been subtracted.
        Only "milestone" events that affect how the list is displayed trigger a
        push (created/recovered/started/input resolved/animated cover
        resolved/song completed, skipped or failed/terminal state/deleted);
        high-frequency details such as per-track download progress are not pushed.
        The animated cover is the only kind of change that can still arrive after a
        job reaches a terminal state: it is resolved out of band, and by then the
        per-job event stream has usually closed, so only this endpoint delivers it.
        Resuming after a disconnect: first GET /downloads to obtain last_event_id,
        then resume with the Last-Event-ID header to receive only the changes made
        after it. download_upserted and download_deleted both carry event_id;
        after processing each message, the client uses that value as its new
        resume cursor.
      operationId: streamDownloadsFeed
      parameters:
        - name: Last-Event-ID
          in: header
          description: The latest event_id already processed (taken from last_event_id of GET /downloads or from the event_id of the previous push).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: SSE event stream; each data is one DownloadFeedMessage.
          content:
            text/event-stream:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/downloads/events/ws:
    get:
      tags: [Downloads]
      summary: Subscribe to download list changes (WebSocket)
      description: |
        WebSocket version of /api/v1/downloads/events, with the same semantics.
        After a successful handshake the server pushes each DownloadFeedMessage as
        one JSON text message. To resume after a disconnect, use the last_event_id
        query parameter; download_upserted and download_deleted both carry
        event_id, and after processing each message the client uses that value as
        its new resume cursor.
      operationId: streamDownloadsFeedWebSocket
      parameters:
        - name: last_event_id
          in: query
          description: The latest event_id already processed; when resuming, only changes made after it are pushed. Default 0 (push the latest snapshot of every current job from the start).
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '101':
          description: Protocol switch succeeded; list changes start being pushed.
        '400':
          description: WebSocket handshake failed (missing upgrade headers, etc.).
  /api/v1/downloads/{job_id}:
    get:
      tags: [Downloads]
      summary: Get download job details
      operationId: getDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job, its items and the retry policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Downloads]
      summary: Delete a download job
      description: Deletes a job in a terminal state (completed/failed/cancelled) together with its items and event records. A queued or running job must be cancelled first.
      operationId: deleteDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job has been deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is not in a terminal state and must be cancelled first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/downloads/{job_id}/cancel:
    post:
      tags: [Downloads]
      summary: Cancel a download job
      operationId: cancelDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job has been cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: cancelled
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/downloads/{job_id}/retry:
    post:
      tags: [Downloads]
      summary: Retry a failed download job
      description: |
        Re-enqueues a job in the failed terminal state; only unfinished tracks are
        actually retried: items that already completed (completed) or were skipped
        (skipped_existing) keep their state and are not downloaded again; the
        remaining items (failed, etc.) are reset to queued and reprocessed under
        their original item ids.
        Re-enqueueing records and pushes a job_retried event (an overview milestone
        event, which drives the GET /downloads overview feed).
      operationId: retryDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '202':
          description: The job has been re-enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: queued
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The job is not in the failed state; or a queued/running job for the
            same link already exists; or the previous run is still wrapping up (the
            terminal state was just written but worker cleanup/hook dispatch has not
            finished; the window is very short, so simply retry a moment later).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The job queue is full; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/downloads/{job_id}/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download job events
      description: |
        Server-Sent Events stream with Last-Event-ID resumption.
        Each SSE data is Event JSON; its payload is itself a JSON string and must
        be parsed a second time. The payload of job lifecycle events
        (job_queued/job_recovered/job_retried/job_started/resolved_input/job_finished/job_failed/job_cancelled)
        contains the same public fields as the REST `Job`; the payload of track
        status events contains the same public fields as the REST `JobItem` and
        keeps the event's own specific fields (e.g. download_attempts,
        will_retry). Clients can therefore merge events directly, without an extra
        GET after the terminal event to obtain the complete final state.
        When the job is already in a terminal state (completed/failed/cancelled):
        if there are historical events not yet delivered to this client (including
        the terminal event itself, and the hook_started/hook_succeeded/hook_failed
        events of post-download hooks still running — hooks fire asynchronously
        and may be recorded only after the job reaches its terminal state), those
        events are replayed as-is first; the connection stays open while any hook
        is still running and closes only once the hooks finish. The subscription
        is rejected outright (409) only when the client has already caught up on
        every event and no hook is still running — in that case use
        GET .../downloads/{job_id} for the final state.
      operationId: streamDownloadEvents
      parameters:
        - $ref: '#/components/parameters/JobID'
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is in a terminal state, no hook is still running, and the client has caught up on every historical event; no new events will be produced, so the subscription is rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/downloads/{job_id}/events/ws:
    get:
      tags: [Downloads]
      summary: Subscribe to download job events (WebSocket)
      description: |
        WebSocket version of the SSE endpoint for mobile clients (e.g. iOS
        URLSessionWebSocketTask).
        After a successful handshake the server pushes each event as one JSON text
        message whose content is identical to the SSE endpoint's data field (an
        Event object; the payload field is itself a JSON string and must be parsed
        a second time).
        The payload conventions for Job/JobItem snapshot fields and event-specific
        fields are also identical to SSE.
        To resume after a disconnect, use the last_event_id query parameter to
        receive only newer events.
        The server sends a WebSocket ping every 10 seconds to detect half-open
        connections; the connection is a server-to-client push only, and a data
        frame sent by the client closes it.
        When the job is already in a terminal state (completed/failed/cancelled):
        if there are historical events not yet delivered to this client (including
        the terminal event itself, and the hook_started/hook_succeeded/hook_failed
        events of post-download hooks still running — hooks fire asynchronously
        and may be recorded only after the job reaches its terminal state), the
        handshake still succeeds and those events are replayed; the connection
        stays open while any hook is still running and closes only once the hooks
        finish. The handshake is rejected (409) only when the client has already
        caught up on every event and no hook is still running — in that case use
        GET .../downloads/{job_id} for the final state.
      operationId: streamDownloadEventsWebSocket
      parameters:
        - $ref: '#/components/parameters/JobID'
        - name: last_event_id
          in: query
          description: The id of the last event received; when resuming, only newer events are pushed. Default 0 (push from the beginning).
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '101':
          description: Protocol switch succeeded; the event stream starts.
        '400':
          description: WebSocket handshake failed (missing upgrade headers, etc.).
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job is in a terminal state, no hook is still running, and the client has caught up on every historical event; no new events will be produced, so the handshake is rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    LoginID:
      name: login_id
      in: path
      required: true
      schema:
        type: string
      example: 4f0f2c79acda4c28b69ebf4f702f8a51
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: job_01JZ0000000000000000000000
    LogLevel:
      name: level
      in: query
      description: Comma-separated exact severity levels; allowed values are debug, info, warn and error.
      schema:
        type: string
      example: warn,error
    LogComponent:
      name: component
      in: query
      description: Exact match on the component attribute, e.g. api, jobs, media, catalog, hooks, main.
      schema: {type: string}
    LogRequestID:
      name: request_id
      in: query
      description: Exact match on the HTTP request correlation ID.
      schema: {type: string}
    LogJobID:
      name: job_id
      in: query
      description: Exact match on the download job ID.
      schema: {type: string}
    LogQuery:
      name: q
      in: query
      description: Case-insensitive substring match over the message and structured attributes.
      schema: {type: string}
    LogSince:
      name: since
      in: query
      description: Inclusive lower bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogUntil:
      name: until
      in: query
      description: Inclusive upper bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogAfter:
      name: after
      in: query
      description: Only return entries whose sequence is greater than this value.
      schema: {type: integer, format: int64, minimum: 0}
    LogLimit:
      name: limit
      in: query
      description: Maximum number of entries to return or replay; default 200 for queries and 500 for SSE.
      schema: {type: integer, minimum: 1, maximum: 1000}
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JSONBodyTooLarge:
      description: The JSON request body exceeds the 1 MiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Wrong login credentials or verification code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or the login session has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The account is already logged in or the session is being verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: wrapper-manager returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: The wrapper login timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        storefront:
          type: string
        supported_storefronts:
          type: array
          items:
            type: string
    DeveloperTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: ES256-signed Apple Music developer token (JWT). Read the expiry time from the exp claim in the payload.
    WrapperStatus:
      type: object
      required: [ready, status, regions, client_count, accounts_supported]
      properties:
        ready:
          type: boolean
        status:
          type: boolean
        regions:
          type: array
          items:
            type: string
        client_count:
          type: integer
          format: int32
        accounts_supported:
          type: boolean
          description: Whether wrapper-manager returned the optional accounts field; false means the connected manager version does not support it.
        accounts:
          type: array
          description: Logged-in wrapper account identifiers when supported by wrapper-manager.
          items:
            type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database_error:
          type: string
    HooksResponse:
      type: object
      additionalProperties: false
      required: [enabled, entries]
      properties:
        enabled:
          type: boolean
          description: The global enabled switch of hooks.yaml.
        entries:
          type: array
          description: The entries in hooks.yaml, in their configured file order.
          items:
            $ref: '#/components/schemas/HookEntry'
    HookEntry:
      type: object
      additionalProperties: false
      required: [name, enabled, type, events, job_types]
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Enabled state after applying the rule that an omitted enabled defaults to true.
        type:
          type: string
          enum: [webhook, exec]
        events:
          type: array
          items:
            type: string
            enum: [job_queued, job_finished, job_failed, job_cancelled]
        job_types:
          type: array
          description: An empty array means the entry matches every job type.
          items:
            type: string
            enum: [song, album, playlist, artist, station]
    LogEntry:
      type: object
      required: [sequence, time, level, message]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        source:
          type: string
          description: Present when logging.include_source is true; formatted as the Go source file path and line number.
        attributes:
          type: object
          additionalProperties: true
    LogListResponse:
      type: object
      required: [logs, next_cursor, oldest_sequence, truncated]
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_cursor:
          type: integer
          format: int64
          minimum: 0
        oldest_sequence:
          type: integer
          format: int64
          minimum: 0
          description: The oldest global sequence number currently in the in-memory buffer; 0 when the buffer is empty.
        truncated:
          type: boolean
          description: Whether entries after the after cursor and before oldest_sequence have already been evicted.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: example-password
    TwoStepRequest:
      type: object
      required: [two_step_code]
      properties:
        two_step_code:
          type: string
          example: '123456'
    LogoutRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: user@example.com
    LoggedInResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: logged_in
    NeedsTwoStepResponse:
      type: object
      required: [status, login_id]
      properties:
        status:
          type: string
          const: needs_2fa
        login_id:
          type: string
    LoggedOutResponse:
      type: object
      required: [status, username]
      properties:
        status:
          type: string
          const: logged_out
        username:
          type: string
    DownloadRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          description: >-
            List of Apple Music links (song/album/playlist/artist/station). Each
            element may contain several URLs separated by newlines or whitespace,
            which the server splits automatically; at most 100 URLs per request
            after splitting. Stations (station, shaped like
            .../station/.../ra.xxxx) are supported only for personalized/curated
            stations that resolve to a track list, and require
            overrides.media_user_token or the catalog.media_user_token fallback from
            the runtime configuration; live radio stations (Apple Music 1, etc.)
            have no static track list and cannot be downloaded.
          minItems: 1
          items:
            type: string
          example:
            - https://music.apple.com/cn/album/example/123456789?i=987654321
            - https://music.apple.com/cn/album/example/123456789
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            Optional configuration overrides that apply only to the jobs created by
            this request. Omitted fields keep the current runtime configuration.
            Download overrides are persisted with each job and still apply after a
            retry or a restart recovery; media_user_token follows the stricter
            lifecycle and redaction rules described in DownloadOverrides; hooks
            selects the job event hooks. No override affects any other job.
    DownloadOverrides:
      type: object
      description: >-
        Per-job configuration override layer: apart from media_user_token and
        hooks, the fields map one-to-one onto the download section of the runtime
        configuration. max_running_jobs, max_parallel_downloads,
        max_parallel_decrypts and max_parallel_wrapper_requests are fixed at
        startup and shared globally, so they cannot be overridden per job;
        progress_event_interval_ms describes the shape of the event stream shared
        by all subscribers and likewise cannot be overridden per job. All fields
        are optional; on submission the full validation runs against "current
        runtime configuration + overrides". downloads_dir and temp_dir may only
        select the administrator-configured root directory itself or one of its
        subdirectories, and cannot escape that root through absolute paths, .. or
        symlinks. media_user_token has three-state semantics: when omitted, the
        catalog.media_user_token fallback is used; a non-empty string overrides
        the fallback; an explicit empty string clears the fallback for that job.
        The token is persisted only for the station and private playlist
        (pl.u-xxx) jobs that actually need it; jobs of other types in the same
        batch do not store it. It is cleared when the job completes or is
        cancelled, kept on failure so retry works, and never echoed back in any
        job response, whether create, list, detail, SSE/WebSocket or otherwise.
      properties:
        media_user_token:
          type: string
          writeOnly: true
          description: >-
            Apple Music subscription token (media-user-token), used to resolve
            stations and fetch private playlist covers. See the DownloadOverrides
            description for the three-state semantics of omitted, non-empty and
            explicitly empty values, and for the persistence, clearing and response
            redaction rules.
        hooks:
          type: array
          items:
            type: string
          uniqueItems: false
          description: >-
            Per-job allow-list of configs/hooks.yaml entry names, applying to
            job_queued and every terminal-state event. A job_queued hook is
            dispatched only once, on the first submission; retry and restart
            recovery do not send it again. The allow-list is persisted with the
            job, so terminal events that arrive after a retry or restart recovery
            are still bound by the same list. When the field is omitted, every
            enabled entry matching events/job_types may run; an explicit [] runs no
            hook for this batch; a non-empty list only lets the entries with those
            names continue through the normal enabled/events/job_types filtering,
            and cannot enable a disabled or non-matching entry. Duplicate names are
            allowed and count once; when a hooks configuration exists, unknown
            names return 422. When no entry is configured at all, any list is
            accepted but has no effect.
        quality_priority:
          type: array
          items:
            type: string
            enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
        codec_alternative: {type: boolean}
        memory_mode:
          type: string
          enum: [low, high]
          description: >-
            Per-job Enhanced HLS memory mode. On the normal path, low uses bounded
            per-fragment memory, trading more temporary disk for lower RAM; high
            keeps one encrypted copy of the whole track in memory, reducing
            temporary disk use and disk round trips (in-memory media is capped at
            512 MiB per track; because of Go GC allocation headroom, the actual heap
            peak can approach twice the track size). When omitted, the runtime
            configuration applies. AAC-LC is unaffected by this option and is held
            in memory as a whole track in both modes; the rare ALAC integrity repair
            also reads and copies the whole track. In both modes, tagging briefly
            creates a whole-track rewrite file in the system temp directory.
        max_attempts:
          type: integer
          maximum: 10
          description: Positive values 1-10 are allowed; values <=0 are treated as 1; values above 10 are rejected with 422 at submission (job overrides persisted before this limit existed are clamped to 10 at run time instead of failing).
        downloads_dir: {type: string}
        song_path_format: {type: string}
        album_path_format: {type: string}
        artist_path_format: {type: string}
        playlist_path_format: {type: string}
        station_path_format: {type: string}
        temp_dir: {type: string}
        cover_size: {type: string}
        cover_format:
          type: string
          enum: [jpg, jpeg, png]
        embed_cover: {type: boolean}
        save_album_cover: {type: boolean}
        save_artist_cover: {type: boolean}
        save_playlist_cover: {type: boolean}
        embed_lyrics: {type: boolean}
        save_lyrics_file: {type: boolean}
        lyrics_format:
          type: string
          enum: [lrc, ttml]
        lyrics_type:
          type: string
          enum: [lyrics, syllable-lyrics]
        lyrics_extras:
          type: array
          items:
            type: string
            enum: [translation, pronunciation]
        alac_max_sample_rate: {type: integer}
        alac_max_bit_depth: {type: integer}
        check_integrity: {type: boolean}
        force_overwrite:
          type: boolean
          description: >-
            Whether to force a re-download that overwrites existing output files
            and their lyrics sidecar files. When omitted, the runtime configuration
            value download.force_overwrite applies (default false).
    RuntimeConfig:
      type: object
      description: >-
        The runtime-mutable configuration subset (see the comments in
        configs/config.example.yaml for field meanings, enum values and default
        behavior). GET returns this shape; a PUT may submit only the fields to
        change, and omitted fields keep their current values.
      properties:
        catalog:
          type: object
          description: >-
            max_parallel_requests, requests_per_second and request_burst take
            effect only at startup; they do not appear here and cannot be changed.
          properties:
            album_track_url_mode:
              type: string
              enum: [song, album]
            media_user_token:
              type: string
              description: >-
                Global media-user-token fallback used for station downloads and
                private playlist cover fetching. It can be changed through PUT and
                is written back to the configuration file; GET returns the current
                value. overrides.media_user_token in a request can override it or
                explicitly clear it per job.
            media_user_token_priority:
              type: string
              enum: [request, config]
              deprecated: true
              writeOnly: true
              description: >-
                Deprecated input field accepted only for compatibility with old
                clients; its value is ignored and no longer takes part in token
                selection. New clients must use overrides.media_user_token.
            signed_mode_hls_source:
              type: string
              enum: [wrapper, web_token]
              description: >-
                Takes effect only when developer-token signing is enabled (a
                self-signed token cannot read enhancedHls); ignored in legacy mode.
                wrapper (default) takes the authorized-device manifest from
                wrapper.M3U8; web_token scrapes the music.apple.com web player JWT
                and reads enhancedHls from amp-api.
            motion_artwork_enabled:
              type: boolean
              description: >-
                Whether to look up Apple Music animated album covers
                (attributes.editorialVideo); default true. When true, each album
                makes one extra amp-api request after it resolves (detached from the
                job context, so it never blocks the download or makes it fail), and
                on success a motion_artwork_resolved event fills in the job's
                motion_artwork_* fields. When false, no request is made and no web
                player token is scraped; jobs carry none of these fields, which to a
                client is exactly the same as "this album has no animated cover".
                Changes take effect for newly started jobs.
        download:
          type: object
          description: >-
            max_running_jobs, max_parallel_downloads, max_parallel_decrypts and
            max_parallel_wrapper_requests take effect only at startup; they do not
            appear here and cannot be changed.
          properties:
            quality_priority:
              type: array
              minItems: 1
              items:
                type: string
                enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
            codec_alternative: {type: boolean}
            memory_mode:
              type: string
              enum: [low, high]
              description: >-
                Controls the Enhanced HLS path. On the normal path, low (default)
                uses bounded per-fragment memory, and the temporary disk peak is
                usually about three files per parallel track; high keeps one
                encrypted copy of the whole track in memory and decrypts it fragment
                by fragment (in-memory media is capped at 512 MiB per track; because
                of Go GC allocation headroom, the actual heap peak can approach
                twice the track size), and the configured temp directory usually
                holds only the final flattened output. AAC-LC is held in memory as a
                whole track in both modes; the rare ALAC integrity repair also reads
                and copies the whole track. In both modes, tagging also briefly
                creates a whole-track rewrite file in the system temp directory.
            max_attempts:
              type: integer
              maximum: 10
              description: Positive values 1-10 are allowed; values <=0 are treated as 1.
            progress_event_interval_ms:
              type: integer
              maximum: 10000
              description: >-
                Minimum interval in milliseconds between two item_progress events
                for the same item within the same status. Only the advance of the
                download/decrypt meters is throttled; status changes
                (waiting_download, downloading, waiting_decrypt, decrypting,
                remuxing, saving, tagging), stage-completion flags (resolved,
                remuxed, verified, tagged, saved) and one-off events such as
                item_completed / item_failed / item_skipped are always pushed
                immediately and are unaffected by this value. A progress value held
                back by the interval is emitted before the event that supersedes
                it, so the last percentage before a status change is never lost,
                and a client resuming with last_event_id sees exactly the same event
                sequence as a live client. This is a time floor layered on top of
                the "whole-percentage rounding" threshold, so however small it is
                set, a single meter still emits no more than about 101 events per
                stage. 0-10000 is allowed; values <=0 disable time coalescing and
                keep only the percentage threshold; values above 10000 in the
                configuration file are clamped to 10000, while the config API
                rejects them outright. Default 500. Read once when a job starts, so
                changes only affect jobs started afterwards, not running ones.
            downloads_dir: {type: string}
            song_path_format: {type: string}
            album_path_format: {type: string}
            artist_path_format: {type: string}
            playlist_path_format: {type: string}
            station_path_format: {type: string}
            temp_dir: {type: string}
            cover_size:
              type: string
              description: >-
                "{width}x{height}", e.g. 5000x5000, 3000x3000, 1400x1400, 600x600.
            cover_format:
              type: string
              enum: [jpg, jpeg, png]
            embed_cover: {type: boolean}
            save_album_cover: {type: boolean}
            save_artist_cover: {type: boolean}
            save_playlist_cover: {type: boolean}
            embed_lyrics: {type: boolean}
            save_lyrics_file: {type: boolean}
            lyrics_format:
              type: string
              enum: [lrc, ttml]
            lyrics_type:
              type: string
              enum: [lyrics, syllable-lyrics]
            lyrics_extras:
              type: array
              items:
                type: string
                enum: [translation, pronunciation]
            alac_max_sample_rate:
              type: integer
              description: Hz; common values are 44100, 48000, 96000 and 192000.
            alac_max_bit_depth:
              type: integer
              description: Common values are 16 and 24.
            check_integrity: {type: boolean}
            force_overwrite:
              type: boolean
              description: >-
                Whether to force a re-download that overwrites existing output
                files and their lyrics sidecar files; default false. Can be
                overridden per batch with overrides.force_overwrite in the request.
        logging:
          type: object
          description: Only the log level and the HTTP access log switch are runtime-mutable; output and rotation settings require a restart.
          properties:
            level:
              type: string
              enum: [debug, info, warn, error]
            access_log: {type: boolean}
        simulate:
          type: object
          properties:
            enabled: {type: boolean}
            min_speed_kbps: {type: integer}
            max_speed_kbps: {type: integer}
        library_sync:
          type: object
          description: >-
            Library monitor: polls the signed-in Apple Music library and submits
            the albums of newly added tracks as ordinary download jobs (sharing the
            same deduplication, validation and hooks as manual submissions).
            Requires catalog.media_user_token — a personal library can be read only
            with the subscription token; while that field is empty the monitor
            idles, and last_error in GET /api/v1/library-sync shows the status.
          properties:
            enabled:
              type: boolean
              description: >-
                Whether polling is enabled. Default false — this is the only
                feature that creates download jobs on its own. Turning it off really
                stops polling, rather than just discarding the results.
            interval_minutes:
              type: integer
              minimum: 1
              maximum: 1440
              description: >-
                Polling interval in minutes; default 15. The 1440 cap is not a
                resource limit (a poll usually makes only 1 Apple request); it rules
                out values that would show as enabled but never actually fire.
                Changes take effect immediately, with no restart needed.
    LibrarySyncStatus:
      type: object
      required: [enabled, interval_minutes, anchor_size, last_submitted, total_submitted]
      properties:
        enabled:
          type: boolean
          description: Taken from library_sync.enabled in the current runtime configuration.
        interval_minutes:
          type: integer
        anchor_size:
          type: integer
          description: >-
            Number of tracks remembered in the current anchor. 0 means no anchor
            has been set yet (first enable, or just reset); the next poll anchors
            on the library as it is then and submits no albums.
        last_poll_at:
          type: string
          format: date-time
          description: When a poll last actually ran; absent if it has never polled.
        last_error:
          type: string
          description: >-
            Failure reason of the most recent poll; absent on success. When the
            monitor is enabled but catalog.media_user_token is empty, this explains
            why it is idling.
        last_submitted:
          type: integer
          description: Number of albums enqueued in the most recent poll.
        total_submitted:
          type: integer
          description: Total number of albums enqueued since this process started (reset to zero on restart).
    LibrarySyncResetResponse:
      type: object
      required: [cleared, status]
      properties:
        cleared:
          type: integer
          description: Number of anchor entries cleared.
        status:
          $ref: '#/components/schemas/LibrarySyncStatus'
    ConfigResponse:
      type: object
      required: [config, persisted]
      properties:
        config:
          $ref: '#/components/schemas/RuntimeConfig'
        persisted:
          type: boolean
          description: >-
            Whether the configuration store has a persisted file. Always true in a
            normal deployment: changes made through PUT are written back to
            configs/config.yaml and still apply after a restart.
        reload_error:
          type: string
          description: >-
            Present only on GET when re-reading the configuration file failed:
            explains why the file is unusable (unreadable or failing validation);
            config is then the last valid configuration.
    SubmitResult:
      type: object
      required: [url, status]
      properties:
        url:
          type: string
          description: A single input URL after splitting and normalization.
        status:
          type: string
          enum: [accepted, invalid, duplicate_in_request, duplicate_active, queue_full]
        job:
          $ref: '#/components/schemas/Job'
          description: The newly created job, returned when status is accepted.
        existing_job_id:
          type: string
          description: When status is duplicate_active, points to the job with the same content that is already in progress.
        error:
          type: string
          description: Explanation of why the URL was rejected.
    BatchSubmitResponse:
      type: object
      required: [accepted, rejected, results]
      properties:
        accepted:
          type: integer
          description: Number of URLs enqueued successfully.
        rejected:
          type: integer
          description: Number of URLs rejected.
        results:
          type: array
          description: Per-URL results, one for each URL in the request.
          items:
            $ref: '#/components/schemas/SubmitResult'
    QualityRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://music.apple.com/cn/album/one-last-kiss/1542953969
    QualitySong:
      type: object
      required: [id, name, artist, album, has_lyrics]
      properties:
        id: {type: string}
        name: {type: string}
        artist: {type: string}
        album: {type: string}
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Catalog metadata only — it does not
            guarantee the lyrics can actually be fetched at download time.
    QualityOption:
      type: object
      required: [id, label, available]
      properties:
        id:
          type: string
          enum: [aac, aac-binaural, aac-downmix, alac, ec3, ac3]
        label: {type: string}
        available:
          type: boolean
          description: Whether the master playlist declares a variant that fits the current codec and ALAC limits; it does not mean a specific media playlist or the media segments have been verified.
        codec: {type: string}
        codec_id: {type: string}
        channels: {type: integer}
        bit_depth: {type: integer}
        sample_rate:
          type: integer
          description: Hz.
        bitrate:
          type: integer
          description: bits per second.
        description: {type: string}
    QualityTrack:
      type: object
      required: [song, qualities]
      properties:
        song:
          $ref: '#/components/schemas/QualitySong'
        qualities:
          type: array
          description: Every quality slot in the backend's fixed codec order, including entries with available=false.
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/QualityOption'
    QualityResponse:
      type: object
      description: Per-track quality response shape shared by every supported Apple Music URL type.
      required: [input, storefront, type, adam_id, tracks]
      properties:
        input: {type: string}
        storefront: {type: string}
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        adam_id:
          type: string
          description: Parsed Adam ID of the input song or collection.
        tracks:
          type: array
          description: >-
            Per-track results for every supported input type. Song inputs have
            exactly one item; collection order and duplicate song occurrences
            are preserved.
          minItems: 1
          items:
            $ref: '#/components/schemas/QualityTrack'
    Job:
      type: object
      required: [id, input, type, force, status, total_items, done_items, failed_items, created_at, updated_at]
      properties:
        id:
          type: string
        input:
          type: string
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        storefront:
          type: string
        title:
          type: string
          description: >-
            Display name resolved from Apple Music metadata (track/album/
            playlist/artist name). Populated once the job's input is
            resolved; absent before that or for jobs created before this
            field existed — clients should fall back to deriving a name
            from `input` in that case.
        artwork_url:
          type: string
          description: >-
            Cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. A private playlist may instead expose the owner's
            pre-signed S3 artwork URL verbatim; that URL can expire and has no
            placeholders. Populated once the job's input is resolved; absent
            for jobs created before this field existed.
        artist_name:
          type: string
          description: >-
            Display artist resolved from Apple Music metadata: the album's or
            song's artist name, or for artist jobs the artist's own name.
            Absent for playlist/station jobs, before the input is resolved,
            or for jobs resolved before this field existed.
        artist_url:
          type: string
          description: >-
            That artist's own page on music.apple.com, read from the artist
            resource Apple includes with the resolved collection
            (attributes.url). A client linking the artist should use this
            rather than searching `artist_name`. Present alongside
            `artist_name` for song/album/artist jobs; absent for
            playlist/station jobs (their display name is a curator, not an
            artist), before the input is resolved, for jobs resolved before
            this field existed, and in the rare case where the catalog
            response carries no artist relationship.
        curator_name:
          type: string
          description: >-
            Display curator resolved from Apple Music metadata: the playlist's
            curatorName (falling back to its artistName), or the station's
            provider label. Absent for song/album/artist jobs, before the
            input is resolved, or for jobs resolved before this field existed.
        release_date:
          type: string
          description: >-
            Release date (YYYY-MM-DD) of the album or song. Absent for other
            job types, before the input is resolved, or for jobs resolved
            before this field existed.
        genre:
          type: string
          description: >-
            Primary genre of the album or song — the first Apple Music
            genreNames entry that is not the generic "Music" umbrella genre.
            Absent for other job types, before the input is resolved, or for
            jobs resolved before this field existed.
        artwork_bg_color:
          type: string
          description: >-
            Background color of the resolved collection artwork, from Apple
            Music's attributes.artwork bgColor: a hex string without a
            leading "#" (e.g. "1a1a1a"). Absent before the input is resolved,
            when the catalog omits the palette, or for jobs resolved before
            this field existed.
        artwork_text_color1:
          type: string
          description: >-
            Primary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor1: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color2:
          type: string
          description: >-
            Secondary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor2: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color3:
          type: string
          description: >-
            Tertiary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor3: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color4:
          type: string
          description: >-
            Quaternary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor4: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        motion_artwork_url:
          type: string
          description: >-
            HLS master playlist for the album's animated cover (1:1), from Apple
            Music's attributes.editorialVideo motionDetailSquare. A public,
            unsigned URL that a client can hand straight to a video player.

            Only album and song jobs can have one, and only some albums do. It is
            resolved out of band after the input resolves, so a freshly started
            job reports it absent and gains it moments later, announced by a
            motion_artwork_resolved event. Treat absent as "no animated cover"
            and re-render when the job updates.

            That event is an overview milestone, so the downloads feed
            (GET /api/v1/downloads/events) both pushes it live and replays it
            from a cursor. Follow the feed rather than the per-job stream for
            this one field: short jobs commonly resolve their cover after
            reaching a terminal status, by which point the per-job stream has
            already closed.
        motion_artwork_tall_url:
          type: string
          description: >-
            The 3:4 variant of motion_artwork_url (motionDetailTall), for
            full-bleed presentations. Present and absent under the same
            conditions.
        motion_artwork_bg_color:
          type: string
          description: >-
            Background color for the 1:1 animated cover, from that variant's
            previewFrame. Hex without a leading "#".

            This is NOT artwork_bg_color. Each asset carries its own palette and
            they differ sharply — one album reports 598090 with near-black text
            for the still cover, 5c6786 with near-white text for the square loop,
            and 05104b with light text for the tall one. Apple Music pairs the
            palette with whichever asset it displays; mixing the still palette
            with a motion asset yields dark text on a dark video.
        motion_artwork_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_bg_color.
        motion_artwork_tall_bg_color:
          type: string
          description: >-
            Background color for the 3:4 animated cover, from the tall variant's
            previewFrame. Use this one when presenting motion_artwork_tall_url.
        motion_artwork_tall_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_tall_bg_color.
        force:
          type: boolean
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            The configuration overrides submitted with the job; omitted when none
            were given. media_user_token is writeOnly: even while a failed job
            keeps it internally for retries, no job response ever includes its
            value.
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        total_items:
          type: integer
        done_items:
          type: integer
        failed_items:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ItemProgress:
      type: object
      description: >-
        Per-stage breakdown of one item's download pipeline. Replaces the single
        0..1 `progress` aggregate that used to span every stage on one axis:
        download and decrypt shared sub-ranges of it, and the atomic stages were
        only fixed points — 0.97 never meant "97% tagged", just "tagging
        started".

        The two stages that genuinely have a fraction get their own meter; every
        other stage is a done/not-done flag. There is deliberately no overall
        percentage: any single number would have to re-impose the arbitrary
        weighting this object exists to remove. A client that wants one bar
        should weight these fields to suit its own UI.

        All fields are always present. The zero value means nothing has run yet,
        which is what a queued item reports. Use `status`, not this object, to
        decide whether an item is finished — a `skipped_existing` item reports
        `resolved` true (the catalog lookup is what produced the path found to
        already exist) with every later stage false, because the file was
        already on disk and nothing downloaded, decrypted, or wrote it.

        A codec fallback or retry resets the breakdown to `resolved` only, so
        the meters and flags always describe the attempt currently in flight,
        never one that already failed.
      required: [download, decrypt, resolved, remuxed, verified, tagged, saved]
      properties:
        download:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted media transferred. Stays at 0
            while the transfer cannot be measured (a media response without a
            Content-Length never yields a fraction), so 0 alongside
            status=downloading means "running, size unknown", not "no bytes
            yet". Pinned to 1 when the item completes.
        decrypt:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted bytes fed through the decryptor.
            The aac-lc path decrypts in one opaque pass with no intermediate
            count, so there it jumps 0 → 1 at the remux boundary instead of
            sweeping. Pinned to 1 when the item completes.
        resolved:
          type: boolean
          description: Catalog metadata for the track was fetched.
        remuxed:
          type: boolean
          description: >-
            The decrypted stream was flattened into a progressive MP4.
        verified:
          type: boolean
          description: >-
            The integrity check ran and passed (for ALAC, possibly after a
            successful repair). Also false when the check is switched off by
            the `download.check_integrity` config key, so false means "not
            verified", never "corrupt" — a failed check fails the whole item
            instead. This is the one flag a completed item may legitimately
            leave false.
        tagged:
          type: boolean
          description: >-
            Metadata — and cover art / lyrics, per config — was written into
            the file.
        saved:
          type: boolean
          description: >-
            The finished file was moved to its final output path. This is the
            last step of the pipeline, so `saved` is true for exactly those
            items that reached status=completed.
    JobItem:
      type: object
      required: [id, job_id, adam_id, kind, index, has_lyrics, status, progress, created_at, updated_at]
      properties:
        id: {type: string}
        job_id: {type: string}
        adam_id: {type: string}
        kind: {type: string}
        index: {type: integer}
        title: {type: string}
        artist: {type: string}
        album: {type: string}
        duration_ms:
          type: integer
          description: >-
            Track playback duration in milliseconds, resolved from the Apple
            Music catalog alongside title/artist/album (available before the
            download runs). 0/absent for items created before this field
            existed or when the catalog omits it; a retry keeps it.
        artwork_url:
          type: string
          description: >-
            Track cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. Absent for items created before this field existed.
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Set when the collection resolves and
            refreshed when the track's own metadata is fetched. Catalog
            metadata only — it does not guarantee the lyrics can actually
            be fetched at download time. Defaults to false for items
            created before this field existed, until the item is next
            re-processed (e.g. by a retry).
        lyrics_status:
          type: string
          enum: [fetched, failed, none, disabled]
          description: >-
            Durable outcome of this download attempt's lyrics fetch,
            complementing has_lyrics (the catalog's claim) with what
            actually happened. `fetched`: lyrics were fetched and
            converted successfully (the download that follows embeds
            and/or saves them per the config — the flag reflects the
            fetch outcome only; whether the file was produced is the
            item's own status); `failed`: the catalog reported lyrics but
            fetching or converting them failed and the download continued
            without lyrics; `none`: the catalog reports no lyrics for
            this track; `disabled`: lyrics exist but neither embed_lyrics
            nor save_lyrics_file is enabled. Absent while undetermined
            (item not yet processed, or created before this field
            existed) and cleared when a retry re-processes the item.
            For finished (completed/skipped) items the value keeps
            describing the download that produced the file on disk,
            while has_lyrics may be refreshed by a later re-resolve —
            e.g. has_lyrics=true with lyrics_status=none means the file
            predates lyrics becoming available in the catalog.
        status:
          type: string
          description: >-
            Current pipeline state. `waiting_download` and `waiting_decrypt`
            mean the item is queued at the corresponding global concurrency
            pool; `downloading` and `decrypting` begin only after that pool has
            admitted the item.
          enum: [queued, resolving, waiting_download, downloading, waiting_decrypt, decrypting, remuxing, tagging, saving, completed, failed, skipped_existing, cancelled]
        progress:
          $ref: '#/components/schemas/ItemProgress'
        codec: {type: string}
        bit_depth:
          type: integer
          description: >-
            Bit depth of the codec currently being attempted (e.g. 24 for
            ALAC lossless). 0/absent for lossy codecs (e.g. AAC/AAC-LC) and
            before the codec's quality has been resolved.
        sample_rate:
          type: integer
          description: >-
            Sample rate in Hz of the codec currently being attempted (e.g.
            96000). 0/absent for aac-lc (no per-track manifest to read it
            from) and before the codec's quality has been resolved.
        bitrate:
          type: integer
          description: >-
            Bitrate in bits per second of the codec currently being
            attempted; for lossless codecs this is the HLS variant's
            advertised average bandwidth, not a true constant bitrate.
            0/absent for aac-lc (no per-track manifest to read it from) and
            before the codec's quality has been resolved.
        file_size:
          type: integer
          format: int64
          description: >-
            Size in bytes of the final output file, set once the track is
            written to disk (completed) or found already present
            (skipped_existing). 0/absent until then, and for items produced
            before this field existed or whose file could not be stat'd.
        retry_kind: {type: string}
        attempt: {type: integer}
        max_attempts: {type: integer}
        status_message: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DownloadList:
      type: object
      required: [downloads, status_counts, total, limit, offset, last_event_id]
      properties:
        downloads:
          type: array
          description: >-
            Download jobs on the current page; each job's done_items/failed_items
            are computed from the live progress of its job_items (rather than the
            stored counts that are refreshed only at terminal states).
          items:
            $ref: '#/components/schemas/Job'
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: Job status counts matching the current query filters, unaffected by limit/offset.
        total:
          type: integer
          description: Total number of jobs matching the current filters (unaffected by limit/offset).
        limit:
          type: integer
          description: The page size actually used.
        offset:
          type: integer
          description: The offset actually used.
        last_event_id:
          type: integer
          format: int64
          description: >-
            The latest persisted event id globally (across all jobs; 0 when there
            are no events yet). Clients can use it as the resume point for the
            overview event stream GET /downloads/events(/ws) to receive only list
            changes after this snapshot.
    DownloadStatusCounts:
      type: object
      description: >-
        Always returns all five job statuses; statuses with no matching jobs are
        0, and total is the sum of the five statuses.
      required: [queued, running, completed, failed, cancelled, total]
      properties:
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    DownloadFeedMessage:
      type: object
      required: [type, status_counts]
      description: >-
        One push on the overview event stream (GET /downloads/events(/ws)). Every
        job creation, status change or deletion carries the latest global job
        status counts.
      properties:
        type:
          type: string
          enum: [download_upserted, download_deleted]
          description: >-
            download_upserted: a job was created or changed, and job is its latest
            snapshot; download_deleted: a job was deleted, and job_id is the
            deleted job's id.
        job:
          $ref: '#/components/schemas/Job'
        job_id:
          type: string
          description: Present only for download_deleted; the id of the deleted job.
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: >-
            Status counts of all current jobs; the live push endpoints have no list
            filter parameters, so these are always global counts. In
            download_deleted the deleted job has already been subtracted.
        event_id:
          type: integer
          format: int64
          description: >-
            Resume cursor. For download_upserted it is the id of the milestone
            event that triggered this job snapshot; for download_deleted it is the
            id of the deletion tombstone event (neither is the largest id pushed in
            the same batch). After processing, clients use it as the next resume
            point; it strictly increases from message to message. On reconnect,
            undelivered updates are only ever resent (upsert and delete are both
            idempotent), never skipped.
    DownloadDetail:
      type: object
      required: [job, items, hooks, last_event_id]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        hooks:
          type: array
          description: >-
            The latest state of each post-download hook that has fired, derived
            from the hook_started/hook_succeeded/hook_failed events in the event
            stream — the snapshot endpoint and the SSE/WS event stream are two ways
            to read the same state. An empty array when the job has not fired any
            hook yet (including when no hook is configured or the job has not
            finished).
          items:
            $ref: '#/components/schemas/HookState'
        last_event_id:
          type: integer
          format: int64
          description: >-
            The latest persisted event id for this job (0 when there are no events
            yet). Clients can use it as the resume point for events/ws (or SSE's
            Last-Event-ID) to skip the historical events already reflected in this
            response and receive only later incremental updates.
    HookState:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The name of this hook entry in hooks.yaml.
        status:
          type: string
          enum: [running, succeeded, failed, interrupted]
          description: >-
            running: the hook is executing; succeeded: it ran successfully; failed:
            it still failed after its retries were exhausted; interrupted: the event
            records show the hook started but have no terminal record, and it is
            not running now either (usually the service restarted while it ran, so
            this hook will never produce a result).
        error:
          type: string
          description: The last error message when status is failed; omitted for other statuses.

  /api/v1/playlists/{playlist_id}:
    get:
      tags: [Search]
      summary: Get a playlist and its songs
      description: |
        A catalog playlist's metadata and its song list in the playlist's own
        order: the songs a playlist download (POST /api/v1/downloads with the
        playlist's url) takes, music videos excluded. The answer has the shape
        of AlbumResponse (PlaylistResponse). The whole list comes in one
        answer, bounded by 15 seconds like GET /api/v1/albums/{album_id}. A
        song's url submitted to POST /api/v1/downloads downloads that song
        alone.

        resource is the playlist's record and each song's state its main slot
        state there, read from the records and never from the disk.
      operationId: getPlaylist
      parameters:
        - name: playlist_id
          in: path
          required: true
          description: The playlist's Apple Music catalog id, the id of a playlist search hit ("pl." and Apple's letters, digits and dashes).
          schema:
            type: string
            pattern: '^pl\.[A-Za-z0-9._-]{1,200}$'
        - $ref: '#/components/parameters/BrowseStorefront'
      responses:
        '200':
          description: The playlist and its songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResponse'
        '400':
          description: invalid_request; the playlist id is not a catalog playlist id, or storefront is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the playlist id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 15 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/library/summary:
    get:
      tags: [Library]
      summary: Count the records per state and flag
      description: |
        Album and playlist records per state (none, partial, complete) and per
        flag, pending adds per state, and the running or last disk check (a
        finished check of a record removed since is skipped).
      operationId: getLibrarySummary
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySummary'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/albums:
    get:
      tags: [Library]
      summary: List album records
      description: |
        The album records amdl keeps: what is downloaded is what they say, never
        what is on disk. state and flag take several values (repeat or comma
        separate); a record matches any of them. Newest added first by default.
      operationId: listLibraryAlbums
      parameters:
        - $ref: '#/components/parameters/RecordState'
        - $ref: '#/components/parameters/RecordFlag'
        - $ref: '#/components/parameters/RecordSource'
        - $ref: '#/components/parameters/RecordQuery'
        - $ref: '#/components/parameters/RecordSort'
        - $ref: '#/components/parameters/RecordLimit'
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: One page of album records.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlbumResource'
                  total: {type: integer, description: Records that match the filters.}
                  limit: {type: integer}
                  offset: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/albums/{id}:
    get:
      tags: [Library]
      summary: Get an album record with its tracks and slots
      operationId: getLibraryAlbum
      parameters:
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: The record, its tracks in list order and each one's quality slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/playlists:
    get:
      tags: [Library]
      summary: List playlist records
      description: As GET /api/v1/library/albums, for catalog playlists (pl. ids).
      operationId: listLibraryPlaylists
      parameters:
        - $ref: '#/components/parameters/RecordState'
        - $ref: '#/components/parameters/RecordFlag'
        - $ref: '#/components/parameters/RecordSource'
        - $ref: '#/components/parameters/RecordQuery'
        - $ref: '#/components/parameters/RecordSort'
        - $ref: '#/components/parameters/RecordLimit'
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: One page of playlist records.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaylistResource'
                  total: {type: integer, description: Records that match the filters.}
                  limit: {type: integer}
                  offset: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/playlists/{id}:
    get:
      tags: [Library]
      summary: Get a playlist record with its songs and slots
      operationId: getLibraryPlaylist
      parameters:
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: The record, its songs by position (removed ones included) and each one's slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/add:
    post:
      tags: [Library]
      summary: Add links to the library
      description: |
        POST /api/v1/downloads with three more fields: codecs (the codec order
        of the main slots the add creates), now (each queued run starts next)
        and include (an artist link's albums). The answer is the same.
      operationId: addToLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryAddRequest'
      responses:
        '202':
          description: At least one URL was taken; see results for the per-URL outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            no_urls_accepted: every URL was rejected, and error.details is the
            BatchSubmitResponse; invalid_overrides: overrides failed configuration
            validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            store_error (or internal_error): no URL was taken and at least one
            failed on the server side; error.details is the BatchSubmitResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/library/reset:
    post:
      tags: [Library]
      summary: Reset every record a filter selects
      description: |
        POST /api/v1/library/{kind}/{id}/reset for each album and playlist
        record the filter selects (kind limits it to one kind). A record with a
        queued or running run is skipped and counted in skipped_active. An
        audio reset of records selected by the failed, given_up or missing flag
        re-arms only the slots in that state unless states says otherwise, so
        "download missing" is {"what": "audio", "filter": {"flag": ["missing"]}}.
        A filter that names nothing is refused.
      operationId: resetLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryResetRequest'
      responses:
        '200':
          description: How many records were reset and skipped.
          content:
            application/json:
              schema:
                type: object
                required: [reset, skipped_active]
                properties:
                  reset: {type: integer}
                  skipped_active: {type: integer}
        '400':
          $ref: '#/components/responses/InvalidScope'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/check:
    get:
      tags: [Library]
      summary: Show the running or last disk check
      operationId: getLibraryCheck
      responses:
        '200':
          description: >-
            The check; null before the first. A finished check of a record
            removed since is skipped.
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check:
                    oneOf:
                      - $ref: '#/components/schemas/CheckRun'
                      - type: 'null'
        '500':
          $ref: '#/components/responses/StoreError'
    post:
      tags: [Library]
      summary: Check the stored files on disk
      description: |
        Starts a disk check in the background: it stats the stored path of
        every done slot (audio files only) of the library, or of one record,
        and marks the missing ones missing. It never marks a found file, moves
        a file or queues a download; download the missing slots again with a
        reset. Two guards: download.downloads_dir must exist (503
        downloads_dir_unavailable), and when more than half the checked files
        are missing the check ends with aborted_reason too_many_missing and
        marks nothing, unless force is set (an unmounted share must not mark a
        whole library missing). One check runs at a time; the overview feed
        sends check_updated as it moves on.
      operationId: startLibraryCheck
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '202':
          description: The check started.
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check:
                    $ref: '#/components/schemas/CheckRun'
        '400':
          $ref: '#/components/responses/InvalidScope'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: check_running; a check is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: downloads_dir_unavailable; download.downloads_dir is missing or not a directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/pending:
    get:
      tags: [Library]
      summary: List pending adds
      description: |
        Adds that need a catalog read before they become records: a song
        without its album, an artist, a library playlist's songs. The resolver
        reads them in the background; one it gave up on is failed with its
        last_error and waits for a retry or a delete.
      operationId: listLibraryPending
      parameters:
        - name: state
          in: query
          description: Only adds in this state; every add when absent.
          schema:
            type: string
            enum: [pending, failed]
      responses:
        '200':
          description: The adds, oldest first by class.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingAdd'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/pending/{pending_id}:
    delete:
      tags: [Library]
      summary: Drop a pending add
      operationId: deleteLibraryPending
      parameters:
        - $ref: '#/components/parameters/PendingID'
      responses:
        '204':
          description: The add is gone.
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/pending/{pending_id}/retry:
    post:
      tags: [Library]
      summary: Read a failed pending add again
      operationId: retryLibraryPending
      parameters:
        - $ref: '#/components/parameters/PendingID'
      responses:
        '200':
          description: The add, pending again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingAdd'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/{kind}/{id}/download:
    post:
      tags: [Library]
      summary: Download a record now, or another quality of it
      description: |
        Resumes the record and queues its run when it needs one. codec adds
        that quality as another slot of each track (of songs, or every track)
        whose main slot is done; its file is named with a quality suffix. now
        moves the run to the front.
      operationId: downloadLibraryRecord
      parameters:
        - $ref: '#/components/parameters/RecordKind'
        - $ref: '#/components/parameters/RecordID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDownloadRequest'
      responses:
        '200':
          description: >-
            Nothing was queued: already_downloaded (every wanted track is done)
            or waiting (the queue is full and the scheduler queues it later,
            or the record is gone from the catalog). Failed, given-up and
            missing slots are set pending first, as a retry does.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [already_downloaded, waiting]
        '202':
          description: The record's run is queued or running.
          content:
            application/json:
              schema:
                type: object
                required: [status, job]
                properties:
                  status:
                    type: string
                    const: queued
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: >-
            main_not_done: no asked-for track has its first quality done;
            quality_present: the first quality already is that codec, or is a
            file of unknown quality (one adopted at the track's path whose
            codec could not be read).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/{kind}/{id}/reset:
    post:
      tags: [Library]
      summary: Download a record's files, lyrics or covers again
      description: |
        Re-arms slots of one record and queues a run (trigger reset). all
        re-arms every slot, clears failures and the paused flag and rewrites the
        covers; audio re-downloads the selected slots (slot, songs, states),
        and a done file is replaced at its stored path only once the new copy
        is complete; codecs, with slot main, become the main slots' codec
        order; lyrics fetches the lyrics of done slots again and rewrites the
        file's tag and sidecars; covers rewrites the cover files. A record with
        a queued or running run is refused: pause it first.
      operationId: resetLibraryRecord
      parameters:
        - $ref: '#/components/parameters/RecordKind'
        - $ref: '#/components/parameters/RecordID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResetRequest'
      responses:
        '200':
          description: >-
            slots is how many slots went back to pending; job is the queued
            run, null when nothing needs one, the record is paused or the queue
            is full.
          content:
            application/json:
              schema:
                type: object
                required: [slots, job]
                properties:
                  slots: {type: integer}
                  job:
                    oneOf:
                      - $ref: '#/components/schemas/Job'
                      - type: 'null'
        '400':
          $ref: '#/components/responses/InvalidScope'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/RunActive'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/{kind}/{id}/pause:
    post:
      tags: [Library]
      summary: Pause a record
      description: |
        The scheduler stops queuing runs for the record, and its queued or
        running run is cancelled; running slots go back to pending and resume
        checkpoints stay, so a resume continues partial downloads. The answer
        comes once that run has ended (up to 10 s), so a delete or reset
        right after it is not refused.
      operationId: pauseLibraryRecord
      parameters:
        - $ref: '#/components/parameters/RecordKind'
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: The record, as GET /api/v1/library/{kind}/{id} answers it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/{kind}/{id}/resume:
    post:
      tags: [Library]
      summary: Resume a paused record
      operationId: resumeLibraryRecord
      parameters:
        - $ref: '#/components/parameters/RecordKind'
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: The record; the scheduler queues its run when it needs one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/library/{kind}/{id}:
    delete:
      tags: [Library]
      summary: Remove a record from amdl
      description: |
        Deletes the record with its tracks, slots, resume checkpoints and runs;
        each run's deletion reaches the feeds as job_deleted, and the record's
        as resource_deleted. The files on disk
        stay. The library monitor does not
        add it back; adding it by hand does, and its first run takes a file
        still at a track's path as that track's download instead of
        downloading it again.
      operationId: deleteLibraryRecord
      parameters:
        - $ref: '#/components/parameters/RecordKind'
        - $ref: '#/components/parameters/RecordID'
      responses:
        '204':
          description: The record is gone.
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/RunActive'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads:
    get:
      tags: [Downloads]
      summary: List download jobs
      description: |
        Returns a snapshot of the download job list, with pagination,
        status, type, record and trigger filters, and substring search over
        title, artist and input URL. Each download of a record is its own job
        (run), so the list is history. Sorted by created_at descending by default. Other query
        parameters are ignored.
        Multi-value parameters (status, type) accept repeated keys or comma
        separation; for example `status=failed&status=cancelled` is equivalent to
        `status=failed,cancelled`.
      operationId: listDownloads
      parameters:
        - name: limit
          in: query
          description: Number of jobs to return; default 50, maximum 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of jobs to skip, for pagination; default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: >-
            Filter by job status; repeat the parameter or separate values with
            commas. Allowed values: queued, running, completed, failed, cancelled.
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, completed, failed, cancelled]
          style: form
          explode: true
        - name: type
          in: query
          description: >-
            Filter by job type; repeat the parameter or separate values with commas.
            Allowed values: song, album, playlist, artist, station.
          schema:
            type: array
            items:
              type: string
              enum: [song, album, playlist, artist, station]
          style: form
          explode: true
        - name: resource_kind
          in: query
          description: >-
            Only runs of records of this kind; none keeps the runs of no
            record (stations, a library playlist without a catalog id, the
            1.x history the import made no record for), as the queues list
            them beside the records.
          schema:
            type: string
            enum: [album, playlist, none]
        - name: resource_id
          in: query
          description: Only runs of the record with this catalog id.
          schema:
            type: string
        - name: trigger
          in: query
          description: >-
            Filter by what started the run; repeat the parameter or separate
            values with commas.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RunTrigger'
          style: form
          explode: true
        - name: current
          in: query
          description: >-
            true keeps only the runs nothing has replaced: a run is left out
            once its record has a newer run (a station's run, once its link
            has one) or its record is complete with no failed, given-up or
            missing slot.
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: >-
            Substring search over the job's title, artist name and input (SQLite LIKE;
            case-insensitive for ASCII letters). `%` and `_` match literally.
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            Sort field; default created_at. Jobs that tie on it (a batch submitted
            together shares one created_at) list in submission order, whatever the
            order parameter says. queue_order lists the queued jobs in run order
            (with order=asc, the job that starts next comes first) ahead of every
            other job, which follow in submission order; combine it with
            status=queued to page through the queue.
          schema:
            type: string
            enum: [created_at, updated_at, queue_order]
            default: created_at
        - name: order
          in: query
          description: Sort direction; default desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Snapshot of the download job list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
        '400':
          description: invalid_request; invalid query parameters (unknown enum value, bad time format, limit/offset out of range, and so on).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
    post:
      tags: [Downloads]
      summary: Add links (alias of POST /library/add)
      description: >-
        Submits a batch of URLs and returns the enqueue result for each one;
        duplicate, unsupported or queue-full URLs are flagged individually in
        results without affecting the other URLs. Each URL that was not accepted
        carries an error object (SubmitError) with a stable code. The answer is
        202 with the BatchSubmitResponse when at least one URL was accepted. When
        none was, it is an ErrorResponse whose details is the BatchSubmitResponse:
        500 store_error if any URL failed in the job store (status error; the same
        submit may succeed when retried), 500 internal_error if the only server
        failure was an unexpected validator error, else 422 no_urls_accepted.
        Accepted, pending and already_downloaded count as accepted. An album,
        an album-track link, a song link whose song an album record already
        lists and a catalog playlist (pl.) add or extend a record and queue
        its run (job) when the record needs one; any other song without its
        album, an artist and a library playlist's songs become pending adds
        that the resolver reads into records (status pending, no job yet); a
        record whose every wanted track is done answers already_downloaded and
        queues nothing; a station is a one-off run. Each download is a new
        job. The optional overrides field is stored on the record and applies
        to its runs. The media-user-token is the account's, which amdl reads
        from the wrapper (never one from the request), and every enabled hooks.yaml entry that matches runs for
        every job.
      operationId: createDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '202':
          description: At least one URL was enqueued; see results for the per-URL outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: >-
            invalid_json: the body cannot be parsed; invalid_request: it contains
            unknown fields (for example media_user_token at the top level or
            inside overrides, a key overrides does not carry such as hooks,
            downloads_dir or the removed force_overwrite, or a misspelled key),
            urls is empty, or it exceeds the
            per-request limit (100 URLs). The message names the unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            no_urls_accepted: every URL was rejected, and error.details is the
            BatchSubmitResponse with each URL's reason; invalid_overrides:
            overrides failed configuration validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            store_error (or internal_error): no URL was accepted and at least one
            failed on the server side (status error); error.details is the
            BatchSubmitResponse. Retry the submit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/downloads/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download list changes (SSE)
      description: |
        Overview event stream: GET /downloads is a one-off snapshot of the list,
        while this endpoint pushes incremental changes live as the list changes;
        both are ways to read the same state. Each push is a DownloadFeedMessage:
        - download_upserted: a job was created or changed (queued, started,
          progress as each song finishes, terminal state); data.job is the job's
          latest snapshot (item counters derived from its items);
        - download_deleted: a job was deleted; data.job_id is the deleted job's id;
        - resource_updated: after a download_upserted of a record's run, or
          when the record changed outside its runs (paused, resumed, reset,
          added to, asked for again, files found missing), the record's
          latest state; data.resource is the record (AlbumResource or
          PlaylistResource), data.resource_kind and data.resource_id name it;
        - resource_deleted: the record named by data.resource_kind and
          data.resource_id was deleted;
        - check_updated: a disk check started, moved on or ended; data.check
          is the CheckRun. It is no event: it carries the event_id already
          reached, and a client that reconnects reads GET /library/check.
        Every message type carries status_counts, the latest status counts of all
        jobs at the moment the message was generated; in a delete message the
        deleted job has already been subtracted.
        Only "milestone" events that affect how the list is displayed trigger a
        push (created/recovered/started/moved in the queue/input
        resolved/animated cover resolved/song completed, skipped,
        unavailable, lyrics refreshed or failed/terminal state/deleted);
        per-track progress events are not pushed. Instead, every 2 seconds the
        feed sends a download_upserted for each running job whose progress has
        moved since it was last sent, with the event_id already reached.
        A move (POST /downloads/{job_id}/move) pushes a download_upserted for
        the moved job with its new queue_order; queued jobs sort by queue_order,
        so a client re-sorts and needs nothing else. When the queue had to be
        renumbered, every job whose queue_order changed gets its own
        download_upserted.
        The animated cover is the only kind of change that can still arrive after a
        job reaches a terminal state: it is resolved out of band, and by then the
        per-job event stream has usually closed, so only this endpoint delivers it.
        Resuming: first GET /downloads to obtain event_cursor, then connect with
        ?cursor=<event_cursor> (or the Last-Event-ID header) to receive only the
        changes made after that snapshot. Never connect without a cursor: that
        replays the whole retained milestone history. download_upserted and
        download_deleted both carry event_id, which is also the SSE id; after
        processing each message, the client uses it as its new resume cursor.
        The feed never ends on its own.
      operationId: streamDownloadsFeed
      parameters:
        - $ref: '#/components/parameters/StreamCursor'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: SSE event stream; each data is one DownloadFeedMessage.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/downloads/{job_id}:
    get:
      tags: [Downloads]
      summary: Get download job details
      operationId: getDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job, its items, its hook states and the event cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDetail'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
    delete:
      tags: [Downloads]
      summary: Delete a download job
      description: >-
        Deletes a job in a terminal state (completed/failed/cancelled) together
        with its items and event records. A queued or running job must be
        cancelled first. With record=true a record's run deletes its record
        instead, as DELETE /library/{kind}/{id} does (the record's other runs
        go too, its files stay): what the desktop app, the console, the CLI
        and the MCP server do when a run is deleted.
      operationId: deleteDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
        - name: record
          in: query
          description: >-
            true deletes the record a record's run downloads for, with all its
            runs; a station's run is deleted alone either way.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The job, or with record=true its record, has been deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status, deleted]
                properties:
                  status:
                    type: string
                    const: deleted
                  deleted:
                    type: string
                    enum: [job, record]
                    description: What was deleted.
                  resource:
                    $ref: '#/components/schemas/ResourceRef'
                    description: The record deleted, when deleted is record.
        '400':
          description: invalid_request; record is not true or false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: >-
            job_active; the job is still queued or running (cancel it first),
            finalizing, or running a hook. With record=true, run_active: the
            record has a queued or running run (pause it first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/cancel:
    post:
      tags: [Downloads]
      summary: Cancel a download job
      description: |
        A station run is cancelled and its scratch removed. A record's run is
        not cancelled on its own: its record is paused (POST
        /api/v1/library/{kind}/{id}/pause), which cancels the run, keeps its
        resume checkpoints and stops the record from being queued again until
        it is resumed. Clients label the action Pause for a record's run.
      operationId: cancelDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job has been cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: cancelled
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: >-
            job_not_cancellable; the job already ended completed or failed. A
            cancelled job answers 200 again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/retry:
    post:
      tags: [Downloads]
      summary: Retry a failed or cancelled download job
      description: |
        Starts a failed or cancelled job's download again as a new job, which
        the answer names. For a record's run it resumes the record, re-arms the
        record's failed, given-up and missing slots and queues a run with
        trigger reset; done slots stay done. When no run is queued it answers 200, as POST
        /library/{kind}/{id}/download does. For a station it queues a new run
        of the same link and overrides. The new job fires job_queued like any
        other.
      operationId: retryDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: >-
            A record's run queued nothing: already_downloaded (every wanted
            track is done) or waiting (slots are left that no run takes now:
            the queue is full and the scheduler queues it later, or the record
            is gone from the catalog).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [already_downloaded, waiting]
        '202':
          description: A new job was queued.
          content:
            application/json:
              schema:
                type: object
                required: [status, job]
                properties:
                  status:
                    type: string
                    const: queued
                  job:
                    $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: |
            job_not_retryable: the job is not in the failed or cancelled state,
            or its stored download overrides cannot be read (remove it and add
            its link again); duplicate_active: the record, or the station link,
            already has a queued or running job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: queue_full; the job queue is full, retry later (a station's run).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/move:
    post:
      tags: [Downloads]
      summary: Move a queued download job in the run order
      description: |
        Changes which queued job starts next. When a worker frees up it starts
        the queued job with the lowest queue_order; this places the job before
        or after another queued job, or first or last. Set exactly one of
        before, after and to. Only queued jobs have a place in the run order:
        running and finished jobs cannot be moved or used as the anchor.
        Naming the job itself, or a place it already has, changes nothing.
        A move records a job_moved event (an overview milestone) for the moved
        job, so the overview feed pushes its new queue_order. Usually only the
        moved job's queue_order changes; when no value is left between its new
        neighbors the queue is renumbered and every job whose value changed
        gets its own job_moved.
      operationId: moveDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: The job's place in the run order; job is its snapshot with the new queue_order.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          description: >-
            invalid_json: the body cannot be parsed; invalid_request: it has
            unknown fields, sets none or more than one of before, after and to,
            or to is not first or last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: >-
            job_not_queued: the job is not queued (it started or finished), or
            the job named in before or after is not queued or no longer exists;
            the message names it. Refetch the queue and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download job events
      description: |
        Server-Sent Events stream of one job, resumable from the Last-Event-ID
        header or ?cursor= (seed it from event_cursor of GET
        /downloads/{job_id}). Each SSE event is named after its EventType, its id
        is the event id, and its data is an Event object, whose payload is a JSON
        object. The payload of job lifecycle events
        (job_queued/job_recovered/job_retried/job_started/job_moved/resolved_input/job_finished/job_failed/job_cancelled)
        contains the same public fields as the REST `Job`; the payload of track
        status events contains the same public fields as the REST `JobItem` and
        keeps the event's own specific fields (e.g. download_attempts,
        will_retry). Clients can therefore merge events directly, without an extra
        GET after the terminal event to obtain the complete final state.
        When the job is already in a terminal state (completed/failed/cancelled):
        if there are historical events not yet delivered to this client (including
        the terminal event itself, and the hook_started/hook_succeeded/hook_failed
        events of post-download hooks still running — hooks fire asynchronously
        and may be recorded only after the job reaches its terminal state), those
        events are replayed as-is first; the connection stays open while any hook
        is still running and closes only once the hooks finish. When the client has
        already caught up on every event and no hook is still running, the answer
        is 204 No Content, which makes a browser EventSource stop reconnecting.
        A browser reports any non-200 answer as a generic error, so a client
        whose stream ended refetches GET /downloads/{job_id} to tell "finished"
        from "broken".
      operationId: streamDownloadEvents
      parameters:
        - $ref: '#/components/parameters/JobID'
        - $ref: '#/components/parameters/StreamCursor'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '204':
          description: >-
            The job is in a terminal state, no hook is still running, and the client
            has caught up on every event; no new events will be produced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
components:
  parameters:
    HookName:
      name: name
      in: path
      required: true
      description: The hook's name in hooks.yaml.
      schema:
        type: string
      example: notify
    LoginID:
      name: login_id
      in: path
      required: true
      schema:
        type: string
      example: 4f0f2c79acda4c28b69ebf4f702f8a51
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: job_01JZ0000000000000000000000
    LogLevel:
      name: level
      in: query
      description: Comma-separated exact severity levels; allowed values are debug, info, warn and error.
      schema:
        type: string
      example: warn,error
    LogComponent:
      name: component
      in: query
      description: Exact match on the component attribute, e.g. api, jobs, media, catalog, hooks, main.
      schema: {type: string}
    LogRequestID:
      name: request_id
      in: query
      description: Exact match on the HTTP request correlation ID.
      schema: {type: string}
    LogJobID:
      name: job_id
      in: query
      description: Exact match on the download job ID.
      schema: {type: string}
    LogQuery:
      name: q
      in: query
      description: Case-insensitive substring match over the message and structured attributes.
      schema: {type: string}
    LogSince:
      name: since
      in: query
      description: Inclusive lower bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogUntil:
      name: until
      in: query
      description: Inclusive upper bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogCursor:
      name: cursor
      in: query
      description: >-
        Only return entries whose sequence is greater than this value (next_cursor
        of the previous page, or the last SSE id received). A value that is not a
        non-negative integer is 400 invalid_request.
      schema: {type: integer, format: int64, minimum: 0}
    StreamCursor:
      name: cursor
      in: query
      description: >-
        Resume point: replay only events whose id is greater than this value. Use
        event_cursor from the matching snapshot (GET /downloads or GET
        /downloads/{job_id}) for the first connect. Ignored when Last-Event-ID is
        set. A value that is not a non-negative integer is 400 invalid_request.
      schema: {type: integer, format: int64, minimum: 0}
    LastEventID:
      name: Last-Event-ID
      in: header
      description: >-
        Resume point, sent by EventSource on every automatic reconnect; it wins
        over ?cursor=. A value that is not a non-negative integer is 400
        invalid_request.
      schema:
        type: string
        pattern: '^[0-9]+$'
    LogLimit:
      name: limit
      in: query
      description: Maximum number of entries to return or replay; default 200 for queries and 500 for SSE.
      schema: {type: integer, minimum: 1, maximum: 1000}
    BrowseStorefront:
      name: storefront
      in: query
      description: >-
        Two-letter Apple Music storefront code, case-insensitive, normally the
        region of a logged-in account (GET /accounts lists them); default the
        default account's region, else catalog.default_storefront while no
        account is known. Search reads with the token of the account serving
        it, and the hits' links carry it.
      schema:
        type: string
        pattern: '^[A-Za-z]{2}$'
    RecordKind:
      name: kind
      in: path
      required: true
      description: albums or playlists; another value answers 404 resource_not_found.
      schema:
        type: string
        enum: [albums, playlists]
    RecordID:
      name: id
      in: path
      required: true
      description: The record's catalog id, without a storefront.
      schema:
        type: string
    PendingID:
      name: pending_id
      in: path
      required: true
      description: The pending add's id.
      schema:
        type: integer
        format: int64
    RecordState:
      name: state
      in: query
      description: Only records in these states.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RecordState'
      style: form
      explode: true
    RecordFlag:
      name: flag
      in: query
      description: >-
        Only records with any of these flags: failed (a track has a failed
        slot, or the catalog does not have the record: catalog_state is not
        ok), given_up, missing (a track has a slot in that state), waiting (a failed slot of a wanted,
        listed track waits for its automatic retry), paused, unresolved (no
        read listed its tracks yet).
      schema:
        type: array
        items:
          type: string
          enum: [failed, given_up, missing, waiting, paused, unresolved]
      style: form
      explode: true
    RecordSource:
      name: source
      in: query
      description: Only records added this way.
      schema:
        type: string
        enum: [manual, library_sync, artist, import_1x]
    RecordQuery:
      name: q
      in: query
      description: Substring of the name or artist (curator for a playlist), or the exact catalog id.
      schema:
        type: string
    RecordSort:
      name: sort
      in: query
      description: >-
        added (newest first, the default), name, artist, release (newest
        first; a playlist's last modification), or activity (activity_at,
        newest first).
      schema:
        type: string
        enum: [added, name, artist, release, activity]
        default: added
    RecordLimit:
      name: limit
      in: query
      description: Page size; default 50, maximum 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    BrowseOffset:
      name: offset
      in: query
      description: Where the page starts; default 0. Pass a next_offset to read the next page.
      schema:
        type: integer
        minimum: 0
        default: 0
    StatsDays:
      name: days
      in: query
      description: Number of UTC calendar days in the daily series and hook window, ending today; default 14.
      schema: {type: integer, minimum: 1, maximum: 90, default: 14}
  responses:
    AppleLibraryUnavailable:
      description: >-
        apple_library_unavailable; there is no usable media-user-token
        (details.reason no_token, or token_refused when Apple refused it) and
        nothing is cached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResourceNotFound:
      description: resource_not_found; no record (or pending add) has that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RunActive:
      description: run_active; the record has a queued or running run. Pause it first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidScope:
      description: invalid_json, invalid_request or invalid_scope; the body names no valid scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: invalid_request or invalid_json; invalid request parameters or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JSONBodyTooLarge:
      description: request_too_large; the JSON request body exceeds the 1 MiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: authentication_failed; wrong login credentials or verification code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        login_not_found: the two-step login session does not exist or expired;
        account_not_found: no wrapper runs for that account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountNotFound:
      description: account_not_found; no account has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JobNotFound:
      description: job_not_found; no job has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HookNotFound:
      description: hook_not_found; no entry in hooks.yaml has this name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HookReadOnly:
      description: hook_read_only; the entry is a command (exec) hook, which is edited in hooks.yaml itself.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidHooksFile:
      description: invalid_hooks_file; hooks.yaml on disk no longer loads, and nothing was written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HooksNotEditable:
      description: feature_unavailable; this process was started without a hooks.yaml path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >-
        already_logged_in: the account already has a wrapper; login_pending: a
        login for the account (or this session's two-step code) is already in
        progress; account_limit_reached: the wrapper-manager holds its most
        accounts (10, logins in progress included), so log one out first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: >-
        login_unsupported; the wrapper is a bare wrapper-lite, which logs in only
        from its own command line. Log in on the wrapper host instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: upstream_error; the wrapper returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: upstream_timeout; the wrapper login timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: internal_error; an unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StoreError:
      description: store_error; the job store failed. The request may succeed when retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: >-
        The body of every non-2xx JSON response except the 503 of GET
        /api/v1/health.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable explanation; may change between releases.
            details:
              description: >-
                Code-specific data. no_urls_accepted and store_error from POST
                /downloads: the BatchSubmitResponse. config_key_not_mutable:
                {"keys": [...]}, the rejected fields as dotted key names, and
                "reason": "managed_wrapper" when the wrapper this machine runs
                sets wrapper.address. Errors
                of POST /lookup after the link parsed: {"link": LookupLink}.
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code, sent with the status listed here.
        400 invalid_request (query or body validation), invalid_json (the body
        is not well-formed JSON), invalid_scope (a reset or check names no
        valid scope); 401 authentication_failed; 404
        route_not_found, job_not_found, login_not_found, account_not_found,
        catalog_not_found (Apple has no resource with that id), hook_not_found,
        resource_not_found (no record or pending add with that id); 405
        method_not_allowed (with an Allow header); 409 job_active,
        job_not_retryable, job_not_cancellable, job_not_queued,
        duplicate_active, already_logged_in, login_pending,
        account_limit_reached, hook_read_only,
        apple_library_sync_running, run_active (the record has a queued or
        running run; pause it first), main_not_done (another quality needs the
        track's first quality done), quality_present (the first quality is that
        codec or of unknown quality), check_running; 413 request_too_large; 422
        invalid_overrides, config_key_not_mutable, invalid_config, invalid_hook,
        invalid_hooks_file, no_urls_accepted; 500 internal_error, store_error
        (retrying may succeed); 501 login_unsupported; 502 upstream_error; 503 queue_full,
        wrapper_unavailable, wrapper_unauthorized (the wrapper's gateway refused
        wrapper.token), feature_unavailable (the process keeps no log
        history, so the log routes cannot answer, or has no hooks.yaml to
        write), apple_library_unavailable (no usable media-user-token and
        nothing cached), downloads_dir_unavailable (download.downloads_dir is
        missing or not a directory); 504 upstream_timeout.
      enum:
        - invalid_request
        - invalid_json
        - invalid_scope
        - authentication_failed
        - route_not_found
        - job_not_found
        - login_not_found
        - account_not_found
        - catalog_not_found
        - hook_not_found
        - resource_not_found
        - method_not_allowed
        - job_active
        - job_not_retryable
        - job_not_cancellable
        - job_not_queued
        - duplicate_active
        - already_logged_in
        - login_pending
        - account_limit_reached
        - hook_read_only
        - apple_library_sync_running
        - run_active
        - main_not_done
        - quality_present
        - check_running
        - request_too_large
        - invalid_overrides
        - config_key_not_mutable
        - invalid_config
        - invalid_hook
        - invalid_hooks_file
        - no_urls_accepted
        - internal_error
        - store_error
        - login_unsupported
        - upstream_error
        - queue_full
        - wrapper_unavailable
        - wrapper_unauthorized
        - feature_unavailable
        - apple_library_unavailable
        - downloads_dir_unavailable
        - upstream_timeout
    Account:
      type: object
      description: >-
        One Apple Music account the wrapper holds, with amdl's switches for it.
        A wrapper-manager's accounts are its instances, by instance id; a
        wrapper that does not list accounts (a bare wrapper-lite) holds one,
        with id wrapper. amdl
        reads the wrapper's accounts at start, every 10 minutes and after a
        login or logout.
      required: [id, name, region, position, default, library_sync, apple_library, state, added_at, needs_login]
      properties:
        id:
          type: string
          description: The wrapper-manager instance id (stable across logins of one Apple ID), or wrapper.
        name:
          type: string
          description: The Apple ID the account signed in with, as the wrapper reports it; "" when it does not.
          example: a@icloud.com
        region:
          type: string
          description: The account's storefront, lower case; "" while unknown.
          example: jp
        position:
          type: integer
          description: >-
            The account's place in the list. Position 0 is the default account:
            it reads records with no pinned storefront and links whose storefront
            no account serves. Among accounts of one region the lower position's
            token is used.
        default:
          type: boolean
          description: position is 0.
        library_sync:
          type: boolean
          description: The library monitor polls this account (with library_sync.enabled on). A new account starts off.
        apple_library:
          type: boolean
          description: The Apple library cache syncs this account. A new account starts off.
        state:
          type: string
          enum: [active, missing]
          description: >-
            missing: the wrapper no longer reports the account (logged out, its
            subscription ended). Its row and switches stay for when it logs in
            again, but it is not polled and serves no storefront.
        added_at: {type: string, format: date-time}
        seen_at:
          type: string
          format: date-time
          description: The last discovery that found the account.
        needs_login:
          type: boolean
          description: >-
            An active account whose Apple session stopped working in the
            wrapper at the last discovery: the wrapper-manager lists it but
            routes nothing to it, so its region's downloads fail until it
            logs in again.
        media_user_token:
          $ref: '#/components/schemas/AccountToken'
    AccountToken:
      type: object
      description: Where the account's media-user-token comes from. It never carries the token.
      required: [source]
      properties:
        source:
          type: string
          enum: [wrapper, manual, none]
          description: >-
            wrapper: the wrapper's GET /token (or amdl's copy of it); manual: the
            token given with PUT /accounts/{account_id}/media-user-token; none:
            amdl has no token for the account.
        manual:
          type: object
          description: The given token, when there is one.
          required: [mode, set_at, rejected]
          properties:
            mode:
              type: string
              enum: [fallback, override]
            set_at: {type: string, format: date-time}
            rejected:
              type: boolean
              description: Apple refused the given token since it was given or amdl started.
    AccountTokenSet:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The media-user-token, 16 to 4096 base64 or base64url characters; surrounding whitespace is trimmed.
        mode:
          type: string
          enum: [fallback, override]
          default: fallback
    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          description: Every account, the default first.
          items:
            $ref: '#/components/schemas/Account'
    AccountPatch:
      type: object
      additionalProperties: false
      description: At least one property.
      properties:
        library_sync: {type: boolean}
        apple_library: {type: boolean}
        position:
          type: integer
          minimum: 0
          description: >-
            Moves the account there, shifting the ones between; 0 makes it the
            default. A position past the end moves it last.
    AccountDeleted:
      type: object
      required: [deleted, logged_out]
      properties:
        deleted: {type: string, description: The deleted account's id.}
        logged_out:
          type: boolean
          description: The wrapper logged the account out; false when it was missing or the wrapper no longer knew it.
    WrapperStatus:
      type: object
      required: [ready, logged_in, regions, login_supported, token_set]
      properties:
        ready:
          type: boolean
          description: >-
            The wrapper answered; for a wrapper-manager, also that it has
            restored its accounts after a start.
        logged_in:
          type: boolean
          description: An account is logged in and serves at least one storefront.
        regions:
          type: array
          description: >-
            Storefronts the wrapper's accounts serve, each once; an empty array
            when none. The accounts are GET /accounts.
          items:
            type: string
        login_supported:
          type: boolean
          description: >-
            The wrapper is a wrapper-manager or a managed wrapper, so POST
            /wrapper/login and /wrapper/logout work. False for a bare
            wrapper-lite, which those routes answer with 501 login_unsupported;
            no login can start there, so /wrapper/login/{login_id}/2fa has no
            session to find.
        managed:
          $ref: '#/components/schemas/ManagedWrapper'
        token_set:
          type: boolean
          description: >-
            wrapper.token is set: amdl sends it as a bearer key to a wrapper
            behind a gateway or proxy. The key itself is never in a response.
    ManagedWrapper:
      type: object
      description: >-
        Present only when amdl runs the wrapper on this machine (amdl wrapper
        install), in a QEMU guest or, on Linux x86_64, natively. While it
        starts or is stopped,
        GET /wrapper/status answers 200 with ready false instead of 503.
      required: [mode, accel, accel_fallback, qemu, guest, login_residue]
      properties:
        mode:
          type: string
          enum: [starting, serving, login, stopped, failed]
        accel:
          type: string
          description: The QEMU accelerator in use, such as kvm, whpx, hvf or tcg (plain emulation), or native when the manager runs as a process of this machine without QEMU.
        accel_fallback:
          type: boolean
          description: The chosen accelerator failed and the guest runs on tcg.
        qemu:
          type: string
          description: The QEMU binary that runs the guest; empty when accel is native.
        guest:
          type: string
          description: The installed guest, named by the commit it was built from or as an import.
        login_residue:
          type: boolean
          description: >-
            The guest disk may still hold the last login's arguments, password
            included: amdl zeroes them before the next serving boot.
        last_error:
          type: string
        download:
          $ref: '#/components/schemas/WrapperDownload'
    WrapperDownload:
      type: object
      description: >-
        The backend's download of the guest's wrapper-lite payload, present
        while mode is starting and the guest has not booted for want of it.
      required: [done_bytes, total_bytes]
      properties:
        done_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database_error:
          type: string
    SystemInfo:
      type: object
      required: [version, commit, build_date, go_version, os, arch, started_at, uptime_seconds, simulate, motion_artwork_enabled, default_storefront, jobs, pools, tools, storage, startup, pending_restart]
      properties:
        version:
          type: string
          description: Release tag the binary was built from; dev for a build without -ldflags.
        commit:
          type: string
          description: Abbreviated commit hash; empty when unknown.
        build_date:
          type: string
          description: RFC 3339 build time; without -ldflags the commit time from the VCS stamp, or empty.
        go_version:
          type: string
        os:
          type: string
        arch:
          type: string
        started_at:
          type: string
          format: date-time
          description: When this process started.
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        simulate:
          type: boolean
          description: simulate.enabled; jobs simulate transfer, decryption and file writes.
        motion_artwork_enabled:
          type: boolean
          description: catalog.motion_artwork_enabled.
        default_storefront:
          type: string
          description: >-
            The storefront a request that names none uses: the default
            account's region, else catalog.default_storefront while no account
            is known. The
            API itself refuses a link without a storefront in its path (a
            submit result with invalid_url); a client that accepts such links, as
            the web console does, completes them with this value.
        jobs:
          type: object
          required: [workers, active, queue_depth, queue_capacity, recovery_backlog]
          properties:
            workers:
              type: integer
              description: Worker count, fixed at startup by download.max_running_jobs.
            active:
              type: integer
              description: Jobs being processed now.
            queue_depth:
              type: integer
              description: Admitted jobs waiting for a worker.
            queue_capacity:
              type: integer
              description: Admission queue size; a submission that finds it full is queue_full.
            recovery_backlog:
              type: integer
              description: Jobs recovered at startup still waiting for a worker; unbounded and served first.
        pools:
          type: object
          required: [downloads, decrypts, wrapper_requests]
          description: >-
            Process-wide pool sizes, fixed at startup: downloads is
            download.max_parallel_downloads; decrypts is the number of CPUs the
            backend uses (GOMAXPROCS, which follows a container CPU limit);
            wrapper_requests (4) is built-in.
          properties:
            downloads:
              type: integer
            decrypts:
              type: integer
            wrapper_requests:
              type: integer
        tools:
          type: array
          description: External commands the pipeline runs (ffmpeg), looked up on PATH.
          items:
            type: object
            required: [name, available]
            properties:
              name:
                type: string
              available:
                type: boolean
              path:
                type: string
                description: Resolved executable path when available.
              error:
                type: string
                description: Why the lookup failed.
        storage:
          type: array
          description: >-
            Free space of downloads_dir and temp_dir, in that order. Either both
            byte counts or error is present; error is set when the directory
            cannot be inspected (for example it does not exist).
          items:
            type: object
            required: [name, path]
            properties:
              name:
                type: string
                enum: [downloads_dir, temp_dir]
              path:
                type: string
                description: The configured path, made absolute against the backend's working directory.
              free_bytes:
                type: integer
                format: int64
                minimum: 0
                description: Bytes available to the backend's user.
              total_bytes:
                type: integer
                format: int64
                minimum: 0
              error:
                type: string
        pending_restart:
          type: array
          items:
            type: string
          description: Config keys saved with a value the next start applies (ConfigResponse.pending_restart).
        startup:
          type: object
          required: [config_path, wrapper_address, listen, database_path, log_buffer_size, catalog_language, max_parallel_requests]
          description: >-
            Configuration this process read when it started, as it runs. A restart
            key saved through PUT /config shows here only after the next start
            (pending_restart). It carries no credential.
          properties:
            config_path:
              type: string
              description: >-
                Absolute path of the config file PUT /config writes and the file-only
                keys are edited in; "" when the backend keeps its config in memory only.
            wrapper_address:
              type: string
              description: >-
                wrapper.address without user info, query or fragment, so an
                address written with credentials is not echoed back.
            listen:
              type: string
              description: server.listen.
            database_path:
              type: string
              description: database.path, made absolute against the backend's working directory.
            log_buffer_size:
              type: integer
              description: logging.buffer_size; 0 keeps no log history.
            catalog_language:
              type: string
              description: catalog.language.
            max_parallel_requests:
              type: integer
              minimum: 1
              description: >-
                Size of the Apple request pool: catalog.max_parallel_requests, or 1
                when that is 0 or less.
      example:
        version: v2.0.0
        commit: a6a6b46
        build_date: '2026-10-28T12:00:00Z'
        go_version: go1.26.5
        os: linux
        arch: amd64
        started_at: '2026-10-28T12:00:05Z'
        uptime_seconds: 3600
        simulate: false
        motion_artwork_enabled: true
        jobs: {workers: 3, active: 1, queue_depth: 0, queue_capacity: 256, recovery_backlog: 0}
        pools: {downloads: 16, decrypts: 32, wrapper_requests: 4}
        tools:
          - {name: ffmpeg, available: true, path: /usr/bin/ffmpeg}
        storage:
          - {name: downloads_dir, path: /srv/amdl/data/downloads, free_bytes: 512000000000, total_bytes: 1000000000000}
          - {name: temp_dir, path: /srv/amdl/data/tmp, error: 'statfs /srv/amdl/data/tmp: no such file or directory'}
        startup:
          config_path: /srv/amdl/configs/config.yaml
          wrapper_address: http://127.0.0.1:12340
          listen: 127.0.0.1:18080
          database_path: /srv/amdl/data/db/amdl.db
          log_buffer_size: 2000
          catalog_language: en-US
          max_parallel_requests: 16
        pending_restart: []
    Stats:
      type: object
      required: [generated_at, days, totals, daily, codecs, hooks]
      properties:
        generated_at:
          type: string
          format: date-time
          description: When this result was computed; a cached result keeps its time.
        days:
          type: integer
          minimum: 1
          maximum: 90
        totals:
          type: object
          description: Every retained job and its items, not only the window.
          required: [jobs, tracks_completed, tracks_skipped, tracks_failed, bytes_written, duration_ms]
          properties:
            jobs:
              type: integer
            tracks_completed:
              type: integer
              description: Items with status completed (written by this backend); a lyrics reset's items are not tracks and are left out, as they are from codecs.
            tracks_skipped:
              type: integer
              description: Items with status skipped_existing (already on disk).
            tracks_failed:
              type: integer
            bytes_written:
              type: integer
              format: int64
              description: Sum of file_size over completed items, in bytes.
            duration_ms:
              type: integer
              format: int64
              description: Sum of the playback duration of completed items, in milliseconds.
        daily:
          type: array
          description: >-
            Exactly `days` entries, one per UTC calendar day, oldest first, ending
            today; a day without activity has zeros. A track counts on the day of
            its last item_completed event; a job counts once per job_finished or
            job_failed event.
          items:
            type: object
            required: [date, tracks_completed, bytes_written, jobs_completed, jobs_failed]
            properties:
              date:
                type: string
                format: date
              tracks_completed:
                type: integer
              bytes_written:
                type: integer
                format: int64
              jobs_completed:
                type: integer
              jobs_failed:
                type: integer
        codecs:
          type: array
          description: Completed items of every retained job, grouped by codec, bit depth and sample rate; most tracks first.
          items:
            type: object
            required: [codec, bit_depth, sample_rate, tracks]
            properties:
              codec:
                type: string
              bit_depth:
                type: integer
              sample_rate:
                type: integer
              tracks:
                type: integer
        hooks:
          type: array
          description: >-
            Outcomes recorded inside the window per hook name (hook_succeeded and
            hook_failed events), sorted by name. A hook with no outcome in the
            window is absent.
          items:
            type: object
            required: [name, succeeded, failed]
            properties:
              name:
                type: string
              succeeded:
                type: integer
              failed:
                type: integer
              last_failed_at:
                type: string
                format: date-time
                description: The latest failure inside the window; absent when there was none.
      example:
        generated_at: '2026-10-28T13:00:00Z'
        days: 2
        totals: {jobs: 12, tracks_completed: 210, tracks_skipped: 4, tracks_failed: 1, bytes_written: 9876543210, duration_ms: 52000000}
        daily:
          - {date: '2026-10-27', tracks_completed: 0, bytes_written: 0, jobs_completed: 0, jobs_failed: 0}
          - {date: '2026-10-28', tracks_completed: 21, bytes_written: 987654321, jobs_completed: 1, jobs_failed: 0}
        codecs:
          - {codec: alac, bit_depth: 24, sample_rate: 96000, tracks: 120}
          - {codec: alac, bit_depth: 16, sample_rate: 44100, tracks: 90}
        hooks:
          - {name: notify, succeeded: 10, failed: 1, last_failed_at: '2026-10-28T09:15:00Z'}
    HooksResponse:
      type: object
      additionalProperties: false
      required: [enabled, entries]
      properties:
        enabled:
          type: boolean
          description: The global enabled switch of hooks.yaml.
        entries:
          type: array
          description: The entries in hooks.yaml, in their configured file order.
          items:
            $ref: '#/components/schemas/HookEntry'
    HookEntry:
      type: object
      additionalProperties: false
      required: [name, enabled, type, events, job_types]
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Enabled state after applying the rule that an omitted enabled defaults to true.
        type:
          type: string
          enum: [webhook, exec]
        events:
          type: array
          items:
            type: string
            enum: [job_queued, job_finished, job_failed, job_cancelled]
        job_types:
          type: array
          description: An empty array means the entry matches every job type.
          items:
            type: string
            enum: [song, album, playlist, artist, station]
        preset:
          type: string
          description: Webhook entries only, absent when its request was written by hand; the id of the preset (GET /hooks/presets) it was built from.
          example: ntfy
        method:
          type: string
          enum: [GET, POST, PUT]
          description: Webhook entries only, always present on them; the HTTP method, POST when the file sets none.
        origin:
          type: string
          description: Webhook entries only; the scheme and host of the url, without user info, path or query.
          example: https://ntfy.sh
        header_names:
          type: array
          description: Webhook entries only, absent when it sends no extra headers; the names of its headers, sorted, without their values.
          items:
            type: string
        max_attempts:
          type: integer
          minimum: 1
          description: Webhook entries only, always present on them; total attempts per job event including the first.
    WebhookWrite:
      type: object
      additionalProperties: false
      description: >-
        A write to one webhook entry; an omitted field keeps the entry's value. The
        fields mean what the same keys mean in hooks.yaml.
      properties:
        type:
          type: string
          enum: [webhook]
        preset:
          type: string
          description: A preset id of GET /hooks/presets; with values, it builds url, method, headers and body, which the body then must not carry.
          example: ntfy
        values:
          type: object
          description: The preset's fields by key; only with preset.
          additionalProperties:
            type: string
          example: {topic: amdl-downloads}
        enabled:
          type: boolean
        events:
          type: array
          minItems: 1
          description: job_queued cannot be combined with the terminal events in one entry.
          items:
            type: string
            enum: [job_queued, job_finished, job_failed, job_cancelled]
        job_types:
          type: array
          description: An empty array matches every job type.
          items:
            type: string
            enum: [song, album, playlist, artist, station]
        max_attempts:
          type: integer
          description: Total attempts including the first; 0 or less behaves as 1.
        method:
          type: string
          enum: [GET, POST, PUT]
          description: A new entry without one sends POST. A GET sends no body.
        url:
          type: string
          description: An absolute http or https URL with a host.
        headers:
          type: object
          description: Extra request headers; replaces all of them. A Content-Type here replaces application/json.
          additionalProperties:
            type: string
        body:
          type: string
          description: >-
            A Go text/template rendered over the payload as its JSON reads (.event,
            .job.title, .items) into the request body; json writes a value as a
            JSON literal. Empty sends the JSON payload itself.
    HookPreset:
      type: object
      additionalProperties: false
      required: [id, name, kind, events, fields]
      properties:
        id:
          type: string
          example: ntfy
        name:
          type: string
          example: ntfy
        kind:
          type: string
          enum: [notify, library, custom]
          description: What the service does with the event, for grouping the presets.
        events:
          type: array
          description: The events a new hook of the preset runs on unless the write sends its own.
          items:
            type: string
            enum: [job_queued, job_finished, job_failed, job_cancelled]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/HookPresetField'
    HookPresetField:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key:
          type: string
          description: The key of this field in a write's values.
        label:
          type: string
        placeholder:
          type: string
        default:
          type: string
          description: The value an empty field takes.
        secret:
          type: boolean
          description: Whether the value is a token or key, to show masked.
        optional:
          type: boolean
        multiline:
          type: boolean
          description: Whether the value is a body, many lines long.
        choices:
          type: array
          description: The only values the field takes, when present.
          items:
            type: string
    HookTestResult:
      type: object
      additionalProperties: false
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
          description: Whether the endpoint answered with a 2xx status.
        error:
          type: string
          description: Present when succeeded is false; what a dispatched run would record in its hook_failed event.
    LogEntry:
      type: object
      required: [sequence, time, level, message]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        attributes:
          type: object
          additionalProperties: true
    LogListResponse:
      type: object
      required: [logs, next_cursor, oldest_sequence, truncated]
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_cursor:
          type: integer
          format: int64
          minimum: 0
        oldest_sequence:
          type: integer
          format: int64
          minimum: 0
          description: The oldest global sequence number currently in the in-memory buffer; 0 when the buffer is empty.
        truncated:
          type: boolean
          description: Whether entries after the cursor and before oldest_sequence have already been evicted.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: example-password
    TwoStepRequest:
      type: object
      required: [two_step_code]
      properties:
        two_step_code:
          type: string
          example: '123456'
    LogoutRequest:
      type: object
      description: Exactly one of username and account_id.
      properties:
        username:
          type: string
          description: The account's Apple ID.
          example: user@example.com
        account_id:
          type: string
          description: The account's id (Account.id), a wrapper-manager instance id.
    LoggedInResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: logged_in
    NeedsTwoStepResponse:
      type: object
      required: [status, login_id]
      properties:
        status:
          type: string
          const: needs_2fa
        login_id:
          type: string
    LoggedOutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: logged_out
        username:
          type: string
          description: The request's username, when it named one.
        account_id:
          type: string
          description: The request's account_id, when it named one.
    MoveRequest:
      type: object
      description: >-
        Where a queued job goes in the run order. Set exactly one property.
      properties:
        before:
          type: string
          description: Id of a queued job; the moved job starts right before it.
        after:
          type: string
          description: Id of a queued job; the moved job starts right after it.
        to:
          type: string
          enum: [first, last]
          description: first starts the job next; last puts it behind every queued job.
      example:
        before: job_8f3c2a
    DownloadRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          description: >-
            List of Apple Music links (song/album/playlist/artist/station). Each
            element may contain several URLs separated by newlines or whitespace,
            which the server splits automatically; at most 100 URLs per request
            after splitting. Stations (station, shaped like
            .../station/.../ra.xxxx) are supported only for personalized/curated
            stations that resolve to a track list, and require a media-user-token
            (the account's, which amdl reads from the wrapper); live radio
            stations (Apple Music 1, etc.) have no static track list and cannot
            be downloaded.
          minItems: 1
          items:
            type: string
          example:
            - https://music.apple.com/cn/album/example/123456789?i=987654321
            - https://music.apple.com/cn/album/example/123456789
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            Optional configuration overrides for the records and runs this
            request adds. Omitted fields keep the current runtime configuration.
            They are stored on the record (the latest add's win) and copied into
            each of its runs, so they apply after a retry or a restart recovery.
    DownloadOverrides:
      type: object
      additionalProperties: false
      description: >-
        Per-record override layer for the quality keys of the download section
        of the runtime configuration; each field maps one-to-one onto the
        download key of the same name. Every other setting (directories, path
        templates, lyrics, covers, max_attempts, check_integrity,
        integrity_mode and hook selection) comes from the runtime configuration and hooks.yaml for
        every job, and the media-user-token is the account's, which amdl reads
        from the wrapper. All fields are optional; on submission the
        full validation runs against "current runtime configuration + overrides",
        and an unknown field is rejected with 400 invalid_request naming it. Job
        rows stored before a field was removed are read with that field ignored.
      properties:
        quality_priority:
          type: array
          items:
            type: string
            enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
        codec_alternative: {type: boolean}
        alac_max_sample_rate: {type: integer}
        alac_max_bit_depth: {type: integer}
    RuntimeConfig:
      type: object
      description: >-
        Every key except server.listen, database.path and tools.ffmpeg (see the
        comments in configs/config.example.yaml for field meanings, enum values and
        default behavior). Keys marked x-applies: restart are saved and take effect
        on the next start; the others take effect at once. GET returns this shape;
        a PUT may submit only the fields to change, and omitted fields keep their
        current values.
      properties:
        catalog:
          type: object
          properties:
            default_storefront:
              type: string
              description: >-
                Two-letter storefront that search and the catalog routes use when a
                request names none while no account is known; the default
                account's region wins otherwise.
            language:
              type: string
              x-applies: restart
              description: >-
                Catalog language tag. It goes into tags and output paths, so
                changing it on an existing library can download albums again.
            max_parallel_requests:
              type: integer
              maximum: 64
              x-applies: restart
              description: Apple requests in flight; values <= 0 behave as 1.
            token_cache_ttl_hours:
              type: integer
              x-applies: restart
              description: Validity window of the scraped web-player token; values <= 0 mean 12.
            album_track_url_mode:
              type: string
              enum: [song, album]
            motion_artwork_enabled:
              type: boolean
              description: >-
                Whether to look up Apple Music animated album covers
                (attributes.editorialVideo); default true. When true, each album
                makes one extra amp-api request after it resolves (detached from the
                job context, so it never blocks the download or makes it fail), and
                on success a motion_artwork_resolved event fills in the job's
                motion_artwork_* fields. When false, no request is made and no web
                player token is scraped; jobs carry none of these fields, which to a
                client is exactly the same as "this album has no animated cover".
                Changes take effect for newly started jobs.
        download:
          type: object
          properties:
            max_running_jobs:
              type: integer
              maximum: 32
              x-applies: restart
              description: Jobs running at once; values <= 0 behave as 1.
            max_parallel_downloads:
              type: integer
              maximum: 64
              x-applies: restart
              description: Media transfers in flight across all jobs; values <= 0 behave as 1.
            quality_priority:
              type: array
              minItems: 1
              items:
                type: string
                enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
            codec_alternative: {type: boolean}
            max_attempts:
              type: integer
              maximum: 10
              description: >-
                Tries of each operation inside one run. Positive values 1-10 are
                allowed; values <=0 are treated as 1.
            give_up_after_runs:
              type: integer
              minimum: 0
              maximum: 20
              description: >-
                Runs that may end a slot failed before it is given up; 0 never
                gives up. A failed slot is retried by a new run (trigger retry)
                30 minutes after the failure, then each wait four times the last; a reset
                re-arms a given-up slot. Default 3.
            progress_event_interval_ms:
              type: integer
              maximum: 10000
              description: >-
                Minimum interval in milliseconds between two item_progress events
                for the same item within the same status. Only the advance of the
                download/decrypt meters is throttled; status changes
                (waiting_download, downloading, waiting_decrypt, decrypting,
                remuxing, saving, tagging), stage-completion flags (resolved,
                remuxed, verified, tagged, saved) and one-off events such as
                item_completed / item_failed / item_skipped are always pushed
                immediately and are unaffected by this value. A progress value held
                back by the interval is emitted before the event that supersedes
                it, so the last percentage before a status change is never lost,
                and a client resuming from a cursor sees exactly the same event
                sequence as a live client. This is a time floor layered on top of
                the "whole-percentage rounding" threshold, so however small it is
                set, a single meter still emits no more than about 101 events per
                stage. 0-10000 is allowed; values <=0 disable time coalescing and
                keep only the percentage threshold; values above 10000 in the
                configuration file are clamped to 10000, while the config API
                rejects them outright. Default 500. Read once when a job starts, so
                changes only affect jobs started afterwards, not running ones.
            downloads_dir: {type: string}
            overwrite_existing:
              type: boolean
              description: >-
                What a track does when a file is already at its path as it is
                about to be saved there, in any run: true downloads it and
                replaces the file once the new copy is complete; false keeps the
                file as the track's download (skipped_existing). Records still
                decide what is downloaded, so a submit of a record whose tracks
                are done answers already_downloaded either way, and a reset
                replaces its files either way. Default false.
            library_path_format:
              type: string
              description: >-
                Where every song, album and artist download lands, relative to
                downloads_dir; a file already at that path when a track downloads
                is taken as its download unless overwrite_existing is on. Folder
                segments may use only {AlbumArtist}, {AlbumName}, {AlbumId},
                {ReleaseDate} and {ReleaseYear} and must name {AlbumName} or
                {AlbumId}; the file name must contain {SongNumber} (the track's
                number in its album, counting on across discs) or both {DiscNumber}
                and {TrackNumber}, and
                cannot use {Quality}, {Codec}, {Tag} or playlist and station
                variables. Anything else is 422 invalid_config. Default
                "library/{AlbumArtist}/{AlbumName}/{SongNumber:02d}. {SongName}".
            playlist_path_format: {type: string}
            station_path_format: {type: string}
            temp_dir: {type: string}
            cover_size:
              type: string
              pattern: '^[1-9][0-9]*x[1-9][0-9]*$'
              description: >-
                "{width}x{height}" in pixels, e.g. 5000x5000, 3000x3000, 1400x1400,
                600x600; any other value is rejected with 422 invalid_config. If Apple
                cannot serve that size, the standard sizes 5000x5000, 3000x3000,
                1400x1400, 600x600 and 300x300 are tried in turn.
            cover_format:
              type: string
              enum: [jpg, jpeg, png]
            embed_cover: {type: boolean}
            save_album_cover: {type: boolean}
            save_artist_cover: {type: boolean}
            save_playlist_cover: {type: boolean}
            embed_lyrics:
              type: boolean
              description: >-
                Embed the lyrics into the MP4 tag as LRC, shaped by lyrics_timing
                and lyrics_extras.
            lyrics_files:
              type: array
              description: >-
                Lyrics sidecars written next to each track, each format at most
                once: `lrc` holds the same LRC as the tag; `ttml` holds Apple's
                word-timed TTML unchanged, with the translation and romanization
                (none for a song Apple only has plain-text lyrics for). Empty
                writes no sidecar.
              items:
                type: string
                enum: [lrc, ttml]
            lyrics_timing:
              type: string
              enum: [line, word]
              description: >-
                LRC timing. `word` writes enhanced LRC with a time before each
                word, for songs Apple times word by word; others stay line by line.
            lyrics_extras:
              type: array
              description: >-
                Extra LRC lines under each line, with its timestamp, when Apple
                has them and they differ from the line: `translation` (in
                catalog.language) and `pronunciation` (the romanization). The
                `ttml` sidecar always carries both.
              items:
                type: string
                enum: [translation, pronunciation]
            alac_max_sample_rate:
              type: integer
              description: >-
                Hz, a ceiling; 0 or less sets none. Apple Music serves ALAC from 44100
                to 192000 Hz, so a value below 44100 skips every ALAC stream.
            alac_max_bit_depth:
              type: integer
              description: >-
                Bits, a ceiling; 0 or less sets none. Apple Music serves 16- and 24-bit
                ALAC.
            check_integrity: {type: boolean}
            integrity_mode:
              type: string
              enum: [full, quick]
              description: >-
                How check_integrity checks a track; ignored when it is false. full
                decodes the whole track with ffmpeg. quick (default) checks that every
                sample lies inside the file's media data, that every ALAC packet parses
                and ends cleanly, and decodes only the first and last 5 seconds; damage
                confined to the middle of an AAC or Dolby track passes it.
        logging:
          type: object
          properties:
            level:
              type: string
              enum: [debug, info, warn, error]
            access_log: {type: boolean}
            console:
              type: boolean
              x-applies: restart
              description: Whether the backend writes its log to stdout.
            buffer_size:
              type: integer
              minimum: 0
              maximum: 100000
              x-applies: restart
              description: Log records kept in memory for GET /logs; 0 keeps none.
        wrapper:
          type: object
          properties:
            address:
              type: string
              x-applies: restart
              description: >-
                The wrapper's URL, http:// or https:// with a host. Rejected with
                config_key_not_mutable (reason managed_wrapper) while this process
                runs the wrapper itself.
            timeout_seconds:
              type: integer
              x-applies: restart
              description: Bound on one wrapper request; values <= 0 mean 30.
            login_timeout_seconds:
              type: integer
              x-applies: restart
              description: Bound on one console login request; values <= 0 mean 120.
            token:
              type: string
              description: >-
                An optional key sent as a bearer token on every wrapper request,
                for a wrapper behind a gateway or reverse proxy (a Cloudflare
                Worker); one word without spaces or control characters; "" sends
                none. Write-only: responses show a set key as "...", and a PUT
                that sends "..." back keeps the saved one.
        simulate:
          type: object
          properties:
            enabled: {type: boolean}
            min_speed_kbps: {type: integer}
            max_speed_kbps: {type: integer}
        library_sync:
          type: object
          description: >-
            Library monitor: polls the signed-in Apple Music library and submits
            the albums of newly added tracks as ordinary download jobs (sharing the
            same deduplication, validation and hooks as manual submissions).
            Requires the account's media-user-token, which amdl reads from the
            wrapper — a personal library can be read only with the subscription
            token; while there is none the monitor idles, and last_error in GET
            /api/v1/library-sync shows the status.
          properties:
            enabled:
              type: boolean
              description: >-
                Whether polling is enabled. Default false — this is the only
                feature that creates download jobs on its own. Turning it off really
                stops polling, rather than just discarding the results.
            interval_minutes:
              type: integer
              minimum: 1
              maximum: 1440
              description: >-
                Polling interval in minutes; default 15. The 1440 cap is not a
                resource limit (a poll usually makes only 1 Apple request); it rules
                out values that would show as enabled but never actually fire.
                Changes take effect immediately, with no restart needed.
        apple_library:
          type: object
          description: >-
            Schedule of the sync that keeps the local copy of the signed-in Apple
            Music account library read by /apple-library and the in_apple_library
            mark on search hits. Needs a media-user-token, found as for
            library_sync. Both keys take effect within 15 seconds.
          properties:
            sync_interval_minutes:
              type: integer
              minimum: 0
              maximum: 1440
              description: >-
                Minutes between incremental syncs (newest additions, the playlist
                list, totals; about 4 Apple requests). 0 turns them off. Default 30.
            full_sync_hours:
              type: integer
              minimum: 0
              maximum: 720
              description: >-
                Hours between full reconciliations (every page of every kind;
                catches removals and metadata changes). 0 runs them only through
                POST /apple-library/sync. Default 24.
    LibrarySyncStatus:
      type: object
      required: [enabled, interval_minutes, accounts]
      properties:
        enabled:
          type: boolean
          description: Taken from library_sync.enabled in the current runtime configuration, the master switch.
        interval_minutes:
          type: integer
        accounts:
          type: array
          description: One entry per account, the default first.
          items:
            $ref: '#/components/schemas/LibrarySyncAccount'
    LibrarySyncAccount:
      type: object
      required: [account_id, name, region, enabled, anchor_size, last_submitted, total_submitted]
      properties:
        account_id: {type: string, description: Account.id.}
        name: {type: string, description: The account's Apple ID; "" when the wrapper does not say.}
        region: {type: string, description: The account's storefront.}
        enabled:
          type: boolean
          description: The account's library_sync switch (PATCH /accounts/{account_id}).
        anchor_size:
          type: integer
          description: >-
            Number of tracks remembered in the account's current anchor. 0 means
            no anchor has been set yet (first enable, or just reset); the next
            poll anchors on the library as it is then and submits no albums.
        last_poll_at:
          type: string
          format: date-time
          description: When a poll of the account last actually ran; absent if it has never polled.
        last_error:
          type: string
          description: >-
            Failure reason of the account's most recent poll; absent on success.
            When the account is enabled but amdl has no media-user-token for it
            from the wrapper, this explains why it is idling.
        last_submitted:
          type: integer
          description: Number of albums enqueued in the account's most recent poll.
        total_submitted:
          type: integer
          description: Total number of albums enqueued for the account since this process started (reset to zero on restart).
    LibrarySyncResetResponse:
      type: object
      required: [account, cleared, status]
      properties:
        account:
          type: string
          description: The account whose anchor was cleared.
        cleared:
          type: integer
          description: Number of anchor entries cleared.
        status:
          $ref: '#/components/schemas/LibrarySyncStatus'
    AppleLibraryStatus:
      type: object
      required: [sync_interval_minutes, full_sync_hours, accounts]
      properties:
        sync_interval_minutes:
          type: integer
          description: apple_library.sync_interval_minutes in the runtime configuration; every account's.
        full_sync_hours:
          type: integer
          description: apple_library.full_sync_hours in the runtime configuration; every account's.
        accounts:
          type: array
          description: One entry per account, the default first.
          items:
            $ref: '#/components/schemas/AppleLibraryAccountStatus'
    AppleLibraryAccountStatus:
      type: object
      required: [account_id, name, region, default, enabled, available, state, counts]
      properties:
        account_id: {type: string, description: Account.id.}
        name: {type: string, description: The account's Apple ID; "" when the wrapper does not say.}
        region: {type: string, description: The account's storefront.}
        default: {type: boolean, description: The default account (position 0).}
        enabled:
          type: boolean
          description: The account's apple_library switch (PATCH /accounts/{account_id}).
        available:
          type: boolean
          description: The account's switch is on and a usable media-user-token is there to sync with.
        reason:
          type: string
          enum: [no_token, token_refused, disabled]
          description: >-
            Why available is false; absent when it is true. disabled: the
            account's switch is off, or the wrapper no longer holds it.
        state:
          type: string
          enum: [idle, running, failed]
          description: failed means the last sync ended with an error; cached items are still served.
        current:
          $ref: '#/components/schemas/AppleLibrarySyncProgress'
        last_sync:
          $ref: '#/components/schemas/AppleLibrarySyncRun'
        last_full_sync_at:
          type: string
          format: date-time
          description: End of the last successful full sync; absent before the first.
        next_sync_at:
          type: string
          format: date-time
          description: When the schedule runs the next sync; absent when both schedules are off, nothing ran yet or the account is unavailable.
        counts:
          type: object
          description: Cached items per kind.
          required: [albums, songs, playlists, artists]
          properties:
            albums: {type: integer}
            songs: {type: integer}
            playlists: {type: integer}
            artists: {type: integer}
    AppleLibrarySyncProgress:
      type: object
      description: The sync under way; absent from AppleLibraryAccountStatus when none runs.
      required: [id, mode, trigger, started_at, kind, pages_read, requests]
      properties:
        id: {type: string}
        mode: {type: string, enum: [full, incremental]}
        trigger: {type: string, enum: [manual, schedule]}
        started_at: {type: string, format: date-time}
        kind:
          type: string
          description: What is being read now; a kind, or playlist_tracks.
        pages_read: {type: integer}
        requests:
          type: integer
          description: Apple requests made so far.
    AppleLibrarySyncRun:
      type: object
      description: The last finished sync; absent from AppleLibraryStatus before the first.
      required: [id, mode, trigger, started_at, ok, requests, added, removed, changed]
      properties:
        id: {type: string}
        mode: {type: string, enum: [full, incremental]}
        trigger: {type: string, enum: [manual, schedule]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        ok: {type: boolean}
        error:
          type: string
          description: Why the sync failed or stopped early; absent when ok.
        requests:
          type: integer
          description: Apple requests the sync made.
        added: {type: integer}
        removed: {type: integer}
        changed:
          type: integer
          description: Cached items whose shown fields changed.
        capped:
          type: array
          items: {type: string}
          description: >-
            The lists a page cap cut short in this sync, a kind (songs) or
            playlist_tracks:{library id}. The sync is still ok: the rows read are
            cached, nothing was removed for those lists, and the other lists
            finished. Absent when no list hit its cap.
    AppleLibraryPage:
      type: object
      required: [kind, items, total, offset]
      properties:
        kind:
          type: string
          enum: [albums, songs, playlists, artists]
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppleLibraryItem'
        total:
          type: integer
          description: Items matching the query, across all pages.
        offset: {type: integer}
        synced_at:
          type: string
          format: date-time
          description: When the kind last completed a full sync; absent before the first.
    AppleLibraryItem:
      type: object
      required: [id, name]
      description: >-
        One item of the account library. Fields a kind does not have, or that
        Apple left empty, are absent.
      properties:
        id:
          type: string
          description: Apple's library id (l. album, i. song, p. playlist, r. artist), personal to the account.
        catalog_id:
          type: string
          description: The catalog id; absent when the item has no catalog counterpart (uploaded, withdrawn, or an unshared own playlist).
        url:
          type: string
          description: >-
            A music.apple.com link that downloads the item when submitted to
            POST /api/v1/downloads; absent with catalog_id.
        name: {type: string}
        artist_name:
          type: string
          description: Albums and songs.
        album_name:
          type: string
          description: Songs.
        artwork_url:
          type: string
          description: >-
            Artwork URL, a template with {w}x{h} placeholders, except an own
            playlist's, which is a direct, expiring link.
        description:
          type: string
          description: Playlists.
        genre: {type: string}
        release_date: {type: string}
        track_count:
          type: integer
          description: Albums; the album's songs that are in the library.
        duration_ms: {type: integer}
        track_number: {type: integer}
        disc_number: {type: integer}
        date_added:
          type: string
          description: >-
            Apple's dateAdded of albums and playlists (an album's is when its
            first song entered the library; most own playlists report
            1970-01-01). Songs have none; sort=added orders them exactly.
        last_modified:
          type: string
          description: Playlists.
        playlist_kind:
          type: string
          enum: [favorites, own, editorial, replay, shared]
          description: Playlists. favorites is Favorite Songs; shared is someone else's playlist.
    AppleLibraryTracks:
      type: object
      required: [playlist_id, items, total]
      properties:
        playlist_id: {type: string}
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppleLibraryTrack'
        total: {type: integer}
        read_at:
          type: string
          format: date-time
          description: When the tracks were read; absent while they have not been.
    AppleLibraryTrack:
      type: object
      required: [position, song_id, name]
      properties:
        position:
          type: integer
          description: 0-based place in the playlist.
        song_id:
          type: string
          description: The library song id.
        catalog_id: {type: string}
        url:
          type: string
          description: A /song/ link that downloads the song; absent without catalog_id.
        name: {type: string}
        artist_name: {type: string}
        album_name: {type: string}
        duration_ms: {type: integer}
        artwork_url: {type: string}
    ConfigResponse:
      type: object
      required: [config, persisted, pending_restart]
      properties:
        config:
          $ref: '#/components/schemas/RuntimeConfig'
        pending_restart:
          type: array
          items:
            type: string
          description: >-
            Dotted keys whose saved value differs from the one the process runs
            with, applied by the next start (POST /api/v1/system/restart): restart
            keys saved through PUT, and hand edits of restart or file-only keys.
            Empty when nothing waits.
        persisted:
          type: boolean
          description: >-
            Whether the configuration store has a persisted file. Always true in a
            normal deployment: changes made through PUT are written back to
            configs/config.yaml and still apply after a restart.
        reload_error:
          type: string
          description: >-
            Present only in the answer to POST /api/v1/config/reload when the
            configuration file could not be used (unreadable or failing
            validation); config is then the previous, still active
            configuration.
    SubmitResult:
      type: object
      required: [url, status]
      properties:
        url:
          type: string
          description: A single input URL after splitting and normalization.
        status:
          type: string
          enum: [accepted, pending, already_downloaded, invalid, duplicate_in_request, duplicate_active, queue_full, error]
          description: >-
            accepted: the link added or extended a record and job is its queued
            run, absent when the record waits (a failed slot's automatic retry,
            a full queue the scheduler drains later, or a running run the link
            added tracks to, which the scheduler downloads after it), or a
            station's one-off run was queued. pending: the link needs a catalog
            read before it becomes records (a song without its album that no
            album record lists, an artist, a library playlist's songs); they
            appear in GET /library/albums once read.
            already_downloaded: every wanted track of the link's record is done;
            nothing was queued (reset it to download again). invalid: the URL will not be accepted as
            it is (error.code says why). duplicate_in_request: an earlier URL in
            the same request names the same download. duplicate_active: a queued
            or running job already downloads it and the link asked for nothing
            more. queue_full: the job queue is
            full; retry later. error: the server failed while handling the URL
            (store_error); the same submit may succeed when retried.
        resource:
          $ref: '#/components/schemas/ResourceRef'
          description: >-
            The record the link added or extended; absent for a station, a
            pending add and a link that was not taken.
        job:
          $ref: '#/components/schemas/Job'
          description: The queued run, when status is accepted and a run was queued.
        existing_job_id:
          type: string
          description: When status is duplicate_active, points to the job with the same content that is already in progress (absent when the store's uniqueness check caught a concurrent submit).
        error:
          $ref: '#/components/schemas/SubmitError'
    SubmitError:
      type: object
      description: Why one URL was not taken; present for every status except accepted, pending and already_downloaded.
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/SubmitErrorCode'
        message:
          type: string
          description: Human-readable explanation; may change between releases.
        details:
          type: object
          description: >-
            decryptor_unavailable when the wrapper does not serve the storefront
            the run reads in (the account storefront for a record, the link's
            for a station): {"storefront": "cn", "supported_storefronts": ["us"]},
            the storefronts the wrapper's account serves.
          properties:
            storefront:
              type: string
            supported_storefronts:
              type: array
              items:
                type: string
    SubmitErrorCode:
      type: string
      description: |
        Stable per-URL code. With status invalid: invalid_url (not an Apple
        Music URL the backend can parse), unsupported_input (a link type the
        backend does not download, such as music videos),
        decryptor_unavailable (the wrapper is not ready, retrying later may
        succeed, or its account does not serve the storefront the run reads
        in; a link's own storefront only names a record, which is read in the
        account storefront), invalid_configuration (the runtime configuration
        cannot parse this link). With the status of the same name:
        duplicate_in_request, duplicate_active, queue_full. With status error:
        store_error, internal_error (the validator failed unexpectedly).
      enum:
        - invalid_url
        - invalid_configuration
        - unsupported_input
        - decryptor_unavailable
        - duplicate_in_request
        - duplicate_active
        - queue_full
        - store_error
        - internal_error
    BatchSubmitResponse:
      type: object
      required: [accepted, rejected, results]
      properties:
        accepted:
          type: integer
          description: Number of URLs taken (accepted, pending or already_downloaded).
        rejected:
          type: integer
          description: Number of URLs rejected.
        results:
          type: array
          description: Per-URL results, one for each URL in the request.
          items:
            $ref: '#/components/schemas/SubmitResult'
    QualityRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://music.apple.com/cn/album/one-last-kiss/1542953969
    QualitySong:
      type: object
      required: [id, name, artist, album, has_lyrics]
      properties:
        id: {type: string}
        name: {type: string}
        artist: {type: string}
        album: {type: string}
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Catalog metadata only — it does not
            guarantee the lyrics can actually be fetched at download time.
    QualityOption:
      type: object
      required: [id, label, available]
      properties:
        id:
          type: string
          enum: [aac, aac-binaural, aac-downmix, alac, ec3, ac3]
        label: {type: string}
        available:
          type: boolean
          description: Whether the master playlist declares a variant that fits the current codec and ALAC limits; it does not mean a specific media playlist or the media segments have been verified.
        codec: {type: string}
        codec_id: {type: string}
        channels: {type: integer}
        bit_depth: {type: integer}
        sample_rate:
          type: integer
          description: Hz.
        bitrate:
          type: integer
          description: bits per second.
        description: {type: string}
    QualityTrack:
      type: object
      required: [song, qualities]
      properties:
        song:
          $ref: '#/components/schemas/QualitySong'
        qualities:
          type: array
          description: Every quality slot in the backend's fixed codec order, including entries with available=false.
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/QualityOption'
    QualityResponse:
      type: object
      description: Per-track quality response shape shared by every supported Apple Music URL type.
      required: [input, storefront, type, adam_id, tracks]
      properties:
        input: {type: string}
        storefront: {type: string}
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        adam_id:
          type: string
          description: Parsed Adam ID of the input song or collection.
        tracks:
          type: array
          description: >-
            Per-track results for every supported input type. Song inputs have
            exactly one item; collection order and duplicate song occurrences
            are preserved.
          minItems: 1
          items:
            $ref: '#/components/schemas/QualityTrack'
    LookupRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: One Apple Music link; surrounding whitespace is ignored.
          example: https://music.apple.com/us/album/igor/1463409338
    LookupLink:
      type: object
      description: >-
        A link as a submission would parse it. type and id are what a download
        job of this link would be.
      required: [input, type, storefront, id]
      properties:
        input:
          type: string
          description: The url as sent, trimmed.
        type:
          type: string
          enum: [song, album, playlist, artist, station, music-video]
          description: music-video only appears in details.link; the backend does not download music videos.
        storefront:
          type: string
          description: Two-letter storefront from the link path.
        id:
          type: string
          description: Catalog id of the song, album, playlist, artist or station.
        track_id:
          type: string
          description: >-
            The i parameter of an album link, present whatever
            catalog.album_track_url_mode decided: with song it equals id
            (type song); with album the job downloads the whole album (type
            album) and this names the track the link pointed at.
    LookupResponse:
      description: >-
        The parsed link plus the catalog metadata a job row shows once it
        resolves. The metadata fields have the names and meaning of the Job
        fields of the same name; each is absent when the catalog has no value or
        the link type has none.
      allOf:
        - $ref: '#/components/schemas/LookupLink'
        - type: object
          required: [title]
          properties:
            type:
              type: string
              enum: [song, album, playlist, artist, station]
            title:
              type: string
              description: Song, album, playlist, station or artist name.
            artist_name:
              type: string
              description: Song or album artist; for an artist link the artist's own name. Absent for playlists and stations.
            artist_url:
              type: string
              description: That artist's own music.apple.com page, when the catalog reports one. Absent for playlists and stations.
            curator_name:
              type: string
              description: >-
                Playlist curator (curatorName, falling back to artistName), or
                "Apple Music Station" for a station. Absent for other types.
            album_name:
              type: string
              description: The album a song belongs to. Song links only.
            artwork_url:
              type: string
              description: >-
                Artwork URL template with {w}x{h} (and optionally {f})
                placeholders, as on Job. A song without its own artwork uses its
                album's. A private playlist may expose the owner's pre-signed
                artwork URL verbatim, without placeholders.
            artwork_bg_color:
              type: string
              description: Background color of that artwork, hex without "#".
            artwork_text_color1: {type: string}
            artwork_text_color2: {type: string}
            artwork_text_color3: {type: string}
            artwork_text_color4: {type: string}
            release_date:
              type: string
              description: Release date (YYYY-MM-DD) of the song or album.
            genre:
              type: string
              description: >-
                First genreNames entry that is not the "Music" umbrella genre;
                for songs, albums and artists.
            track_count:
              type: integer
              description: >-
                Songs a download of this link would contain: 1 for a song, the
                album's or playlist's song count (music videos excluded). Absent
                for artists and stations, whose track lists are not read.
            duration_ms:
              type: integer
              description: Song duration in milliseconds. Song links only.
            content_rating:
              type: string
              enum: [explicit, clean]
              description: The catalog's content rating of a song or album; absent when unrated.
            apple_digital_master:
              type: boolean
              description: >-
                True when the catalog marks the song (isAppleDigitalMaster) or
                album (isMasteredForItunes) as an Apple Digital Master; absent
                otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
            needs_media_user_token:
              type: boolean
              description: >-
                True for a station: its download reads the next-tracks feed,
                which needs the account's media-user-token. Absent for other types.
            resource:
              $ref: '#/components/schemas/ResourceMark'
              description: >-
                The record holding the link's album, playlist or song (for a song,
                its album record with song_state); absent when amdl has none.
    SearchResponse:
      type: object
      required: [term, storefront]
      description: >-
        One group per requested type; a type that was not requested is absent.
      properties:
        term:
          type: string
          description: The term as searched, white space collapsed.
        storefront:
          type: string
          description: The storefront searched, lowercase.
        songs:
          $ref: '#/components/schemas/SearchSongGroup'
        albums:
          $ref: '#/components/schemas/SearchAlbumGroup'
        playlists:
          $ref: '#/components/schemas/SearchPlaylistGroup'
        artists:
          $ref: '#/components/schemas/SearchArtistGroup'
    SearchSongGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchSong'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchAlbumGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchAlbum'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchPlaylistGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchPlaylist'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchArtistGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchArtist'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchHit:
      type: object
      required: [id, type, name, url]
      description: >-
        What every hit has. The metadata fields have the names and meaning of
        the LookupResponse fields of the same name; each is absent when the
        catalog has no value.
      properties:
        id:
          type: string
          description: Apple Music catalog id.
        type:
          type: string
          enum: [song, album, playlist, artist]
        name:
          type: string
        url:
          type: string
          description: >-
            A music.apple.com link that downloads exactly this item when
            submitted: a song's is a /song/ link, which
            catalog.album_track_url_mode cannot read as the whole album; an
            album's, playlist's or artist's is Apple's page without its query.
        artwork_url:
          type: string
          description: Artwork URL template with {w}x{h} placeholders, as on Job.
        artwork_bg_color:
          type: string
          description: Background color of that artwork, hex without "#".
        artwork_text_color1: {type: string}
        artwork_text_color2: {type: string}
        artwork_text_color3: {type: string}
        artwork_text_color4: {type: string}
        genre:
          type: string
          description: First genreNames entry that is not the "Music" umbrella genre.
        resource:
          $ref: '#/components/schemas/ResourceMark'
          description: >-
            The record holding the hit: an album's or playlist's own, a song's
            album record with song_state; absent when amdl has none.
        in_apple_library:
          type: boolean
          description: >-
            Whether the item is in the signed-in Apple Music account library.
            Songs, albums and playlists take Apple's own mark, which the search
            asks for with the media-user-token at no extra request; otherwise,
            and always for artists, the local Apple library cache answers once
            that kind has completed a full sync. Absent when neither can tell
            (no usable token and nothing cached).
    SearchSong:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: song
            artist_name: {type: string}
            album_name: {type: string}
            release_date:
              type: string
              description: YYYY-MM-DD.
            duration_ms:
              type: integer
            content_rating:
              type: string
              enum: [explicit, clean]
              description: Absent when unrated.
            apple_digital_master:
              type: boolean
              description: True when the catalog marks the song isAppleDigitalMaster; absent otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchAlbum:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: album
            artist_name: {type: string}
            release_date:
              type: string
              description: YYYY-MM-DD.
            track_count:
              type: integer
              description: The release's track count as the catalog states it.
            content_rating:
              type: string
              enum: [explicit, clean]
              description: Absent when unrated.
            apple_digital_master:
              type: boolean
              description: True when the catalog marks the album isMasteredForItunes; absent otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchPlaylist:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: playlist
            artist_name:
              type: string
              description: The playlist's curator.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchArtist:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: artist
    AudioTraits:
      type: array
      items:
        type: string
      description: >-
        Apple's audioTraits of the song, album or playlist, as sent: values
        seen include lossless, hi-res-lossless, lossy-stereo, atmos and
        spatial. A hint of what the catalog offers; POST /api/v1/quality reads what a download
        gets. Absent when the catalog sends none.
    ArtistAlbumsResponse:
      type: object
      required: [storefront, artist, albums]
      properties:
        storefront:
          type: string
          description: The storefront read, lowercase.
        artist:
          $ref: '#/components/schemas/SearchArtist'
        albums:
          $ref: '#/components/schemas/SearchAlbumGroup'
    AlbumResponse:
      type: object
      required: [storefront, id, url, title, track_count, tracks]
      description: >-
        An album's metadata and its songs. The metadata fields have the names and
        meaning of the LookupResponse fields of the same name; each is absent when
        the catalog has no value.
      properties:
        storefront:
          type: string
          description: The storefront read, lowercase.
        id:
          type: string
          description: Apple Music catalog id.
        url:
          type: string
          description: >-
            A music.apple.com link that downloads the whole album when submitted:
            Apple's page without its query, or one built from the id.
        title:
          type: string
        artist_name: {type: string}
        artist_url:
          type: string
          description: The artist's own music.apple.com page, when the catalog reports one.
        artwork_url:
          type: string
          description: Artwork URL template with {w}x{h} placeholders, as on Job.
        artwork_bg_color:
          type: string
          description: Background color of that artwork, hex without "#".
        artwork_text_color1: {type: string}
        artwork_text_color2: {type: string}
        artwork_text_color3: {type: string}
        artwork_text_color4: {type: string}
        release_date:
          type: string
          description: YYYY-MM-DD.
        genre:
          type: string
          description: First genreNames entry that is not the "Music" umbrella genre.
        track_count:
          type: integer
          description: The number of entries in tracks, as on LookupResponse (music videos excluded).
        disc_count:
          type: integer
          description: The highest disc_number among the songs; absent when the album has none.
        content_rating:
          type: string
          enum: [explicit, clean]
          description: Absent when unrated.
        apple_digital_master:
          type: boolean
          description: True when the catalog marks the album isMasteredForItunes; absent otherwise.
        audio_traits:
          $ref: '#/components/schemas/AudioTraits'
        motion_artwork_url:
          type: string
          description: >-
            The album's animated cover (1:1), as Job.motion_artwork_url, read
            alongside the album while catalog.motion_artwork_enabled is on. An
            optional read: absent when the album has none, the read fails, or it
            does not answer within 1.5 seconds of the album's own read.
        motion_artwork_tall_url:
          type: string
          description: The 3:4 variant (motionDetailTall); present and absent with motion_artwork_url.
        motion_artwork_bg_color:
          type: string
          description: >-
            Background color for the 1:1 animated cover, as
            Job.motion_artwork_bg_color: that variant's own palette, not
            artwork_bg_color. Present and absent with motion_artwork_url.
        motion_artwork_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_bg_color.
        resource:
          $ref: '#/components/schemas/ResourceMark'
          description: The album's record; absent when amdl has none.
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/AlbumTrack'
          description: The album's songs, sorted by disc_number, then track_number; empty when it has none.
    PlaylistResponse:
      type: object
      required: [storefront, id, url, title, track_count, tracks]
      description: >-
        A playlist's metadata and its songs, in the fields of AlbumResponse:
        artist_name is the curator, and the album-only fields (artist_url,
        release_date, genre, content_rating, apple_digital_master, the motion
        artwork) are absent. Each field is absent when the catalog has no value.
      properties:
        storefront:
          type: string
          description: The storefront read, lowercase.
        id:
          type: string
          description: Apple Music catalog playlist id.
        url:
          type: string
          description: >-
            A music.apple.com link that downloads the whole playlist when
            submitted: Apple's page without its query, or one built from the id.
        title:
          type: string
        artist_name:
          type: string
          description: The playlist's curator.
        artwork_url:
          type: string
          description: Artwork URL template with {w}x{h} placeholders, as on Job.
        artwork_bg_color:
          type: string
          description: Background color of that artwork, hex without "#".
        artwork_text_color1: {type: string}
        artwork_text_color2: {type: string}
        artwork_text_color3: {type: string}
        artwork_text_color4: {type: string}
        track_count:
          type: integer
          description: The number of entries in tracks.
        disc_count:
          type: integer
          description: 1 when the playlist has songs; absent when it has none.
        audio_traits:
          $ref: '#/components/schemas/AudioTraits'
        resource:
          $ref: '#/components/schemas/ResourceMark'
          description: The playlist's record; absent when amdl has none.
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/AlbumTrack'
          description: >-
            The playlist's songs in its own order, each with disc_number 1 and
            track_number its place in the list from 1; state is its main slot
            state in the playlist's record. Empty when it has none.
    AlbumTrack:
      type: object
      required: [id, url, disc_number, track_number, name]
      description: >-
        One song of an album. The metadata fields have the names and meaning of
        the SearchSong fields of the same name; each is absent when the catalog
        has no value.
      properties:
        id:
          type: string
          description: Apple Music catalog id of the song, the adam_id of its job item.
        url:
          type: string
          description: A /song/ link that downloads exactly this song when submitted, as on a song search hit.
        disc_number:
          type: integer
          minimum: 1
          description: The disc the song is on; 1 when the catalog sends none.
        track_number:
          type: integer
          description: The song's position on its disc; 0 when the catalog sends none.
        name:
          type: string
        artist_name: {type: string}
        duration_ms:
          type: integer
        content_rating:
          type: string
          enum: [explicit, clean]
          description: Absent when unrated.
        apple_digital_master:
          type: boolean
          description: True when the catalog marks the song isAppleDigitalMaster; absent otherwise.
        audio_traits:
          $ref: '#/components/schemas/AudioTraits'
        has_lyrics:
          type: boolean
          description: True when the catalog reports lyrics for the song (regular or time-synced); absent otherwise.
        state:
          $ref: '#/components/schemas/AudioState'
          description: >-
            The song's main slot state in the album's record; absent when the
            record does not list it, or there is no record.
    ResourceRef:
      type: object
      required: [kind, id]
      description: Names a record.
      properties:
        kind:
          type: string
          enum: [album, playlist]
        id:
          type: string
          description: The catalog id, without a storefront.
    RunTrigger:
      type: string
      enum: [manual, library_sync, artist, retry, reset, import_1x]
      description: >-
        What started a run: an add by hand (and stations), the library monitor,
        an artist link, an automatic retry of failed slots, a reset or a
        retry, or the 1.x import.
    RecordState:
      type: string
      enum: [none, partial, complete]
      description: >-
        A record's rollup over the main slots of its wanted, available tracks:
        none when none is done, complete when every one is and the record is
        resolved, partial otherwise (an unresolved record with files, such as
        a 1.x import, is partial).
    AudioState:
      type: string
      enum: [pending, running, done, failed, given_up, unavailable, missing]
      description: >-
        One slot's audio: done when the file landed (download, decrypt, remux,
        verify and tags); failed waits for an automatic retry (next_attempt_at);
        given_up waits for a reset; unavailable is not offered (the codec, or
        the account storefront) and never retried; missing is a done file a
        disk check did not find.
    ResourceMark:
      type: object
      required: [kind, id, state, tracks_done, tracks_wanted, withheld_count, wanted_all, paused]
      description: >-
        The record holding a catalog object, as search hits, lookups and the
        album page mark it; read from the records, never from the disk.
      properties:
        kind:
          type: string
          enum: [album, playlist]
        id: {type: string}
        state:
          $ref: '#/components/schemas/RecordState'
        tracks_done: {type: integer}
        tracks_wanted: {type: integer}
        withheld_count:
          type: integer
          description: Tracks of the release the account storefront does not list; 0 for playlists.
        wanted_all:
          type: boolean
          description: >-
            True for a whole album and for a playlist; false for an album
            record of tracks added one by one, whose state and counts cover
            only those tracks: complete then means they are done, not the
            album. Clients compare tracks_done with the album's track count
            less withheld_count to tell.
        active_job_id:
          type: string
          description: The record's queued or running run; absent without one.
        paused: {type: boolean}
        song_state:
          $ref: '#/components/schemas/AudioState'
          description: For a song, its main slot state in this album record.
    Artwork:
      type: object
      description: A record's still cover and animated covers, each with its own palette (hex without "#").
      properties:
        url: {type: string}
        colors:
          $ref: '#/components/schemas/ArtworkColors'
        motion_square_url: {type: string}
        motion_tall_url: {type: string}
        motion_square_colors:
          $ref: '#/components/schemas/ArtworkColors'
        motion_tall_colors:
          $ref: '#/components/schemas/ArtworkColors'
    ArtworkColors:
      type: object
      properties:
        bg: {type: string}
        text1: {type: string}
        text2: {type: string}
        text3: {type: string}
        text4: {type: string}
    RecordRollup:
      type: object
      required: [tracks_wanted, tracks_done, tracks_failed, tracks_given_up, tracks_missing, state]
      description: Stored with the record and recomputed with every slot write.
      properties:
        tracks_wanted: {type: integer, description: 'Wanted tracks the account storefront lists, less those whose main slot no codec offers (unavailable).'}
        tracks_done: {type: integer, description: 'Of those, tracks whose main slot is done.'}
        tracks_failed: {type: integer, description: Tracks with a failed slot.}
        tracks_given_up: {type: integer, description: Tracks with a given-up slot.}
        tracks_missing: {type: integer, description: Tracks with a missing slot.}
        state:
          $ref: '#/components/schemas/RecordState'
    AlbumResource:
      description: An album record.
      allOf:
        - $ref: '#/components/schemas/RecordRollup'
        - type: object
          required: [id, name, artist_name, artwork, release_track_count, withheld_count, catalog_state, wanted_all, paused, priority, cover_state, artist_cover_state, added_at, updated_at, activity_at]
          properties:
            id: {type: string}
            name: {type: string, description: Empty until the first read.}
            artist_name: {type: string}
            artist_id: {type: string}
            artist_url: {type: string}
            release_date: {type: string}
            genre: {type: string}
            upc: {type: string}
            content_rating: {type: string}
            artwork:
              $ref: '#/components/schemas/Artwork'
            resolved_at:
              type: string
              format: date-time
              description: When a run last read the track list; absent while the record is unresolved.
            release_track_count: {type: integer}
            withheld_count:
              type: integer
              description: Tracks of the release the account storefront does not list; not counted, not retried.
            storefront_read: {type: string, description: The storefront of the last track-list read.}
            pinned_storefront:
              type: string
              description: >-
                The storefront the record's runs read it in, set when it was
                added: the link's when an account served it, the syncing
                account's for library sync. Absent reads it in the default
                account's.
            catalog_state:
              type: string
              enum: [ok, not_in_storefront, gone]
              description: Not ok after a 404 on a run's required read; the scheduler then skips the record until a manual add, download, resume or reset sets it ok again for a new read.
            wanted_all:
              type: boolean
              description: True for a whole album; false when tracks were added one by one.
            paused: {type: boolean}
            priority:
              type: integer
              enum: [1, 2]
              description: The class its runs get, 1 manual, 2 the library monitor's.
            overrides:
              $ref: '#/components/schemas/DownloadOverrides'
            cover_state:
              type: string
              enum: [pending, done, failed, 'off']
            artist_cover_state:
              type: string
              enum: [pending, done, failed, 'off']
            added_at: {type: string, format: date-time}
            refreshed_at: {type: string, format: date-time}
            completed_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            active_job_id:
              type: string
              description: The record's queued or running run; absent without one.
            activity_at:
              type: string
              format: date-time
              description: >-
                When one of the record's runs last changed (its finish, else
                its last update), or added_at while it has none; sort=activity
                orders by it.
    PlaylistResource:
      description: A catalog playlist record (pl. id).
      allOf:
        - $ref: '#/components/schemas/RecordRollup'
        - type: object
          required: [id, name, artwork, catalog_state, paused, priority, cover_state, added_at, updated_at, activity_at]
          properties:
            id: {type: string}
            name: {type: string}
            curator_name: {type: string}
            artwork:
              $ref: '#/components/schemas/Artwork'
            resolved_at: {type: string, format: date-time}
            storefront_read: {type: string}
            pinned_storefront:
              type: string
              description: As the album record's.
            catalog_state:
              type: string
              enum: [ok, not_in_storefront, gone]
            last_modified: {type: string}
            paused: {type: boolean}
            priority: {type: integer, enum: [1, 2]}
            overrides:
              $ref: '#/components/schemas/DownloadOverrides'
            cover_state:
              type: string
              enum: [pending, done, failed, 'off']
            added_at: {type: string, format: date-time}
            refreshed_at: {type: string, format: date-time}
            completed_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            active_job_id: {type: string}
            activity_at:
              type: string
              format: date-time
              description: As the album record's.
    FileSlot:
      type: object
      required: [slot, audio_state, failures]
      description: One quality of one track copy.
      properties:
        slot:
          type: string
          description: main (the first quality, the plain file name) or a codec (another quality, named with a suffix).
        audio_state:
          $ref: '#/components/schemas/AudioState'
        lyrics_state:
          type: string
          enum: [fetched, none, disabled, failed, '']
        codec: {type: string, description: The codec that landed.}
        quality_label: {type: string}
        bit_depth: {type: integer}
        sample_rate: {type: integer}
        bitrate: {type: integer}
        file_size: {type: integer, format: int64}
        path:
          type: string
          description: Absolute; stored when the slot claims its output, so present on a running slot too.
        failures: {type: integer, description: Runs that ended the slot failed since the last reset.}
        next_attempt_at: {type: string, format: date-time, description: When a failed slot is retried.}
        last_error: {type: string}
        last_job_id: {type: string}
        completed_at: {type: string, format: date-time}
        checked_at: {type: string, format: date-time, description: When a disk check last marked it missing.}
    RecordTrack:
      type: object
      required: [song_id, name, has_lyrics, wanted, availability, files]
      description: A track of an album record, or a song of a playlist record (position, album_name, removed_at).
      properties:
        song_id: {type: string}
        disc_number: {type: integer}
        track_number: {type: integer}
        song_number: {type: integer, description: "The {SongNumber} its file is named with."}
        position: {type: integer}
        name: {type: string}
        artist_name: {type: string}
        album_name: {type: string}
        duration_ms: {type: integer}
        has_lyrics: {type: boolean}
        wanted: {type: boolean, description: Counts toward the record and is downloaded.}
        availability:
          type: string
          enum: [available, unavailable]
        removed_at: {type: string, format: date-time, description: When a song left the playlist; its file stays.}
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileSlot'
    RecordDetail:
      description: >-
        A record (AlbumResource or PlaylistResource fields) with why it exists,
        whether it is in the Apple library, when a check last covered it, and
        its tracks.
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/AlbumResource'
            - $ref: '#/components/schemas/PlaylistResource'
        - type: object
          required: [sources, tracks]
          properties:
            sources:
              type: array
              items:
                type: string
                enum: [manual, library_sync, artist, import_1x]
            in_apple_library:
              type: boolean
              description: Absent when the Apple library cache cannot tell.
            last_checked_at:
              type: string
              format: date-time
              description: When a finished disk check of the library or of this record last ran.
            tracks:
              type: array
              items:
                $ref: '#/components/schemas/RecordTrack'
    PendingAdd:
      type: object
      required: [id, kind, catalog_id, source, priority, paused, added_at, attempts, state]
      properties:
        id: {type: integer, format: int64}
        kind:
          type: string
          enum: [song, artist, album, playlist]
        catalog_id: {type: string}
        album_hint: {type: string}
        source:
          type: string
          enum: [manual, library_sync, artist, import_1x]
        priority: {type: integer}
        paused: {type: boolean, description: Becomes paused records (the 1.x import).}
        include:
          type: string
          enum: [all, albums]
          description: An artist add's albums.
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
        added_at: {type: string, format: date-time}
        attempts: {type: integer}
        last_error: {type: string}
        state:
          type: string
          enum: [pending, failed]
        storefront:
          type: string
          description: >-
            The storefront the add is read in and the pin of the records it
            becomes; "" reads it in the default account's.
    CheckRun:
      type: object
      required: [id, trigger, scope, started_at, checked, missing]
      properties:
        id: {type: integer, format: int64}
        trigger:
          type: string
          enum: [manual, patrol]
        scope:
          type: string
          description: all, or <kind>:<id> for one record.
        started_at: {type: string, format: date-time}
        finished_at:
          type: string
          format: date-time
          description: Absent while the check runs.
        checked: {type: integer, description: Files stated so far.}
        missing: {type: integer, description: 'Of those, files not found.'}
        aborted_reason:
          type: string
          enum: [too_many_missing, interrupted, failed]
          description: >-
            Set when the check marked nothing: too_many_missing (more than half
            missing and not forced), interrupted (the server stopped), failed (a
            store error).
    LibrarySummary:
      type: object
      required: [albums, playlists, pending, check]
      properties:
        albums:
          $ref: '#/components/schemas/RecordCounts'
        playlists:
          $ref: '#/components/schemas/RecordCounts'
        pending:
          type: object
          required: [pending, failed]
          properties:
            pending: {type: integer}
            failed: {type: integer}
        check:
          oneOf:
            - $ref: '#/components/schemas/CheckRun'
            - type: 'null'
    RecordCounts:
      type: object
      required: [total, states, flags]
      properties:
        total: {type: integer}
        states:
          type: object
          required: [none, partial, complete]
          properties:
            none: {type: integer}
            partial: {type: integer}
            complete: {type: integer}
        flags:
          type: object
          required: [failed, given_up, missing, waiting, paused, unresolved]
          properties:
            failed: {type: integer}
            given_up: {type: integer}
            missing: {type: integer}
            waiting: {type: integer}
            paused: {type: integer}
            unresolved: {type: integer}
    LibraryAddRequest:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          items: {type: string}
          description: As DownloadRequest.urls.
        codecs:
          type: array
          items:
            type: string
            enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
          description: The codec order of the main slots the add creates (overrides.quality_priority).
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
        now:
          type: boolean
          description: Each run the add queues starts next (priority 0).
        include:
          type: string
          enum: [all, albums]
          default: all
          description: An artist link's albums; albums leaves singles out.
    RecordDownloadRequest:
      type: object
      additionalProperties: false
      properties:
        codec:
          type: string
          enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
          description: Another quality to download for each track whose main slot is done.
        songs:
          type: array
          items: {type: string}
          description: The tracks codec applies to; every track when absent.
        now:
          type: boolean
          description: The run starts next.
    RecordResetRequest:
      type: object
      additionalProperties: false
      required: [what]
      properties:
        what:
          type: string
          enum: [all, audio, lyrics, covers]
          description: >-
            all: every slot, failures and the paused flag, and the covers;
            audio: the selected slots' files; lyrics: the lyrics of done slots;
            covers: the cover files.
        slot:
          type: string
          description: With audio, only this slot (main or a codec).
        songs:
          type: array
          items: {type: string}
          description: Only these tracks; every track when absent.
        codecs:
          type: array
          items:
            type: string
            enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
          description: With audio and slot main, the main slots' new codec order.
        states:
          type: array
          items:
            $ref: '#/components/schemas/AudioState'
          description: With audio, only slots in these states (missing downloads the missing files again).
    LibraryResetRequest:
      type: object
      additionalProperties: false
      required: [what, filter]
      properties:
        what:
          type: string
          enum: [all, audio, lyrics, covers]
          description: As RecordResetRequest.what.
        slot:
          type: string
          description: With audio, only this slot (main or a codec).
        codecs:
          type: array
          items: {type: string}
          description: With audio and slot main, the main slots' new codec order.
        states:
          type: array
          items:
            $ref: '#/components/schemas/AudioState'
          description: With audio, only slots in these states; by default the states the filter's flags name.
        kind:
          type: string
          enum: [albums, playlists]
          description: Only records of this kind; both when absent.
        filter:
          type: object
          additionalProperties: false
          description: The records to reset, as the list filters select them; at least one field.
          properties:
            state:
              type: array
              items:
                $ref: '#/components/schemas/RecordState'
            flag:
              type: array
              items:
                type: string
                enum: [failed, given_up, missing, waiting, paused, unresolved]
            source:
              type: string
              enum: [manual, library_sync, artist, import_1x]
            q: {type: string}
    CheckRequest:
      type: object
      additionalProperties: false
      description: An empty body checks the whole library.
      properties:
        kind:
          type: string
          enum: [albums, playlists]
          description: With id, check one record.
        id:
          type: string
          description: The record's catalog id, with kind.
        force:
          type: boolean
          description: Mark what is missing even when more than half the checked files are.
    Job:
      type: object
      required: [id, input, type, status, total_items, completed_items, skipped_items, failed_items, cancelled_items, created_at, updated_at]
      properties:
        id:
          type: string
        input:
          type: string
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        storefront:
          type: string
        title:
          type: string
          description: >-
            Display name resolved from Apple Music metadata (track/album/
            playlist/artist name). Populated once the job's input is
            resolved; absent before that or for jobs created before this
            field existed — clients should fall back to deriving a name
            from `input` in that case.
        artwork_url:
          type: string
          description: >-
            Cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. A private playlist may instead expose the owner's
            pre-signed S3 artwork URL verbatim; that URL can expire and has no
            placeholders. Populated once the job's input is resolved; absent
            for jobs created before this field existed.
        artist_name:
          type: string
          description: >-
            Display artist resolved from Apple Music metadata: the album's or
            song's artist name, or for artist jobs the artist's own name.
            Absent for playlist/station jobs, before the input is resolved,
            or for jobs resolved before this field existed.
        artist_url:
          type: string
          description: >-
            That artist's own page on music.apple.com, read from the artist
            resource Apple includes with the resolved collection
            (attributes.url). A client linking the artist should use this
            rather than searching `artist_name`. Present alongside
            `artist_name` for song/album/artist jobs; absent for
            playlist/station jobs (their display name is a curator, not an
            artist), before the input is resolved, for jobs resolved before
            this field existed, and in the rare case where the catalog
            response carries no artist relationship.
        curator_name:
          type: string
          description: >-
            Display curator resolved from Apple Music metadata: the playlist's
            curatorName (falling back to its artistName), or the station's
            provider label. Absent for song/album/artist jobs, before the
            input is resolved, or for jobs resolved before this field existed.
        release_date:
          type: string
          description: >-
            Release date (YYYY-MM-DD) of the album or song. Absent for other
            job types, before the input is resolved, or for jobs resolved
            before this field existed.
        genre:
          type: string
          description: >-
            Primary genre of the album or song — the first Apple Music
            genreNames entry that is not the generic "Music" umbrella genre.
            Absent for other job types, before the input is resolved, or for
            jobs resolved before this field existed.
        artwork_bg_color:
          type: string
          description: >-
            Background color of the resolved collection artwork, from Apple
            Music's attributes.artwork bgColor: a hex string without a
            leading "#" (e.g. "1a1a1a"). Absent before the input is resolved,
            when the catalog omits the palette, or for jobs resolved before
            this field existed.
        artwork_text_color1:
          type: string
          description: >-
            Primary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor1: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color2:
          type: string
          description: >-
            Secondary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor2: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color3:
          type: string
          description: >-
            Tertiary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor3: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color4:
          type: string
          description: >-
            Quaternary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor4: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        motion_artwork_url:
          type: string
          description: >-
            HLS master playlist for the album's animated cover (1:1), from Apple
            Music's attributes.editorialVideo motionDetailSquare. A public,
            unsigned URL that a client can hand straight to a video player.

            Only album and song jobs can have one, and only some albums do. It is
            resolved out of band after the input resolves, so a freshly started
            job reports it absent and gains it moments later, announced by a
            motion_artwork_resolved event. Treat absent as "no animated cover"
            and re-render when the job updates.

            That event is an overview milestone, so the downloads feed
            (GET /api/v1/downloads/events) both pushes it live and replays it
            from a cursor. Follow the feed rather than the per-job stream for
            this one field: short jobs commonly resolve their cover after
            reaching a terminal status, by which point the per-job stream has
            already closed.
        motion_artwork_tall_url:
          type: string
          description: >-
            The 3:4 variant of motion_artwork_url (motionDetailTall), for
            full-bleed presentations. Present and absent under the same
            conditions.
        motion_artwork_bg_color:
          type: string
          description: >-
            Background color for the 1:1 animated cover, from that variant's
            previewFrame. Hex without a leading "#".

            This is NOT artwork_bg_color. Each asset carries its own palette and
            they differ sharply — one album reports 598090 with near-black text
            for the still cover, 5c6786 with near-white text for the square loop,
            and 05104b with light text for the tall one. Apple Music pairs the
            palette with whichever asset it displays; mixing the still palette
            with a motion asset yields dark text on a dark video.
        motion_artwork_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_bg_color.
        motion_artwork_tall_bg_color:
          type: string
          description: >-
            Background color for the 3:4 animated cover, from the tall variant's
            previewFrame. Use this one when presenting motion_artwork_tall_url.
        motion_artwork_tall_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_tall_bg_color.
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            The configuration overrides submitted with the job; omitted when none
            were given.
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        resource:
          $ref: '#/components/schemas/ResourceRef'
          description: >-
            The record this run downloads for; absent for a station and for
            imported 1.x song and artist history.
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        priority:
          type: integer
          enum: [0, 1, 2]
          description: >-
            The run's claim class: 0 download now, 1 manual (and stations), 2
            the library monitor's. Queued runs start by class, then queue_order.
        queue_order:
          type: integer
          format: int64
          description: >-
            The job's place in the run order, present only while status is
            queued: when a worker frees up it starts the queued job with the
            lowest value. Sort queued jobs ascending by it to show the queue in
            run order. Values are sparse and only their order means anything; a
            new or retried job goes behind every other, POST
            /downloads/{job_id}/move changes it, and a job recovered after a
            restart that was running goes ahead of the queued ones.
        total_items:
          type: integer
          minimum: 0
          description: >-
            Number of tracks the input resolved to; 0 until the input resolves.
        completed_items:
          type: integer
          minimum: 0
          description: >-
            Items this job wrote to disk (item status completed). The four item
            counters are disjoint and derived from the job's items on every
            read, so they always agree with the items of GET /downloads/{job_id}.
        skipped_items:
          type: integer
          minimum: 0
          description: >-
            Items not downloaded and not failed: the file was already at the
            slot's path (skipped_existing), or the track does not offer the
            slot (unavailable).
        failed_items:
          type: integer
          minimum: 0
          description: Items that failed (item status failed).
        cancelled_items:
          type: integer
          minimum: 0
          description: Items that were cancelled (item status cancelled).
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            The job's overall progress, the mean of its tracks' stage-weighted
            progress (what the console's album bar shows): below 1 while a track
            has not finished, 1 once the job completed. Derived from the items on
            every read, to three decimals. Present in GET /downloads, GET
            /downloads/{job_id} and the overview feed's snapshots; event payloads
            leave it out.
        error:
          type: string
        started_at:
          type: string
          format: date-time
          description: >-
            When a worker first started the current run; kept across recovery
            after a restart. A retry starts a new run and clears it. Absent
            until the run starts (a job cancelled while queued never has one).
        finished_at:
          type: string
          format: date-time
          description: >-
            When the job reached its current terminal status. Absent while the
            job is queued or running; a retry clears it.
        created_at:
          type: string
          format: date-time
          description: >-
            When the job was last submitted: a resubmit of the same link sets it
            again, a retry does not.
        updated_at:
          type: string
          format: date-time
    ItemProgress:
      type: object
      description: >-
        Per-stage breakdown of one item's download pipeline. Replaces the single
        0..1 `progress` aggregate that used to span every stage on one axis:
        download and decrypt shared sub-ranges of it, and the atomic stages were
        only fixed points — 0.97 never meant "97% tagged", just "tagging
        started".

        The two stages that genuinely have a fraction get their own meter; every
        other stage is a done/not-done flag. There is deliberately no overall
        percentage: any single number would have to re-impose the arbitrary
        weighting this object exists to remove. A client that wants one bar
        should weight these fields to suit its own UI.

        All fields are always present. The zero value means nothing has run yet,
        which is what a queued item reports. Use `status`, not this object, to
        decide whether an item is finished — a `skipped_existing` item reports
        `resolved` true (the catalog lookup is what produced the path found to
        already exist) with every later stage false, because the file was
        already on disk and nothing downloaded, decrypted, or wrote it.

        A codec fallback or retry resets the breakdown to `resolved` only, so
        the meters and flags always describe the attempt currently in flight,
        never one that already failed.
      required: [download, decrypt, download_bytes, resolved, remuxed, verified, tagged, saved]
      properties:
        download:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted media transferred. Stays at 0
            while the transfer cannot be measured (a media response without a
            Content-Length never yields a fraction), so 0 alongside
            status=downloading means "running, size unknown", not "no bytes
            yet". Pinned to 1 when the item completes.
        download_bytes:
          type: integer
          format: int64
          description: >-
            Bytes of the encrypted media the current attempt has received, the
            amount `download` is the share of. It moves together with
            `download`, so it is as coarse (whole-percent steps) and is 0 in the
            same cases: before the transfer starts and while it cannot be
            measured. Unlike `download` it is not pinned when the item
            completes; the final size is the item's `file_size`. A client adds
            it to the `file_size` of the finished items for the bytes a job has
            moved so far.
        decrypt:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted bytes fed through the decryptor.
            The aac-lc path decrypts in one opaque pass with no intermediate
            count, so there it jumps 0 → 1 at the remux boundary instead of
            sweeping. Pinned to 1 when the item completes.
        resolved:
          type: boolean
          description: Catalog metadata for the track was fetched.
        remuxed:
          type: boolean
          description: >-
            The decrypted stream was flattened into a progressive MP4.
        verified:
          type: boolean
          description: >-
            The integrity check ran and passed (for ALAC, possibly after a
            successful repair). Also false when the check is switched off by
            the `download.check_integrity` config key, so false means "not
            verified", never "corrupt" — a failed check fails the whole item
            instead. This is the one flag a completed item may legitimately
            leave false.
        tagged:
          type: boolean
          description: >-
            Metadata — and cover art / lyrics, per config — was written into
            the file.
        saved:
          type: boolean
          description: >-
            The finished file was moved to its final output path. This is the
            last step of the pipeline, so `saved` is true for exactly those
            items that reached status=completed.
    JobItem:
      type: object
      required: [id, job_id, adam_id, kind, index, has_lyrics, status, progress, created_at, updated_at]
      properties:
        id: {type: string}
        job_id: {type: string}
        adam_id: {type: string}
        kind: {type: string}
        index: {type: integer}
        title: {type: string}
        artist: {type: string}
        album: {type: string}
        duration_ms:
          type: integer
          description: >-
            Track playback duration in milliseconds, resolved from the Apple
            Music catalog alongside title/artist/album (available before the
            download runs). 0/absent for items created before this field
            existed or when the catalog omits it; a retry keeps it.
        artwork_url:
          type: string
          description: >-
            Track cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. Absent for items created before this field existed.
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Set when the collection resolves and
            refreshed when the track's own metadata is fetched. Catalog
            metadata only — it does not guarantee the lyrics can actually
            be fetched at download time. Defaults to false for items
            created before this field existed, until the item is next
            re-processed (e.g. by a retry).
        lyrics_status:
          type: string
          enum: [fetched, failed, none, disabled]
          description: >-
            Durable outcome of this download attempt's lyrics fetch,
            complementing has_lyrics (the catalog's claim) with what
            actually happened. `fetched`: lyrics were fetched and
            converted successfully (the download that follows embeds
            and/or saves them per the config — the flag reflects the
            fetch outcome only; whether the file was produced is the
            item's own status); `failed`: the catalog reported lyrics but
            fetching or converting them failed and the download continued
            without lyrics; `none`: the catalog reports no lyrics for
            this track; `disabled`: lyrics exist but embed_lyrics is off
            and lyrics_files is empty. Absent while undetermined
            (item not yet processed, or created before this field
            existed) and cleared when a retry re-processes the item.
            Normally absent on skipped_existing items too: a track whose
            file is already on disk is skipped before lyrics are fetched,
            unless an earlier codec of the same track fetched them before
            a later codec's file was found on disk. On
            completed items the value keeps describing the download that
            produced the file on disk, while has_lyrics may be refreshed by a later re-resolve —
            e.g. has_lyrics=true with lyrics_status=none means the file
            predates lyrics becoming available in the catalog.
        status:
          type: string
          description: >-
            Current pipeline state. `waiting_download` and `waiting_decrypt`
            mean the item is queued at the corresponding global concurrency
            pool, and `waiting_decrypt` also covers waiting for the track's
            decryption keys; `downloading` and `decrypting` begin only after
            that pool has admitted the item.
          enum: [queued, resolving, waiting_download, downloading, waiting_decrypt, decrypting, remuxing, tagging, saving, completed, failed, skipped_existing, unavailable, cancelled]
        slot:
          type: string
          description: >-
            The quality slot the item downloads: main, or a codec for another
            quality. Absent for a station's items.
        progress:
          $ref: '#/components/schemas/ItemProgress'
        codec: {type: string}
        bit_depth:
          type: integer
          description: >-
            Bit depth of the codec currently being attempted (e.g. 24 for
            ALAC lossless). 0/absent for lossy codecs (e.g. AAC/AAC-LC) and
            before the codec's quality has been resolved.
        sample_rate:
          type: integer
          description: >-
            Sample rate in Hz of the codec currently being attempted (e.g.
            96000). Taken from the HLS manifest; when the manifest names none
            (AAC variants, aac-lc) it is read from the finished file just
            before the track is tagged, so it stays 0/absent until then, and
            for good if the file declares none.
        bitrate:
          type: integer
          description: >-
            Bitrate in bits per second of the codec currently being
            attempted: the HLS variant's advertised average bandwidth, not a
            true constant bitrate, and 256000 for aac-lc, whose media
            playlist declares none. 0/absent before the codec's quality has
            been resolved.
        file_size:
          type: integer
          format: int64
          description: >-
            Size in bytes of the final output file, set once the track is
            written to disk (completed) or found already present
            (skipped_existing). 0/absent until then, and for items produced
            before this field existed or whose file could not be stat'd.
        output_path:
          type: string
          description: >-
            Absolute path of the track's file on the machine that runs the
            backend (a relative download.downloads_dir is resolved against the
            backend's working directory). Present only once the file is on disk
            (completed, skipped_existing); absent before that, for failed or
            cancelled items, and when no path was stored. The item's event
            payloads carry it under the same rule.
        retry_kind: {type: string}
        attempt: {type: integer}
        max_attempts: {type: integer}
        status_message: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DownloadList:
      type: object
      required: [downloads, status_counts, total, limit, offset, event_cursor]
      properties:
        downloads:
          type: array
          description: >-
            Download jobs on the current page; each job's item counters are
            derived from its items at the time of the request.
          items:
            $ref: '#/components/schemas/Job'
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: Job status counts matching the current query filters, unaffected by limit/offset.
        total:
          type: integer
          description: Total number of jobs matching the current filters (unaffected by limit/offset).
        limit:
          type: integer
          description: The page size actually used.
        offset:
          type: integer
          description: The offset actually used.
        event_cursor:
          type: integer
          format: int64
          description: >-
            The latest persisted event id globally (across all jobs; 0 when there
            are no events yet), read before the snapshot. Pass it as ?cursor= (or
            Last-Event-ID) to GET /downloads/events to receive only list changes
            after this snapshot; resuming from it never skips an event.
    DownloadStatusCounts:
      type: object
      description: >-
        Always returns all five job statuses; statuses with no matching jobs are
        0, and total is the sum of the five statuses.
      required: [queued, running, completed, failed, cancelled, total]
      properties:
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    DownloadFeedMessage:
      type: object
      required: [type, status_counts]
      description: >-
        One push on the overview event stream (GET /downloads/events). Every
        message carries the latest global job status counts.
      properties:
        type:
          type: string
          enum: [download_upserted, download_deleted, resource_updated, resource_deleted, check_updated]
          description: >-
            download_upserted: a job was created or changed, and job is its latest
            snapshot; download_deleted: a job was deleted, and job_id is the
            deleted job's id; resource_updated: right after the download_upserted
            of a record's run, or after the record changed outside its runs,
            resource is the record (AlbumResource or PlaylistResource);
            resource_deleted: the record named by resource_kind and resource_id
            was deleted; check_updated: check is the disk check that started,
            moved on or ended.
        job:
          $ref: '#/components/schemas/Job'
        job_id:
          type: string
          description: Present only for download_deleted; the id of the deleted job.
        resource_kind:
          type: string
          enum: [album, playlist]
          description: Present only for resource_updated and resource_deleted.
        resource_id:
          type: string
          description: Present only for resource_updated and resource_deleted.
        resource:
          description: Present only for resource_updated.
          oneOf:
            - $ref: '#/components/schemas/AlbumResource'
            - $ref: '#/components/schemas/PlaylistResource'
        check:
          $ref: '#/components/schemas/CheckRun'
          description: Present only for check_updated.
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: >-
            Status counts of all current jobs; the live push endpoints have no list
            filter parameters, so these are always global counts. In
            download_deleted the deleted job has already been subtracted.
        event_id:
          type: integer
          format: int64
          description: >-
            Resume cursor. For download_upserted it is the id of the milestone
            event that triggered this job snapshot; for download_deleted it is the
            id of the deletion tombstone event, or of the job's latest event when
            the job no longer exists (neither is the largest id pushed in the same
            batch). After processing, clients use it as the next resume
            point; it strictly increases from message to message. On reconnect,
            undelivered updates are only ever resent (upsert and delete are both
            idempotent), never skipped.
    DownloadDetail:
      type: object
      required: [job, items, hooks, event_cursor]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        hooks:
          type: array
          description: >-
            The latest state of each post-download hook that has fired, derived
            from the hook_started/hook_succeeded/hook_failed events in the event
            stream — the snapshot endpoint and the SSE event stream are two ways
            to read the same state. An empty array when the job has not fired any
            hook yet (including when no hook is configured or the job has not
            finished).
          items:
            $ref: '#/components/schemas/HookState'
        event_cursor:
          type: integer
          format: int64
          description: >-
            The latest persisted event id for this job (0 when there are no events
            yet), read before the snapshot. Pass it as ?cursor= (or Last-Event-ID)
            to GET /downloads/{job_id}/events to skip the events already reflected
            in this response and receive only later updates.
    EventType:
      type: string
      description: >-
        Type of a persisted job event, and the SSE event name on
        GET /downloads/{job_id}/events. Retries inside a codec attempt are
        operation_retry / operation_exhausted / operation_recovered with the codec
        as phase. Only job_queued, job_recovered, job_started, job_moved,
        resolved_input, motion_artwork_resolved, item_completed, item_skipped,
        item_unavailable, lyrics_refreshed, item_failed, job_finished,
        job_failed, job_cancelled, job_deleted and record_changed reach the
        overview feed. record_changed belongs to no job (job_id is empty): a
        record was paused, resumed, reset, added to, asked for again, deleted
        or had files found missing; its payload is {resource_kind,
        resource_id}, and a record keeps only its latest one.
        job_moved records a queued job's new queue_order (its payload is the
        Job). item_unavailable ends an item whose slot the track does not offer
        (the codec, or the account storefront); lyrics_refreshed ends an item
        of a lyrics reset. job_retried and item_overwrite are not emitted since
        2.0, where a retry is a new job; they stay so 1.x history decodes.
        Clients should ignore types they do not know.
      enum:
        - job_queued
        - job_started
        - job_retried
        - job_recovered
        - job_finished
        - job_failed
        - job_cancelled
        - job_moved
        - job_deleted
        - record_changed
        - resolved_input
        - motion_artwork_resolved
        - standalone_cover_failed
        - item_progress
        - item_completed
        - item_failed
        - item_skipped
        - item_unavailable
        - lyrics_refreshed
        - item_overwrite
        - codec_selected
        - codec_fallback
        - codec_failed
        - alac_repaired
        - integrity_overruled
        - operation_retry
        - operation_exhausted
        - operation_recovered
        - hook_started
        - hook_succeeded
        - hook_failed
    Event:
      type: object
      required: [id, job_id, type, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Resume cursor (SSE id); strictly increasing across all jobs.
        job_id:
          type: string
        item_id:
          type: string
          description: Present on events about one item.
        type:
          $ref: '#/components/schemas/EventType'
        phase:
          type: string
          description: >-
            item_progress: the item status. codec_* and operation_* events: the
            codec, or the operation (resolve_tracks, metadata, cover, lyrics,
            download, decrypt) when no codec applies. hook_*: the hook name.
            standalone_cover_failed for a playlist cover: playlist_cover.
        message:
          type: string
          description: Human-readable summary; its wording may change between releases.
        payload:
          type: object
          additionalProperties: true
          description: >-
            A JSON object, absent when the event has none. Job lifecycle events
            and resolved_input: the public Job snapshot plus message. Events
            with an item_id: the public JobItem snapshot plus event-specific
            fields (for example attempts, will_retry, delay_ms, codec), except
            alac_repaired, which carries only patched_packets, and
            integrity_overruled, which carries only quick_error. operation_*
            without an item_id: operation, codec, attempt, max_attempts and the
            retry fields. hook_*: hook plus attempt and duration_ms, or attempts.
            Any other event with a message: {message}. job_deleted and
            motion_artwork_resolved have none.
        created_at:
          type: string
          format: date-time
    HookState:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The name of this hook entry in hooks.yaml.
        status:
          type: string
          enum: [running, succeeded, failed, interrupted]
          description: >-
            running: the hook is executing; succeeded: it ran successfully; failed:
            it still failed after its retries were exhausted; interrupted: the event
            records show the hook started but have no terminal record, and it is
            not running now either (usually the service restarted while it ran, so
            this hook will never produce a result).
        error:
          type: string
          description: The last error message when status is failed; omitted for other statuses.

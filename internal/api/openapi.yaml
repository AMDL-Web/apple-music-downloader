openapi: 3.1.0
info:
  title: AMDL Backend API
  version: 2.0.1
  description: |
    Apple Music download jobs and wrapper account management API. The URL prefix
    stays /api/v1; info.version is the version of this contract.

    Errors: every non-2xx JSON response is an ErrorResponse,
    `{"error": {"code", "message", "details"?}}`. Switch on `code` (the
    ErrorCode enum); `message` is for humans and may change; `details` is
    code-specific. The one exception is GET /api/v1/health, whose 503 body is a
    HealthResponse. A path under /api/ that does not exist answers 404
    route_not_found; a path that exists with other methods answers 405
    method_not_allowed with an Allow header. The log routes answer 503
    feature_unavailable when the process keeps no log history.

    Streams are Server-Sent Events. Each resumes from the Last-Event-ID header or
    the `cursor` query parameter; the header wins when both are set, and a
    malformed cursor is 400 invalid_request. Every stream sends a `: keepalive`
    comment every 15 seconds and the X-Accel-Buffering: no header.
servers:
  - url: /
tags:
  - name: System
  - name: Wrapper
  - name: Accounts
  - name: Quality
  - name: Library
  - name: Downloads
  - name: Search
  - name: Apple library
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: The backend is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The local database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/system:
    get:
      tags: [System]
      summary: Build, runtime capacity and host resources
      description: >-
        Reports the running build (version, commit and build date stamped at
        build time; version is dev and the other two come from the VCS stamp or
        are empty for a build without them), the Go runtime, process start and
        uptime, the simulate flag, the job workers and queue, the process-wide
        pool sizes, the external tools, and the free space of
        download.downloads_dir and download.temp_dir. It never returns a secret.
      operationId: getSystem
      responses:
        '200':
          description: The system snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/system/restart:
    post:
      tags: [System]
      summary: Stop the backend and start it again in the same process
      description: >-
        Answers 202, then stops every component the way a shutdown does (running
        jobs are interrupted and resume after the start) and starts again from
        configs/config.yaml, which applies the keys in pending_restart. No
        supervisor is needed: amdl serve, the container and the desktop app restart
        in place, on the same address. The API does not answer for the few seconds
        the restart takes; poll GET /api/v1/health.
      operationId: restartSystem
      responses:
        '202':
          description: The restart is under way.
          content:
            application/json:
              schema:
                type: object
                required: [restarting]
                properties:
                  restarting:
                    type: boolean
                    enum: [true]
        '503':
          description: >-
            feature_unavailable: this backend runs inside a program that cannot
            start it again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stats:
    get:
      tags: [System]
      summary: Download activity statistics
      description: >-
        Totals and the codec mix over every retained job, plus a per-day series
        and hook outcomes for the last `days` UTC calendar days, today included.
        Only jobs that still exist count: deleting a job removes its items and
        events. Results are cached for 30 seconds per `days` value;
        generated_at says when a result was computed.
      operationId: getStats
      parameters:
        - $ref: '#/components/parameters/StatsDays'
      responses:
        '200':
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          description: invalid_request; days is not an integer between 1 and 90.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/logs:
    get:
      tags: [System]
      summary: Query process logs
      description: >-
        Queries the recent structured logs retained by logging.buffer_size, returned
        in ascending time order. The first query returns the most recent `limit`
        entries; follow-up queries with `cursor` page onward from that sequence,
        and next_cursor can be passed as the next query's cursor. oldest_sequence
        is the oldest sequence number still retained; truncated means entries
        between `cursor` and it have already been evicted from the in-memory ring.
        Sensitive attributes are redacted uniformly before they enter the buffer or
        any external output.
      operationId: listLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogCursor'
        - $ref: '#/components/parameters/LogLimit'
      responses:
        '200':
          description: Matching logs and the cursor for the next query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: >-
            feature_unavailable; logging.buffer_size is 0, so no log history is
            retained, or the log buffer is not wired into this process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/logs/stream:
    get:
      tags: [System]
      summary: Stream process logs live
      description: >-
        SSE log stream. Matching entries still in memory after the cursor are
        replayed first, then new entries keep being pushed; every event is named log
        and its SSE id equals the log sequence. The cursor is the Last-Event-ID
        header or the `cursor` query parameter (the header wins). With a cursor,
        every matching entry still in memory is replayed; without one, the most
        recent entries are replayed up to `limit`. The server sends a keepalive
        comment every 15 seconds; if the client keeps reading too slowly the
        connection is closed, and the client should reconnect with the last id it
        received to catch up.
      operationId: streamLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogCursor'
        - $ref: '#/components/parameters/LogLimit'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: text/event-stream; data is LogEntry JSON.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: >-
            feature_unavailable; logging.buffer_size is 0, so no log history is
            retained, or the log buffer is not wired into this process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config:
    get:
      tags: [System]
      summary: Read the configuration clients can change
      description: >-
        Returns every key except the three that change only in configs/config.yaml
        (server.listen, database.path, tools.ffmpeg). Runtime keys are returned as
        they run. Restart keys (marked x-applies: restart in RuntimeConfig:
        logging.console and buffer_size, the wrapper connection, catalog.language,
        token_cache_ttl_hours and max_parallel_requests, download.max_running_jobs
        and max_parallel_downloads) are returned as saved in the file, which the
        next start applies; pending_restart names the keys whose saved value
        differs from the running one, a hand edit of a file-only key included.

        GET has no side effects. A hand edit of a runtime key takes effect through
        POST /api/v1/config/reload.
      operationId: getConfig
      responses:
        '200':
          description: The configuration clients can change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [System]
      summary: Update the configuration
      description: >-
        The request body overrides the saved configuration with merge semantics:
        omitted fields keep their current values, and fields that are present
        (including whole sections) are replaced. The merged result must pass the
        same full validation a start runs, so a saved value always loads.

        Only the fields returned by GET can be changed. A request that changes
        server.listen, database.path or tools.ffmpeg is rejected with 422
        config_key_not_mutable — edit configs/config.yaml and restart instead — and
        so is one that changes wrapper.address while this process runs the wrapper
        itself (details.reason managed_wrapper). An unknown field is 400
        invalid_request.

        Runtime keys take effect immediately for new requests and newly started jobs
        (running jobs keep the configuration snapshot taken when they started).
        Restart keys are saved and take effect on the next start, such as POST
        /api/v1/system/restart; the response's pending_restart names them. The
        complete configuration is written back to configs/config.yaml, so it still
        applies after a restart. That file is
        managed by the backend (rewritten in full on every PUT, comments are not
        kept); the fully commented field documentation is
        configs/config.example.yaml, which serves as the template for config.yaml
        on first start.

        PUT re-reads configs/config.yaml under the same lock before it applies the
        patch, so a hand edit made since the last reload is kept rather than
        overwritten. When that file no longer validates, PUT answers 422
        invalid_config and changes nothing; fix the file first. Frontends should
        still build the body from a fresh GET and send only the fields the user
        changed.
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: The updated runtime configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          description: >-
            invalid_json: the body is not well-formed JSON; invalid_request: it
            contains unknown fields or values of the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            config_key_not_mutable: the request changes a file-only field, or
            wrapper.address while this process runs the wrapper (details.keys lists
            them; details.reason is managed_wrapper for the latter); invalid_config:
            the merged result fails configuration validation, or
            the config file on disk no longer validates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config/reload:
    post:
      tags: [System]
      summary: Re-read the configuration file
      description: >-
        Re-reads configs/config.yaml and applies its runtime fields; the
        logging level takes effect at once. Restart and file-only fields keep their
        running values until a restart (pending_restart). The response has the shape of GET
        /api/v1/config. When the file cannot be read or fails validation (for
        example while it is half-edited), the previous configuration stays in
        place and the response is still 200, with reload_error explaining why.
      operationId: reloadConfig
      responses:
        '200':
          description: The runtime-mutable configuration after the reload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
  /api/v1/hooks:
    get:
      tags: [System]
      summary: List the available job hooks
      description: >-
        Returns the global switch and entry metadata of hooks.yaml as it was
        loaded at startup or last written through the API, in file order. Every
        enabled entry that matches a job's event and type runs for it. An entry's
        enabled value is the result after defaults are applied; an empty job_types
        array matches every job type. The response never includes a webhook's path,
        query, header values or body, nor a command or workdir: those may carry
        secrets. A webhook shows its origin and header names instead.
      operationId: listHooks
      responses:
        '200':
          description: The redacted hooks configuration; when nothing is configured, enabled is false and entries is an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksResponse'
    put:
      tags: [System]
      summary: Turn every hook on or off
      description: >-
        Sets the global enabled switch of hooks.yaml. The file is edited in place,
        keeping its comments and entries, and the change applies to the next job
        event. When hooks.yaml no longer loads, nothing is written: fix the file
        first.
      operationId: setHooksEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: The hooks configuration after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          $ref: '#/components/responses/InvalidHooksFile'
        '503':
          $ref: '#/components/responses/HooksNotEditable'
  /api/v1/hooks/presets:
    get:
      tags: [System]
      summary: List the services a webhook can be built for
      description: >-
        Returns the presets PUT /hooks/{name} builds a webhook from with preset
        and values: notifications (ntfy, Bark, Telegram), library refreshes (Plex,
        Jellyfin, Emby) and a custom request, each with the fields it asks for and
        the events a new hook of it runs on. Each builds the request its service
        documents.
      operationId: listHookPresets
      responses:
        '200':
          description: The presets, in the order an editor offers them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [presets]
                properties:
                  presets:
                    type: array
                    items:
                      $ref: '#/components/schemas/HookPreset'
  /api/v1/hooks/{name}:
    put:
      tags: [System]
      summary: Create or change a webhook hook
      description: >-
        Writes the webhook entry named name in hooks.yaml, appended when no entry has
        the name. Omitted fields keep the entry's current values, so a client can
        change a hook's events or switch without sending its address and tokens
        again; a new entry needs events and url. The result must pass the same
        validation as at startup and applies to the next job event; hooks.yaml keeps
        its comments and other entries.

        preset and values build url, method, headers and body from a preset of GET
        /hooks/presets and replace all four; a new entry of a preset runs on the
        preset's events unless events is sent. Sending preset with any of the four
        is 400. A write of url, method, headers or body without a preset clears the
        entry's preset.

        Only webhook entries are written here. A command (exec) entry is edited in
        hooks.yaml itself: a write to one answers 409 hook_read_only, and a body
        with a type other than webhook answers 400.
      operationId: updateHook
      parameters:
        - $ref: '#/components/parameters/HookName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookWrite'
      responses:
        '200':
          description: The entry as written, redacted as in GET /hooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/HookReadOnly'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            invalid_hook: the entry would not load (a missing or bad url, no
            events, an unknown method, a body that is not a template, a GET with a
            body) or a preset's values do not build (a required field left empty,
            a field it does not ask for); invalid_hooks_file: hooks.yaml on disk no
            longer loads, and nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/HooksNotEditable'
    delete:
      tags: [System]
      summary: Delete a webhook hook
      description: >-
        Removes the webhook entry named name from hooks.yaml; it no longer runs from
        the next job event on. A command (exec) entry answers 409 hook_read_only.
      operationId: deleteHook
      parameters:
        - $ref: '#/components/parameters/HookName'
      responses:
        '200':
          description: The entry has been removed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: deleted
        '404':
          $ref: '#/components/responses/HookNotFound'
        '409':
          $ref: '#/components/responses/HookReadOnly'
        '422':
          $ref: '#/components/responses/InvalidHooksFile'
        '503':
          $ref: '#/components/responses/HooksNotEditable'
  /api/v1/hooks/{name}/test:
    post:
      tags: [System]
      summary: Send a webhook hook once
      description: >-
        Sends the webhook entry named name once, as a job event would but with a
        sample payload: a finished one-track album titled "Test from amdl" under the
        entry's first event. It is sent whether or not the hook or the global switch
        is on, without retries, cut off after 30 seconds, and records no event. The
        answer is 200 either way; succeeded says whether the endpoint took it. A
        command (exec) entry is not run: 409 hook_read_only.
      operationId: testHook
      parameters:
        - $ref: '#/components/parameters/HookName'
      responses:
        '200':
          description: The test ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookTestResult'
        '404':
          $ref: '#/components/responses/HookNotFound'
        '409':
          $ref: '#/components/responses/HookReadOnly'
        '422':
          $ref: '#/components/responses/InvalidHooksFile'
        '503':
          $ref: '#/components/responses/HooksNotEditable'
  /api/v1/library-sync:
    get:
      tags: [System]
      summary: Get the library monitor status
      description: >-
        Returns the monitor's current state: the master switch and interval from
        the configuration, plus one entry per account with its own switch
        (Account.library_sync) and what its most recent poll observed. It is
        returned even when the feature is off, so clients do not have to guess
        the switch state. An account polls while the master switch and its own
        are on and the wrapper holds it (Account.state active).

        Apple does not expose when a track was added to the library (library-songs
        has no dateAdded attribute, and a library album's dateAdded is when the
        album's first track was added and does not change when songs are added to it
        later), but the **order** of sort=-dateAdded is reliable. So the watermark is
        a position rather than a time: the newest batch of track ids is remembered
        as the anchor, each poll reads newest-first until it reaches the oldest
        track in the anchor, and anything in between that is not in the anchor is
        new. anchor_size is the number of ids in that batch.
      operationId: getLibrarySyncStatus
      responses:
        '200':
          description: Monitor status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncStatus'
  /api/v1/library-sync/reset:
    post:
      tags: [System]
      summary: Reset an account's library monitor anchor
      description: >-
        Clears the anchor of the account the body names, else of the default
        account. The next poll finds no anchor, so it re-anchors on the
        library as it is **at that moment** and **submits no albums** — this
        "forgets history" rather than "replays history", and will not flood the
        download queue.

        Use it when the monitor's idea of what is "already there" has drifted from
        reality. To download a particular album again, submit it directly with
        POST /api/v1/downloads; this endpoint cannot do that.
      operationId: resetLibrarySyncAnchor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                account:
                  type: string
                  description: The account (Account.id); absent resets the default account's anchor.
      responses:
        '200':
          description: The anchor has been cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncResetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/apple-library/status:
    get:
      tags: [Apple library]
      summary: Get the Apple library cache and sync status
      description: >-
        For each account: whether its Apple Music library can be read, the
        sync under way, the last sync, and the number of cached items per kind.
        It makes no Apple request. While state is running, poll it every couple of
        seconds; there is no SSE event for the sync.
      operationId: getAppleLibraryStatus
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleLibraryStatus'
  /api/v1/apple-library/sync:
    post:
      tags: [Apple library]
      summary: Sync an account's Apple library cache now
      description: >-
        Starts a sync of the local copy of an account's library (the body's
        account, else the default account) in the background and answers at
        once with that account's entry; its current.id is the sync's id. An
        account whose apple_library switch is off answers 503
        apple_library_unavailable with reason disabled. A full sync (the default) reads every page of every
        kind and removes what left the library; an incremental one reads the
        newest additions, the playlist list and the totals. Download jobs are
        never touched.
      operationId: syncAppleLibrary
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum: [full, incremental]
                  default: full
                  description: >-
                    full reads every page of every kind and removes what left
                    the library; incremental reads only the newest additions,
                    the playlist list and the totals.
                account:
                  type: string
                  description: The account (Account.id) to sync; absent syncs the default account.
      responses:
        '202':
          description: The sync started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleLibraryAccountStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: apple_library_sync_running; a sync is under way, its id in details.sync_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AppleLibraryUnavailable'
  /api/v1/apple-library/{kind}:
    get:
      tags: [Apple library]
      summary: List one kind of an account's Apple library
      description: >-
        One page of an account's cached library: albums, songs, playlists or
        artists. Served from the local copy only; no Apple request. Before the
        first full sync of the kind completes, items is empty and synced_at is
        absent.
      operationId: listAppleLibrary
      parameters:
        - name: kind
          in: path
          required: true
          description: Which part of the library to list.
          schema:
            type: string
            enum: [albums, songs, playlists, artists]
        - name: sort
          in: query
          description: >-
            added (newest first by default; albums, songs, playlists), name, or
            artist (albums and songs). Default added, name for artists, which
            Apple gives no add order.
          schema:
            type: string
            enum: [added, name, artist]
        - name: order
          in: query
          description: Default desc for added, asc otherwise.
          schema:
            type: string
            enum: [asc, desc]
        - name: q
          in: query
          description: >-
            Keeps items whose name, artist or album contains this text
            (case-insensitive for ASCII letters); at most 200 characters.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          description: Items per page; default 50, maximum 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: '#/components/parameters/BrowseOffset'
        - name: account
          in: query
          description: >-
            The account (Account.id) whose cache to read; absent reads the
            default account's. An unknown id is 404 account_not_found.
          schema:
            type: string
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleLibraryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '503':
          $ref: '#/components/responses/AppleLibraryUnavailable'
  /api/v1/apple-library/playlists/{playlist_id}/tracks:
    get:
      tags: [Apple library]
      summary: List a cached Apple library playlist's tracks
      description: >-
        The tracks of one library playlist in playlist order, from the local
        copy. It is how a playlist without a catalog link (an unshared own
        playlist, Favorite Songs) is shown and its songs downloaded one by one.
        read_at is absent while the list has not been read yet.
      operationId: listAppleLibraryPlaylistTracks
      parameters:
        - name: playlist_id
          in: path
          required: true
          description: The library playlist id (p.…), the id of an AppleLibraryItem.
          schema:
            type: string
            maxLength: 64
        - name: account
          in: query
          description: >-
            The account (Account.id) whose cache to read; absent reads the
            default account's. An unknown id is 404 account_not_found.
          schema:
            type: string
      responses:
        '200':
          description: The tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleLibraryTracks'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: >-
            catalog_not_found, no library playlist of the account's cache has
            this id; account_not_found, no account has the id given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List the Apple Music accounts
      description: >-
        Every account the wrapper holds or held, the default first, with its
        library switches and state. It makes no wrapper request: amdl reads
        the wrapper's accounts at start, every 10 minutes and after a login,
        logout or delete. Add an account with POST /wrapper/login; a new one
        starts with both switches off.
      operationId: listAccounts
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Account.id.
        schema:
          type: string
    patch:
      tags: [Accounts]
      summary: Change an account's switches or position
      description: >-
        Turns the account's library monitor and Apple library cache on or off,
        and moves it in the list; position 0 makes it the default. It takes
        effect at the next tick of each loop.
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: The account as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '500':
          $ref: '#/components/responses/StoreError'
    delete:
      tags: [Accounts]
      summary: Delete an account
      description: >-
        Logs the account out of the wrapper (by its id, as POST /wrapper/logout
        does) and drops what amdl keeps for it alone: its row and switches,
        its library monitor anchor, its Apple library cache and its stored
        token. Downloaded files, records and runs stay. A missing account is
        not logged out, and one the wrapper no longer knows is deleted all the
        same. Records pinned to its storefront read in it while another
        account serves it, else they fail with decryptor_unavailable. The
        active account of a wrapper without the login API (id wrapper, a bare
        wrapper-lite) cannot be logged out from here: 501 login_unsupported.
      operationId: deleteAccount
      responses:
        '200':
          description: The account is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleted'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/accounts/{account_id}/media-user-token:
    parameters:
      - name: account_id
        in: path
        required: true
        description: Account.id. wrapper (the one account of a wrapper that does not list accounts) is always accepted, so a token can be given before the wrapper has any.
        schema:
          type: string
    get:
      tags: [Accounts]
      summary: Say where an account's media-user-token comes from
      description: >-
        The account's media_user_token as GET /accounts gives it, without the
        token. It also answers for wrapper before the wrapper lists any account,
        which GET /accounts does not.
      operationId: getAccountToken
      responses:
        '200':
          description: Where the token comes from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountToken'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
    put:
      tags: [Accounts]
      summary: Give an account's media-user-token
      description: >-
        Stores a media-user-token for the account, for a wrapper that has none
        or to replace the one it gives. mode fallback (the default) uses it only
        while the wrapper has no token for the account; override uses it ahead
        of the wrapper's. amdl keeps it next to its copies of the wrapper's
        tokens (mode 0600), never in config.yaml, never refreshes it and never
        returns it. When Apple refuses it, the account's
        media_user_token.manual.rejected turns true and amdl keeps using it
        until it is replaced or deleted.
      operationId: setAccountToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenSet'
      responses:
        '200':
          description: The account as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '500':
          $ref: '#/components/responses/StoreError'
    delete:
      tags: [Accounts]
      summary: Delete an account's given media-user-token
      description: The account goes back to the wrapper's token alone. Deleting none is not an error.
      operationId: clearAccountToken
      responses:
        '200':
          description: The account as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/wrapper/status:
    get:
      tags: [Wrapper]
      summary: Get wrapper status
      description: >-
        Probes the wrapper (wrapper-lite, or the wrapper-manager in front of it)
        for connectivity and runtime state such as login and regions; use it
        before downloading or managing accounts. login_supported tells whether
        the login routes work against this wrapper. The accounts themselves are
        GET /accounts. token_set says whether amdl sends wrapper.token; a
        gateway that refuses it is 503 wrapper_unauthorized.
      operationId: getWrapperStatus
      responses:
        '200':
          description: Wrapper status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrapperStatus'
        '503':
          description: >-
            wrapper_unavailable, the wrapper did not answer; or
            wrapper_unauthorized, its gateway or proxy answered 401 to
            wrapper.token (or wants one that is not set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wrapper/login:
    post:
      tags: [Wrapper]
      summary: Log in to a wrapper account
      description: >-
        Login may succeed immediately, or return a login_id that requires a
        two-step verification code. The username is trimmed; the password is
        forwarded exactly as sent, because spaces can be part of it (a password
        that is only whitespace is 400 invalid_request). The password of a login
        that waits for its code is kept in memory for at most 75 seconds while
        no code has arrived and, once a code is submitted, until its
        verification ends: at most 75 seconds plus wrapper.login_timeout_seconds
        (195 seconds by default) after the needs_2fa response. It is never
        written to disk by a wrapper-manager. A wrapper amdl runs on this
        machine (WrapperStatus.managed) logs in through its guest manager's
        loopback HTTP API, within two minutes; the manager's own 90-second wait
        ends first, as 504 upstream_timeout. A caller that disconnects before
        this call answers cancels the login: amdl's wrapper-manager kills the
        login process and frees the account, so a retry starts at once. A new
        login of an account replaces one that waits for its code. A username with a colon, or either
        value with a line break or NUL, is 400 invalid_request, and a managed
        wrapper turned off with amdl wrapper stop is 503 wrapper_unavailable.
        Needs a wrapper-manager or a managed wrapper; a bare wrapper-lite
        answers 501 login_unsupported.
      operationId: loginWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '202':
          description: A two-step verification code must be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedsTwoStepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: wrapper_unavailable; the managed wrapper is stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/login/{login_id}/2fa:
    post:
      tags: [Wrapper]
      summary: Submit a two-step verification code
      description: >-
        Finishes the login that returned the login_id. The wrapper gives up on a
        login 60 seconds after it asks for the code (four minutes for a
        managed wrapper), so submit it promptly. The
        login ends with this call even when the code is wrong; start again from
        POST /wrapper/login. A managed wrapper answers a code that is not six
        digits with 400 invalid_request and keeps the login waiting for the
        right one.
      operationId: submitWrapperTwoStepCode
      parameters:
        - $ref: '#/components/parameters/LoginID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/logout:
    post:
      tags: [Wrapper]
      summary: Log out of a wrapper account
      description: >-
        Ends the account's login in the wrapper-manager and deletes its data
        there; the body names it by Apple ID (username) or by account id
        (account_id, Account.id). amdl keeps the account's row, switches and
        library state, so they apply again when it logs in again; DELETE
        /accounts/{account_id} removes those too. A bare wrapper-lite answers
        501 login_unsupported.
      operationId: logoutWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/quality:
    post:
      tags: [Quality]
      summary: Query the available audio qualities of the songs in a link
      description: |
        Resolves an Apple Music song, album, playlist, artist or station URL that the
        backend supports and returns, for each song, a summary of the codecs,
        bitrates, sample rates and bit depths its master playlist currently declares;
        no download job is created.
        Every link type returns a tracks array: a song has one element, and
        collections keep Apple Music's original order and repeated track occurrences.
        The i parameter on an album URL still follows the runtime
        catalog.album_track_url_mode; station resolution uses the account's
        media-user-token, which amdl reads from the wrapper. Internally this reuses the download jobs' region
        check, collection resolution, track metadata refresh, retries, concurrency
        scheduling, HLS source selection and codec/ALAC filtering rules. On the
        normal success path, each track occurrence reads its master playlist once
        and all qualities are summarized from it; on failure the source is fetched
        again and the master re-read, up to download.max_attempts. The query does
        not read individual media playlists, does not verify media segments, and
        never enters the encrypted media transfer. The region check requires the
        wrapper/decryptor to be ready and the URL's storefront to be among the
        regions it reports. music-video is not supported. A song for which the
        catalog lists no Enhanced HLS master reports every quality with
        available=false. Apple answering 404 for the link's id, or for a track's,
        is 404 catalog_not_found; any other failure after the url field is
        present, including a URL the backend cannot parse, is 502 upstream_error.
      operationId: queryQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityRequest'
      responses:
        '200':
          description: Summary of the available qualities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: catalog_not_found; Apple answered 404 for the link's id or a track's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '502':
          description: upstream_error; the lookup failed (catalog, wrapper or URL validation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/lookup:
    post:
      tags: [Downloads]
      summary: Preview an Apple Music link without creating a job
      description: |
        Parses one link the way POST /api/v1/downloads does (the i parameter of an
        album URL follows the runtime catalog.album_track_url_mode) and reads the
        catalog metadata a job row shows once it resolves: title, artist or
        curator, artwork with its palette, release date, genre and track count. No
        job is created and nothing is downloaded.

        Each link type costs one light catalog read on the backend's catalog host:
        a song reads the song resource, an album the album with its track list, a
        playlist the playlist with its track list, a station its metadata (never
        the next-tracks feed), an artist the artist alone (so track_count is
        absent). The animated-cover and Enhanced HLS reads are never made. The
        whole lookup is bounded by 15 seconds.

        A song, album or playlist is read in the account storefront, as its
        download is, so track_count is what the download gets and a link the
        account storefront lacks is 404 catalog_not_found; storefront stays the
        link's. A station is read in its own storefront.

        An album, playlist or song amdl keeps a record of carries resource (a
        ResourceMark).

        Only a private (pl.u-) playlist's cover uses a media-user-token: the
        account's, which amdl reads from the wrapper; the request cannot supply
        one. It is never echoed.

        Once the link has parsed, every error carries it in details.link
        (LookupLink), so a client can still show what was pasted.
      operationId: lookupLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
            examples:
              album:
                value: {url: 'https://music.apple.com/us/album/igor/1463409338'}
      responses:
        '200':
          description: The parsed link and its catalog metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                album:
                  value:
                    input: https://music.apple.com/us/album/igor/1463409338
                    type: album
                    storefront: us
                    id: '1463409338'
                    title: IGOR
                    artist_name: Tyler, The Creator
                    artist_url: https://music.apple.com/us/artist/tyler-the-creator/420368335
                    artwork_url: https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/0c/06/05/0c060581-6242-6a2a-a677-20170f2cf8da/886447710180.jpg/{w}x{h}bb.jpg
                    artwork_bg_color: f1a8bf
                    artwork_text_color1: '171615'
                    artwork_text_color2: '272021'
                    artwork_text_color3: '423337'
                    artwork_text_color4: 4f3b41
                    release_date: '2019-05-17'
                    genre: Hip-Hop/Rap
                    track_count: 12
                    content_rating: explicit
                    apple_digital_master: true
                album_track:
                  value:
                    input: https://music.apple.com/us/album/midnights/1650841512?i=1650841515
                    type: song
                    storefront: us
                    id: '1650841515'
                    track_id: '1650841515'
                    title: Anti-Hero
                    artist_name: Taylor Swift
                    artist_url: https://music.apple.com/us/artist/taylor-swift/159260351
                    album_name: Midnights (3am Edition)
                    artwork_url: https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/59/13/5c/59135ccc-8425-415c-7f89-8aeada60088e/22UM1IM22440.rgb.jpg/{w}x{h}bb.jpg
                    artwork_bg_color: eae7e3
                    artwork_text_color1: 0d0c13
                    artwork_text_color2: '291216'
                    artwork_text_color3: 39383d
                    artwork_text_color4: 4f3c3f
                    release_date: '2022-10-21'
                    genre: Pop
                    track_count: 1
                    duration_ms: 200690
                    apple_digital_master: true
        '400':
          description: >-
            invalid_json: the body is not well-formed JSON; invalid_request: url is
            missing, the body has an unknown field, the link is not a supported
            Apple Music link, or it is one the backend does not download (a music
            video, a live radio station). The last two carry details.link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            catalog_not_found; Apple answered 404 for the link's id: it has no
            such resource in that storefront. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: >-
            upstream_error; the catalog read failed. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 15 seconds. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search the catalog for songs, albums, playlists and artists
      description: |
        One page of Apple Music catalog hits per requested group, each group in
        Apple's relevance order. Nothing is downloaded and no job is created.
        limit and offset apply to each group; a group with more hits carries
        next_offset. Apple reports no totals.

        A hit's url downloads exactly that item when submitted to POST
        /api/v1/library/add. resource marks a hit amdl keeps a record of, read
        from the records and never from the disk; a failed store read leaves
        hits unmarked instead of failing the search. The catalog read is
        bounded by 10 seconds.
      operationId: searchCatalog
      parameters:
        - name: term
          in: query
          required: true
          description: >-
            What to search for. Leading and trailing white space is trimmed and
            inner runs of it count as one space; at most 200 characters after that.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: types
          in: query
          description: >-
            The groups to search; repeat the parameter or separate values with
            commas. Default all four. Groups are returned in the order songs,
            albums, playlists, artists whatever the order given.
          schema:
            type: array
            items:
              type: string
              enum: [songs, albums, playlists, artists]
          style: form
          explode: true
        - $ref: '#/components/parameters/BrowseStorefront'
        - name: limit
          in: query
          description: Hits per group; default 10, maximum 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: The hits, one group per requested type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: >-
            invalid_request; term is missing, blank or too long, or types,
            storefront, limit or offset is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed (Apple refuses an unknown storefront).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 10 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/artists/{artist_id}/albums:
    get:
      tags: [Search]
      summary: List an artist's albums, one page at a time
      description: |
        The artist and one page of its albums, in the order of Apple's albums
        relationship: the albums an artist download (POST /api/v1/downloads with
        the artist's url) takes. Every page carries the artist. The artist and
        the page are read at once, bounded by 10 seconds together with the
        folder listing behind each album's library (as on GET /api/v1/search).
      operationId: listArtistAlbums
      parameters:
        - name: artist_id
          in: path
          required: true
          description: The artist's Apple Music catalog id, the id of an artist search hit.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
        - $ref: '#/components/parameters/BrowseStorefront'
        - name: limit
          in: query
          description: Albums per page; default 25, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: The artist and a page of its albums.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistAlbumsResponse'
        '400':
          description: invalid_request; the artist id is not digits, or storefront, limit or offset is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the artist id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 10 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{album_id}:
    get:
      tags: [Search]
      summary: Get an album and its songs
      description: |
        The album's metadata and its song list in disc and track order: the songs
        an album download (POST /api/v1/downloads with the album's url) takes,
        music videos excluded. The metadata fields have the names and meaning of
        the LookupResponse fields of the same name. The whole list comes in one
        answer, bounded by 15 seconds like POST /api/v1/lookup, which reads the
        same album. A song's url submitted to POST /api/v1/downloads downloads
        that song alone.

        resource is the album's record and each song's state its main slot
        state there, read from the records and never from the disk. Adding the
        album downloads the songs its record does not have done; a reset
        (POST /api/v1/library/albums/{id}/reset) downloads them again.
      operationId: getAlbum
      parameters:
        - name: album_id
          in: path
          required: true
          description: The album's Apple Music catalog id, the id of an album search hit.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
        - $ref: '#/components/parameters/BrowseStorefront'
      responses:
        '200':
          description: The album and its songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumResponse'
              examples:
                album:
                  value:
                    storefront: cn
                    id: '1783644603'
                    url: 'https://music.apple.com/cn/album/1783644603'
                    title: 迷跡波

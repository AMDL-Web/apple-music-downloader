name: Docker Publish

# Build the multi-arch image (linux/amd64 + linux/arm64) and push it to GHCR:
#   ghcr.io/amdl-web/apple-music-downloader-backend
#
# Triggers (one of three):
#   - workflow_call: called by release.yml after a successful release; the main
#     path. release.yml creates the tag and release with GITHUB_TOKEN, and
#     GitHub does not let such events trigger other workflows, so the release
#     trigger below never sees automatic releases; release.yml must call this.
#   - release published: a release created and published by hand on GitHub.
#   - workflow_dispatch: build or rebuild the image for an existing tag by hand.
#
# The first push creates a private package on GHCR; to allow public pulls, make
# the package public in its GitHub Packages settings.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true
        type: string
      # Rebuilding an older version by hand must not move latest, so this is
      # off by default; tick it only when the rebuilt version is the newest.
      latest:
        description: 'Also point latest at this version'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to build'
        required: true
        type: string
      latest:
        description: 'Also point latest at this version'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: echo "tag=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 1

      # The Dockerfile's build stage cross-compiles Go on the build platform,
      # but the runtime stage (alpine + apk) runs on the target platform, so
      # arm64 needs QEMU emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Expand the version tag into image tags: v1.2.3 -> 1.2.3, 1.2 and, when
      # applicable, latest. latest moves only for a release.yml call
      # (workflow_call defaults latest=true), a non-prerelease release
      # published by hand, or a manual dispatch with latest ticked, so
      # rebuilding an old version never pulls latest back.
      # metadata-action lowercases the repository name and writes OCI labels
      # (org.opencontainers.image.source and others) that link the GHCR
      # package to this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.latest == true || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # A release triggered by a merged PR may only have read access to the
          # cache. The cache is an optimization; a failed export must not fail
          # an image that was built and pushed.
          cache-to: type=gha,mode=max,ignore-error=true

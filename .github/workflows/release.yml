name: Release

# Two ways in:
#   - pull_request closed: merging a dev -> main PR releases automatically. The
#     version is the first vX.Y.Z in the PR title (e.g. "Release v1.2.0: ...").
#     A title without one fails the run with a hint to release by hand; it is
#     never skipped silently.
#   - workflow_dispatch: release a given version by hand, the fallback when the
#     PR title had no version.
# Both paths run the CI gate (make check), use the hand-written release notes
# or generate a changelog, create the tag and GitHub Release, then attach the
# amdl binaries (make dist) and call docker-publish to build and push the image
# (moving latest too).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string
      base_tag:
        description: 'Base tag for the changelog (optional; defaults to the latest release)'
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    # A manual run always proceeds. A PR event proceeds only when a PR from dev
    # was actually merged: closing without merging, or merging another branch
    # into main, releases nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # vX.Y.Z with an optional suffix such as -rc.1; both paths accept
          # exactly this shape.
          PATTERN='v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if ! printf '%s' "$VERSION" | grep -qxE "$PATTERN"; then
              echo "::error::Version input \"$VERSION\" is not vX.Y.Z (an optional suffix like -rc.1 is allowed)."
              exit 1
            fi
          else
            VERSION=$(printf '%s' "$PR_TITLE" | grep -oE "$PATTERN" | head -n1 || true)
            if [ -z "$VERSION" ]; then
              echo "::error::No vX.Y.Z version found in the PR title \"$PR_TITLE\". Run the Release workflow by hand with the version."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On a PR merge, check out the merge commit on main; on a manual run,
          # the selected ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Fail if tag already exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists; release cancelled. To republish the image, run the Docker Publish workflow by hand."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run the CI gate
        run: make check

      - name: Get base tag
        id: get-base-tag
        env:
          INPUT_BASE_TAG: ${{ github.event.inputs.base_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_BASE_TAG" ]; then
            BASE_TAG="$INPUT_BASE_TAG"
          else
            # Prefer the latest published release from the GitHub API; with
            # none, there is no base and every commit counts.
            BASE_TAG=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null)
            if [ "$BASE_TAG" = "null" ]; then
              BASE_TAG=""
            fi
          fi

          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Base tag: ${BASE_TAG:-none}"

          if [ -n "$BASE_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count "$BASE_TAG..HEAD")
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
          fi

          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "New commits: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits; nothing to release."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release notes
        id: changelog
        if: steps.get-base-tag.outputs.skip_release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_TAG: ${{ steps.get-base-tag.outputs.base_tag }}
        run: |
          RELEASE_NOTES_FILE=".github/release-notes/${VERSION}.md"

          if [ -s "$RELEASE_NOTES_FILE" ]; then
            echo "Using the repository release notes: $RELEASE_NOTES_FILE"
            CHANGELOG_CONTENT=$(cat "$RELEASE_NOTES_FILE")
          else
            echo "No non-empty $RELEASE_NOTES_FILE; generating a changelog"

            ARGS=(--tag "$VERSION" --with-hash)
            if [ -n "$BASE_TAG" ]; then
              ARGS+=(--base "$BASE_TAG")
            fi

            CHANGELOG_CONTENT=$(node .github/scripts/generate-changelog.js "${ARGS[@]}" --output-only)
          fi

          # A random delimiter keeps notes that happen to contain "EOF" from
          # truncating the output.
          DELIMITER="release_notes_${RANDOM}_${RANDOM}_$$"
          while grep -Fxq "$DELIMITER" <<< "$CHANGELOG_CONTENT"; do
            DELIMITER="release_notes_${RANDOM}_${RANDOM}_$$"
          done
          {
            echo "changelog_content<<$DELIMITER"
            printf '%s\n' "$CHANGELOG_CONTENT"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          # Echo the notes for the run log.
          printf '%s\n' "$CHANGELOG_CONTENT"

      - name: Cancel release if no commits
        if: steps.get-base-tag.outputs.skip_release == 'true'
        run: |
          echo "No new commits; release cancelled."
          exit 1

      - name: Create Release
        if: steps.get-base-tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog_content }}
          draft: false
          prerelease: false
          # On a PR merge, tag the merge commit. The default is GITHUB_SHA,
          # which for a closed event is not the merge commit.
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Attach the amdl binaries (make dist) to the release just created.
  binaries:
    name: Attach amdl binaries
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every platform
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Five archives and the checksum file, or the job fails.
          test "$(ls dist | wc -l)" -eq 6
          gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Build and push the image to GHCR after a successful release. It has to be
  # called explicitly: a tag created with GITHUB_TOKEN does not trigger
  # docker-publish's release or push triggers. When there were no new commits
  # the release job fails and this job is skipped.
  docker:
    name: Publish Docker image
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release.outputs.version }}
      latest: true

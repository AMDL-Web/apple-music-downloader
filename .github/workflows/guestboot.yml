# Boots the wrapper guest this source pins (internal/wrapperhost#Builtin) in
# QEMU and waits for its manager, as the desktop app does. ci.yml runs the same
# boot when a change touches the code behind it; this weekly run catches the
# rest: a pinned artifact that expired, nightly.link or GitHub changing under
# the pin, a runner image change. wrapper-pin.yml boots each candidate pin
# before committing it, so the published pin is covered there.
name: Guest boot

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Boot the pinned guest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Boot the guest
        uses: ./.github/actions/guestboot

name: Claude Auto Review

# Kill switch: the repository variable CLAUDE_AUTO_REVIEW.
# - unset or any other value: on (the default)
# - "false": off
# Change it under Settings -> Secrets and variables -> Actions -> Variables,
# or with: gh variable set CLAUDE_AUTO_REVIEW --body false
#
# PRs opened by bots are skipped: Renovate's dependency bumps are version
# numbers an AI review can't add much to, so reviewing them only burns quota.
# Their safety net is ci.yml (build, test, race, govulncheck) and CodeQL, which
# still run. PRs opened by people are unaffected.
#
# What to report, what to skip and the output language are set in REVIEW.md.

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  auto-review:
    if: >-
      vars.CLAUDE_AUTO_REVIEW != 'false'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress creates one tracking comment that shows review
          # progress and the final verdict, and reuses it on reruns (replacing
          # the old use_sticky_comment).
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following REVIEW.md at the repository
            root: it defines what counts as a defect, what not to report, how to
            report, and the language to write in. The project rules it refers
            to are in AGENTS.md and the nested AGENTS.md files.

            The verdict appears in the tracking comment that track_progress
            creates; don't post a separate top-level comment with
            `gh pr comment` (it would duplicate it). For comments on specific
            lines, use `mcp__github_inline_comment__create_inline_comment`
            with `confirmed: true`.

          # Allowed: the inline-comment tool and read-only diff/view for context.
          # Not allowed: gh pr comment, because the tracking comment carries the
          # verdict and an extra comment would duplicate it.
          # go commands are allowed so the reviewer can build and run tests.
          # Task/TodoWrite let the review agent fan out subtasks and track them
          # (without Task, reviews of large PRs stalled on refused dispatches);
          # git log/show/diff are read-only views of history and changes.
          claude_args: |
            --allowedTools "Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(go run:*),Bash(go mod:*),Bash(go fmt:*),Bash(gofmt:*)"

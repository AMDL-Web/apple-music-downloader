name: Codex Auto Review Trigger

# Kill switch: the repository variable CODEX_AUTO_REVIEW.
# - unset or any other value: on (the default)
# - "false": off
# Change it under Settings -> Secrets and variables -> Actions -> Variables,
# or with: gh variable set CODEX_AUTO_REVIEW --body false
#
# How it works: Codex's GitHub review integration only reacts to comments from
# the An0nCh1hayaa account. A comment posted with the default GITHUB_TOKEN shows
# up as github-actions[bot] and Codex ignores it, so this posts with that
# account's personal access token (secret CODEX_REVIEW_PAT), which needs
# "Pull requests: Read and write" on this repository.
#
# Runs once when a PR is opened; later pushes (synchronize) don't comment again.
#
# What to report, what to skip and the output language are set in REVIEW.md.

on:
  pull_request:
    types: [opened]

# The job checks out no code and doesn't use the default GITHUB_TOKEN (the PAT
# replaces it), so it gets no permissions at all.
permissions: {}

jobs:
  trigger-codex-review:
    # PRs opened by bots are skipped: Renovate's version bumps give an AI review
    # nothing to work with. ci.yml and CodeQL still run on them.
    if: >-
      vars.CODEX_AUTO_REVIEW != 'false'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment "@codex review" as An0nCh1hayaa
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REVIEW_BODY: |
            @codex review

            Follow REVIEW.md at the repository root: it defines what counts as
            a defect, what not to report, how to report, and the language to
            write in.
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$REVIEW_BODY"

name: Pages

# Build the website from main, with the desktop app's browser demo, and
# publish it on GitHub Pages at its custom domain. main changes only through
# the release PR, so this first runs on release day;
# apps/site/README.md#release-day has the steps around it.

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/desktop/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The page's install commands and repository links follow build.mjs#REF,
      # so a page built from main must point at main.
      - name: Check the site describes main
        run: node --input-type=module -e "import { REF } from './apps/site/build.mjs'; if (REF !== 'main') { console.error('apps/site/build.mjs#REF is ' + REF + ', not main'); process.exit(1); }"

      - name: Build the desktop demo
        run: make desktop-web

      - name: Build
        run: node apps/site/build.mjs --base https://amdl.lyjw.me/ --out _site --desktop apps/desktop/build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

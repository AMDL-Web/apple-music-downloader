name: CI

# Build, test and scan every push to main and dev (agents push to dev directly)
# and every pull request. Setup steps install the toolchain README.md lists
# (Go, Node.js, ffmpeg); each check step then calls one Makefile target, so
# `make check` locally runs what this workflow runs (here `make cover` stands for
# `make test`, and the race detector runs as two shards, `make race-ui` and
# `make race-rest`, which together are `make race`).

on:
  push:
    branches: [main, dev]
  pull_request:

# Pushes get one group per commit so every commit on main and dev keeps its own
# verdict; pull requests share a group per ref and cancel superseded runs.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The media tests that remux, decode or integrity-check real audio skip
      # when ffmpeg is not on PATH; the runner image does not ship it.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      # apps/amdl/web compiles only with the js files apps/amdl/web/build adds
      # to bubbletea and atotto/clipboard; red after a bump of either means a
      # shim no longer fits the new release.
      - name: Terminal interface browser build
        run: make tui-web

      # The same packages as `make test`, plus a statement-coverage summary on the
      # run page. It is display only: no threshold, and it never fails a run.
      - name: Test
        run: make cover

      - name: Vulnerability scan
        run: make vuln

      - name: Script tests
        run: make node-test

  # The race detector is the slowest check, so it runs apart from the unit job,
  # split into two shards that run in parallel. The desktop ui package alone
  # takes about as long as every other package together. The shards are cut from
  # one `go list ./...` in the Makefile, so every package is in exactly one of
  # them and a package added later cannot fall through.
  race:
    name: Race detector (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep the other shard running so one run shows every failing shard.
      fail-fast: false
      matrix:
        include:
          - name: desktop ui
            target: race-ui
          - name: rest
            target: race-rest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The media tests skip without ffmpeg, as in the unit job.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg

      - name: Race detector
        run: make ${{ matrix.target }}

  # Branch protection on main requires a check named "Build and test". This job
  # carries that name and fails unless the unit job and every race shard
  # succeeded, so the required check covers every `make check` step, the race
  # detector included, without a settings change. `if: always()` makes it run
  # when a needed job failed or was cancelled: a job skipped because a
  # dependency failed reports as passing to branch protection.
  build-and-test:
    name: Build and test
    needs: [unit, race]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # make temaridiff checks internal/fairplay byte for byte against the upstream
  # Temari library it was translated from, and checks that rounds_gen.go is the
  # translation of the Temari version pinned in tools/temaridiff/go.mod. It
  # downloads Temari and loads its prebuilt cdylib, which `make check` must not
  # depend on, so it is a job of its own. Renovate opens a separate PR for each
  # Temari release; red there means upstream changed the algorithm and
  # internal/fairplay needs re-translating (tools/temaridiff/doc.go).
  temaridiff:
    name: Temari parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/temaridiff/go.sum

      - name: Compare with upstream Temari
        run: make temaridiff

  # The release's binaries job runs only after the tag and the Release exist,
  # so a broken cross-build or render would publish a release without assets.
  # This builds and renders them for a made-up version on every push.
  dist:
    name: Release files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build and render the release files
        run: make dist-check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The same build args as docker-publish.yml, so the ldflags path is
      # exercised before a release depends on it.
      - name: Build info
        id: build
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Single-arch and never pushed: this only proves deploy/server/Dockerfile
      # and .dockerignore still produce an image before a release tag depends on it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=dev
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          # Fork pull requests may only read the cache; a failed export must
          # not fail a build that succeeded.
          cache-to: type=gha,mode=max,ignore-error=true

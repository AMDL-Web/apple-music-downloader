name: CI

# Build, test and scan every push to main and dev (work lands on dev directly)
# and every pull request. Setup steps install the toolchain README.md lists
# (Go, Node.js, ffmpeg); each check step then calls one Makefile target, so
# `make check` locally runs what this workflow runs. Here `make cover-ui` and
# `make cover-rest` stand for `make test`, run as parallel jobs (the ui one in
# slices), and the race detector runs as `make race-ui` (in slices),
# `make race-app` and `make race-rest`, which together are `make race`.
#
# A change to only documentation, the website or the console skips the
# Go jobs and runs the light one (changes job); Build and test still requires
# whichever of the two the paths call for.

on:
  push:
    branches: [main, dev]
  pull_request:

# Pushes get one group per commit so every commit on main and dev keeps its own
# verdict; pull requests share a group per ref and cancel superseded runs.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Names the jobs a change needs, from the paths it touched
  # (.github/scripts/changed-paths.mjs). The comparison covers the whole push
  # or pull request; when GitHub cannot make it, every optional job runs.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.paths.outputs.go }}
      guestboot: ${{ steps.paths.outputs.guestboot }}
      console: ${{ steps.paths.outputs.console }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Classify the changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -u
          # Both listings page through every file but stop at 3000; a list that
          # long may be cut short, so it counts as unknown like a failed read.
          limit=3000
          files=
          if [ -n "$PR" ]; then
            files=$(timeout 120 gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' 2>/dev/null) || files=
          elif [ -n "$BASE" ] && [ "${BASE#0000000}" = "$BASE" ]; then
            files=$(timeout 120 gh api --paginate "repos/$REPO/compare/$BASE...$HEAD?per_page=100" --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null) || files=
          fi
          if [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -ge "$limit" ]; then files=; fi
          [ -n "$files" ] || echo "the changed paths are unknown; every optional job runs"
          printf '%s\n' "$files" | node .github/scripts/changed-paths.mjs

  # Formatting, the build, vet, the browser build of the terminal interface,
  # the vulnerability scan and the script tests: everything in `make check` but
  # the tests, which run in the test and race jobs.
  unit:
    name: Build and checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: ./.github/actions/go

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      # apps/amdl/web compiles only with the js files apps/amdl/web/build adds
      # to bubbletea and atotto/clipboard; red after a bump of either means a
      # shim no longer fits the new release.
      - name: Terminal interface browser build
        run: make tui-web

      - name: Vulnerability scan
        run: make vuln

      - name: Script tests
        run: make node-test

  # The same packages as `make test`, plus a statement-coverage summary on each
  # run page (display only: no threshold, and it never fails a run), in parallel
  # jobs. The desktop ui package alone takes about as long as every other
  # package together, so its tests are cut into three slices by name
  # (.github/scripts/shard.mjs): every test is in exactly one. The rest is every
  # other package, cut from one `go list ./...` in the Makefile.
  test:
    name: Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep the other jobs running so one run shows every failure.
      fail-fast: false
      matrix:
        include:
          - { name: rest, target: cover-rest, shard: '' }
          - { name: desktop ui 1/3, target: cover-ui, shard: 1/3 }
          - { name: desktop ui 2/3, target: cover-ui, shard: 2/3 }
          - { name: desktop ui 3/3, target: cover-ui, shard: 3/3 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg
        with:
          phase: start

      - name: Set up Go
        uses: ./.github/actions/go
        with:
          scope: test-${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The media tests that remux, decode or integrity-check real audio skip
      # when ffmpeg is not on PATH; the runner image does not ship it.
      - name: Wait for ffmpeg
        uses: ./.github/actions/ffmpeg
        with:
          phase: wait

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: make ${{ matrix.target }}

  # The race detector is the slowest check, so it runs apart from the build job,
  # in parallel shards: the desktop ui package in two slices of its tests, the
  # app package (TestRenderSetupShots alone takes minutes under the detector)
  # and every other package. The Makefile cuts them from one `go list ./...`,
  # so every package is in exactly one, and a package added later cannot fall
  # through.
  race:
    name: Race detector (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep the other shards running so one run shows every failing shard.
      fail-fast: false
      matrix:
        include:
          - { name: desktop ui 1/2, target: race-ui, shard: 1/2 }
          - { name: desktop ui 2/2, target: race-ui, shard: 2/2 }
          - { name: desktop app, target: race-app, shard: '' }
          - { name: rest, target: race-rest, shard: '' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg
        with:
          phase: start

      - name: Set up Go
        uses: ./.github/actions/go
        with:
          name: race
          scope: race-${{ matrix.target }}

      # The media tests skip without ffmpeg, as in the test jobs.
      - name: Wait for ffmpeg
        uses: ./.github/actions/ffmpeg
        with:
          phase: wait

      - name: Race detector
        env:
          SHARD: ${{ matrix.shard }}
        run: make ${{ matrix.target }}

  # For a change to only documentation, the website or the console: the
  # checks that can see it. The repository checks (links and paths), the console's Go tests, the Go tests that read a console or docs
  # file (tools/repocheck TestLightPathsReadByGoTestsAreCovered keeps that list
  # complete), the Node tests of the scripts, console and website, and a
  # build that compiles what the console embeds.
  light:
    name: Light checks
    needs: changes
    if: needs.changes.outputs.go != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: ./.github/actions/go

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build
        run: make build

      - name: Repository and console tests
        run: go test -count=1 ./tools/repocheck/ ./apps/console/... ./internal/progress/ ./internal/api/

      - name: Script tests
        run: make node-test

  # Boots the pinned manager guest in QEMU the way the desktop app does and
  # waits for its manager (internal/wrapperhost, TestGuestBoot). It runs when a
  # change touches the code behind it (changes job); guestboot.yml runs it
  # weekly for the days nothing changes but the artifacts expire or upstream
  # moves.
  guestboot:
    name: Guest boot
    needs: changes
    if: needs.changes.outputs.guestboot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Boot the guest
        uses: ./.github/actions/guestboot

  # Branch protection on main requires a check named "Build and test". This job
  # carries that name and fails unless every needed job succeeded, so the
  # required check covers every `make check` step, the race detector included,
  # without a settings change. `if: always()` makes it run when a needed job
  # failed or was cancelled: a job skipped because a dependency failed reports
  # as passing to branch protection.
  #
  # Skips are accepted only where the paths explain them. GATED jobs are
  # skipped when the changes job says no Go job is needed (go is false) and
  # must succeed when it is true; light is the reverse; OPTIONAL jobs may always
  # be skipped. ADVISORY jobs may also fail: a gate that is new, and red on a
  # defect the code under test still has, stays visible without blocking merges
  # until the defect is fixed.
  build-and-test:
    name: Build and test
    needs: [changes, unit, test, race, light, temaridiff, dist, upgrade, docker, guestboot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          GO: ${{ needs.changes.outputs.go }}
          GATED: unit test race temaridiff dist upgrade docker
          LIGHT: light
          OPTIONAL: guestboot
          ADVISORY: ''
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "go: $GO"
          echo "$NEEDS" | jq -e --arg go "$GO" --arg gated "$GATED" --arg light "$LIGHT" --arg optional "$OPTIONAL" --arg advisory "$ADVISORY" '
            def has($list; $k): ($list | split(" ") | index($k)) != null;
            ($go == "true" or $go == "false") and
            (to_entries | all(.[]; .key as $k | .value.result as $r
              | $r == "success"
              or ($r == "skipped" and (
                   (has($gated; $k) and $go == "false")
                or (has($light; $k) and $go == "true")
                or has($optional; $k)))
              or has($advisory; $k)))' > /dev/null

  # make temaridiff checks internal/fairplay byte for byte against the upstream
  # Temari library it was translated from, and checks that rounds_gen.go is the
  # translation of the Temari version pinned in tools/temaridiff/go.mod. It
  # downloads Temari and loads its prebuilt cdylib, which `make check` must not
  # depend on, so it is a job of its own. Renovate opens a separate PR for each
  # Temari release; red there means upstream changed the algorithm and
  # internal/fairplay needs re-translating (tools/temaridiff/doc.go).
  temaridiff:
    name: Temari parity
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/temaridiff/go.sum

      - name: Compare with upstream Temari
        run: make temaridiff

  # The release's binaries job runs only after the tag and the Release exist,
  # so a broken cross-build or render would publish a release without assets.
  # This builds and renders them for a made-up version on every push.
  dist:
    name: Release files
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: ./.github/actions/go

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build and render the release files
        run: make dist-check

  # Starts the build on the files the newest release wrote, as an upgrade does:
  # a server install, the embedded backend, and a desktop install whose local
  # wrapper guest is the retired bare-lite one (tools/upgradecheck/run.sh).
  upgrade:
    name: Upgrade check
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: ./.github/actions/go

      - name: Start the build on the previous release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: make upgradecheck

  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The same build args as docker-publish.yml, so the ldflags path is
      # exercised before a release depends on it.
      - name: Build info
        id: build
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Single-arch and never pushed: this only proves deploy/server/Dockerfile
      # and .dockerignore still produce an image before a release tag depends on it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=dev
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          # Fork pull requests may only read the cache; a failed export must
          # not fail a build that succeeded.
          cache-to: type=gha,mode=max,ignore-error=true

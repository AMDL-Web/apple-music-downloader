# Containerized deployment of the AMDL Backend.
#
#   docker compose up -d
#
# By default this pulls the multi-arch prebuilt image from GHCR; no local build
# is needed. To build from source, see the note next to amdl-backend.image
# below.
#
# The first start generates config.yaml in ./configs (the backend bootstraps it
# from config.example.yaml; the commented field documentation is the example
# file in the same directory). To change the configuration afterwards:
#   - runtime fields: PUT /api/v1/config (the console's Settings page), which
#     takes effect immediately and rewrites config.yaml in full;
#   - or edit ./configs/config.yaml directly, then apply runtime fields with
#     POST /api/v1/config/reload (the console's "Reload from file") and startup
#     fields with docker compose restart.
# Only the listen address, the wrapper address and the database path can also
# be set through the environment (below); they win over config.yaml.
#
# Stopping or restarting is safe mid-download: running jobs stay running in
# the database and resume on the next start.
services:
  amdl-backend:
    # Pulls the prebuilt image from GHCR by default (multi-arch linux/amd64 +
    # linux/arm64). To pin a version, replace latest with a specific tag, for
    # example :1.1 or :1.1.0.
    image: ghcr.io/amdl-web/apple-music-downloader-backend:latest
    # To build locally from source instead of pulling the image, run compose
    # from deploy/ in a clone of the repository and uncomment the build block
    # below (the image line then becomes the tag of the locally built image),
    # then run docker compose up -d --build. Where proxy.golang.org or
    # dl-cdn.alpinelinux.org is unreachable, uncomment the mirror build args
    # too (docs/deployment.md lists both):
    # build:
    #   context: ..
    #   dockerfile: deploy/server/Dockerfile
    #   args:
    #     GOPROXY: "https://goproxy.cn,direct"
    #     ALPINE_MIRROR: "https://mirrors.tuna.tsinghua.edu.cn/alpine"
    container_name: amdl-backend
    restart: unless-stopped
    # Time between SIGTERM and SIGKILL. The backend's shutdown steps are each
    # bounded (HTTP drain 5s + handlers 5s + library sync 10s + jobs 45s +
    # downloader 15s + hooks 15s + 10s, about 105s worst case; see
    # internal/server/shutdown.go), and Docker's default of 10s would cut them
    # before the database is closed. Keep this above that sum.
    stop_grace_period: 2m
    ports:
      - "18080:18080"
    environment:
      # Runtime user: the container starts the entrypoint as root, which gives
      # the backend's own state (configs, database, data/tmp) to PUID:PGID and
      # then drops to that user to run the backend; default 1000:1000. Set them
      # to the uid/gid that owns the host directories. The downloads directory
      # is never re-owned: create it on the host before the first start and
      # make it writable by PUID:PGID. This mode keeps only the one group
      # PGID; when write access comes through a supplementary group (Synology's
      # administrators, gid 101), use user: plus group_add instead, see
      # docs/deployment.md.
      # PUID: "1000"
      # PGID: "1000"
      # Time zone for log timestamps and for the local time seen by commands in
      # exec hooks; default UTC. The image ships tzdata, so an IANA time zone
      # name is all that is needed.
      # TZ: "Asia/Shanghai"
      # The backend reads AMDL_SERVER_LISTEN, AMDL_WRAPPER_ADDRESS,
      # AMDL_DATABASE_PATH, AMDL_CONFIG and AMDL_HOOKS_CONFIG; every other
      # setting belongs in config.yaml, and any other AMDL_* variable is
      # ignored with a warning at startup.
      # Wrapper URL (overrides wrapper.address): a wrapper-manager v2 or a bare
      # wrapper-lite, both over HTTP. Only a wrapper-manager has the login API the
      # console's Account page uses; against a bare wrapper-lite you log in on its
      # own command line (--login).
      #   - wrapper-lite runs on the host: keep http://host.docker.internal:12340
      #     (also the entrypoint's container default, so leaving the variable
      #     unset has the same effect);
      #   - wrapper-manager is a compose service (recommended): change it to
      #     "http://wrapper-manager:8080" and uncomment the wrapper-manager
      #     service below;
      #   - wrapper-lite is a compose service: change it to
      #     "http://wrapper-lite:12340" and uncomment the wrapper-lite service
      #     below instead.
      AMDL_WRAPPER_ADDRESS: "http://host.docker.internal:12340"
      # API listen address (overrides server.listen). Inside the container it
      # must listen on a non-loopback address; the entrypoint defaults to
      # :18080. When changing the port, adjust the ports mapping above to match;
      # the health check also derives its port from it.
      # AMDL_SERVER_LISTEN: ":18080"
    extra_hosts:
      # Lets containers on Linux reach the host through host.docker.internal too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Config directory: config.yaml (managed by the backend, rewritten in full
      # on PUT), config.example.yaml (full field documentation), hooks.yaml.
      - ./configs:/app/configs
      # SQLite database directory (database.path defaults to data/db/amdl.db).
      - ./data/db:/app/data/db
      # Download output directory; to put it elsewhere on the host, change the
      # left side of the colon, for example /path/to/music:/app/data/downloads.
      - ./data/downloads:/app/data/downloads
      # The temp directory data/tmp stays inside the container and needs no
      # mount.

  # Wrapper, option A (recommended): wrapper-manager v2, which supervises
  # wrapper-lite accounts behind one HTTP port and lets you log in from the
  # console. Upstream publishes no image, so compose builds it from the v2
  # branch (Go and Docker are all it needs); first start also downloads the
  # wrapper-lite payload from nightly.link. wrapper-lite-rootless needs user
  # namespaces and chroot, which Docker blocks by default, hence privileged
  # (a seccomp profile that allows unshare works too). Linux amd64 or arm64.
  # Hosts without user namespaces: see docs/deployment.md, "The wrapper".
  # Uncomment, set AMDL_WRAPPER_ADDRESS above to "http://wrapper-manager:8080",
  # and add the wrapper-data volume at the bottom of this file. Then log in on
  # the console's Account page.
  # wrapper-manager:
  #   build: https://github.com/WorldObservationLog/wrapper-manager.git#v2
  #   image: wrapper-manager:latest
  #   container_name: wrapper-manager
  #   restart: unless-stopped
  #   privileged: true
  #   command: ["--host", "0.0.0.0", "--port", "8080"]
  #   volumes:
  #     - wrapper-data:/root/data

  # Wrapper, option B: a bare wrapper-lite. Upstream publishes no image for it
  # either; compose builds it from the lite branch, which downloads the Android
  # NDK and takes a while. It has no login API: put USERNAME and PASSWORD in a
  # .env file next to this one (never in this file) for the first start, which
  # logs in; if Apple asks for a 2FA code, write it to 2fa.txt in the mounted
  # data directory. Uncomment, and set AMDL_WRAPPER_ADDRESS above to
  # "http://wrapper-lite:12340".
  # wrapper-lite:
  #   build: https://github.com/WorldObservationLog/wrapper.git#lite
  #   container_name: wrapper-lite
  #   restart: unless-stopped
  #   security_opt:
  #     - seccomp:unconfined
  #   environment:
  #     USERNAME: ${USERNAME}
  #     PASSWORD: ${PASSWORD}
  #   volumes:
  #     - ./data/wrapper:/app/rootfs/data

# For option A:
# volumes:
#   wrapper-data:

# Containerized deployment of the AMDL Backend.
#
#   docker compose up -d
#
# By default this pulls the multi-arch prebuilt image from GHCR; no local build
# is needed. To build from source, see the note next to amdl-backend.image
# below.
#
# The first start generates config.yaml in ./configs (the backend bootstraps it
# from config.example.yaml; the commented field documentation is the example
# file in the same directory). To change the configuration afterwards:
#   - runtime fields: PUT /api/v1/config, which takes effect immediately and
#     rewrites config.yaml in full;
#   - any field: override it with an AMDL_<SECTION>_<KEY> environment variable
#     (upper-case section and key names; takes precedence over config.yaml and
#     is not written back to the file on load), then docker compose up -d;
#   - or edit ./configs/config.yaml directly, then docker compose restart
#     (startup fields need a restart, and for fields overridden by an
#     environment variable the environment variable wins).
services:
  amdl-backend:
    # Pulls the prebuilt image from GHCR by default (multi-arch linux/amd64 +
    # linux/arm64). To pin a version, replace latest with a specific tag, for
    # example :1.1 or :1.1.0.
    image: ghcr.io/amdl-web/apple-music-downloader-backend:latest
    # To build locally from source instead of pulling the image: uncomment the
    # build line below (the image line then becomes the tag of the locally built
    # image), then run docker compose up -d --build.
    # build: .
    container_name: amdl-backend
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      # Runtime user: the container starts the entrypoint as root, which fixes
      # the ownership of mounted directories and then drops to PUID:PGID to run
      # the backend; default 1000:1000. Set them to the uid/gid that owns the
      # host directories. Applied on every start; after a change, ownership of
      # the mounted directories is fixed recursively once, automatically.
      # PUID: "1000"
      # PGID: "1000"
      # Time zone for log timestamps and for the local time seen by commands in
      # exec hooks; default UTC. The image ships tzdata, so an IANA time zone
      # name is all that is needed.
      # TZ: "Asia/Shanghai"
      # Any configuration key can be overridden with an AMDL_<SECTION>_<KEY>
      # environment variable (upper-case section and key names), for example
      # AMDL_DOWNLOAD_QUALITY_PRIORITY: "alac,aac" or
      # AMDL_SIMULATE_ENABLED: "true". List values are comma-separated; booleans
      # are true/false.
      # wrapper-manager gRPC address (overrides wrapper.address):
      #   - wrapper runs on the host: keep host.docker.internal:8080 (also the
      #     entrypoint's container default, so leaving the variable unset has
      #     the same effect);
      #   - wrapper is also a compose service: change it to "<service name>:8080"
      #     and uncomment the wrapper-manager service below.
      AMDL_WRAPPER_ADDRESS: "host.docker.internal:8080"
      # API listen address (overrides server.listen). Inside the container it
      # must listen on a non-loopback address; the entrypoint defaults to
      # :18080. When changing the port, adjust the ports mapping above to match;
      # the health check also derives its port from it.
      # AMDL_SERVER_LISTEN: ":18080"
    extra_hosts:
      # Lets containers on Linux reach the host through host.docker.internal too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Config directory: config.yaml (managed by the backend, rewritten in full
      # on PUT), config.example.yaml (full field documentation), hooks.yaml.
      - ./configs:/app/configs
      # SQLite database directory (database.path defaults to data/db/amdl.db).
      - ./data/db:/app/data/db
      # Optional rotating log directory (logging.file_enabled defaults to false;
      # once enabled, logs are written here).
      - ./data/logs:/app/data/logs
      # Download output directory; to put it elsewhere on the host, change the
      # left side of the colon, for example /path/to/music:/app/data/downloads.
      - ./data/downloads:/app/data/downloads
      # The temp directory data/tmp stays inside the container and needs no
      # mount.
      # When developer-token signing is enabled, mount the .p8 private key
      # (read-only) and point catalog.apple_music_private_key_path in
      # config.yaml at /app/keys/<file name>.p8:
      # - ./keys:/app/keys:ro

  # If wrapper-manager is containerized too, uncomment this and fill it in for
  # the actual image, then change AMDL_WRAPPER_ADDRESS above to
  # "wrapper-manager:8080".
  # wrapper-manager:
  #   image: <wrapper-manager image>
  #   container_name: wrapper-manager
  #   restart: unless-stopped

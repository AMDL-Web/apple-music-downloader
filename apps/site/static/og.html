<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body { position: relative; overflow: hidden; width: 1200px; height: 630px; margin: 0; background: #09090b; color: #f4f4f5; font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.page { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 2px solid #f4f4f5; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 800; letter-spacing: 0.02em; }
.meter { display: flex; align-items: flex-end; gap: 4px; height: 26px; }
.meter i { width: 6px; border-radius: 3px; }
.meter i:nth-child(1) { height: 62%; background: #fb7185; }
.meter i:nth-child(2) { height: 100%; background: #fbbf24; }
.meter i:nth-child(3) { height: 45%; background: #34d399; }
.meter i:nth-child(4) { height: 80%; background: #818cf8; }
.kicker { color: #b4b4bc; font: 500 17px/1 ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; letter-spacing: 0.02em; }
h1 { margin: 44px 0 0; font-size: 84px; font-weight: 800; line-height: 0.98; letter-spacing: -0.05em; }
h1 span { display: block; color: #8f8f99; }
.wave { width: 100%; height: 96px; margin-top: auto; }
.wave svg { display: block; width: 100%; height: 100%; }
.st-1 { fill: #fb7185; } .st-2 { fill: #fbbf24; } .st-3 { fill: #34d399; } .st-4 { fill: #818cf8; }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; font-size: 18px; font-weight: 650; }
.stages div { padding-top: 10px; border-top: 3px solid; }
.stages .st-1 { border-color: #fb7185; color: #fb7185; } .stages .st-2 { border-color: #fbbf24; color: #fbbf24; }
.stages .st-3 { border-color: #34d399; color: #34d399; } .stages .st-4 { border-color: #818cf8; color: #a5b4fc; }
</style>
</head>
<body>
<div class="page">
<div class="top"><div class="brand"><span class="meter"><i></i><i></i><i></i><i></i></span>AMDL</div><div class="kicker">{{kicker}}</div></div>
<h1>{{title}}</h1>
<div class="wave">{{wave}}</div>
<div class="stages">{{stages}}</div>
</div>
</body>
</html>

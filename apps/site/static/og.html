<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body { position: relative; overflow: hidden; width: 1200px; height: 630px; margin: 0; background: #fffdf7; color: #172723; font-family: "Geist", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
.brand svg { width: 36px; height: 36px; }
.text { position: absolute; left: 72px; top: 0; bottom: 70px; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.kicker { align-self: flex-start; padding: 7px 14px; border-radius: 999px; background: #e8effb; color: #233f60; font-size: 17px; font-weight: 500; letter-spacing: 0.01em; }
h1 { margin: 26px 0 0; font-size: 76px; font-weight: 600; line-height: 1.04; letter-spacing: -0.045em; white-space: nowrap; }
h1 span { display: block; color: #004aad; }
.sleeve { position: absolute; display: block; border-radius: 4px; filter: drop-shadow(0 2px 2px rgba(23, 39, 35, .16)) drop-shadow(0 16px 16px rgba(23, 39, 35, .22)); }
.og-tidal { left: 660px; top: 180px; width: 240px; height: 240px; transform: rotate(-8deg); }
.og-tide { left: 940px; top: 192px; width: 240px; height: 240px; transform: rotate(7deg); }
.og-glass { left: 770px; top: 170px; width: 320px; height: 320px; }
.rule { position: absolute; left: 72px; right: 72px; top: 560px; height: 1px; background: #dce4db; }
</style>
</head>
<body>
<div class="rule"></div>
<div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0a0a0a"/><rect x="6.5" y="13" width="4" height="12" rx="2" fill="#fb7185"/><rect x="11.8" y="7" width="4" height="18" rx="2" fill="#fbbf24"/><rect x="17.1" y="16" width="4" height="9" rx="2" fill="#34d399"/><rect x="22.4" y="10" width="4" height="15" rx="2" fill="#818cf8"/></svg>AMDL</div>
<div class="text"><div class="kicker">{{kicker}}</div><h1>{{title}}</h1></div>
{{covers}}
</body>
</html>

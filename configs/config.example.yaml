# Configuration example. The live config.yaml contains both startup-bound
# and runtime-mutable keys. PUT /api/v1/config changes only runtime-mutable
# keys while the backend runs and rewrites the live file (comments are
# dropped there — this example is the documented reference). Hand edits to
# runtime-mutable keys take effect on POST /api/v1/config/reload or the next
# PUT (which re-reads the file before applying its change, so it never
# overwrites them); an invalid file keeps the previous config running. Hand
# edits to startup-bound keys take effect after a restart.
#
# A key missing from config.yaml takes the value this example sets, which is
# also the "Default" named in many comments below. The one exception: a config
# without download.album_path_format or download.artist_path_format keeps the
# older {TrackNumber} layout (see those keys). Unknown keys fail startup; keys
# removed in 2.0 are listed in docs/upgrading-to-2.0.md.
#
# Three keys can be overridden with an environment variable, which wins over
# this file on every load and is never written back: AMDL_SERVER_LISTEN
# (server.listen), AMDL_WRAPPER_ADDRESS (wrapper.address) and
# AMDL_DATABASE_PATH (database.path). AMDL_CONFIG (path of this file) and
# AMDL_HOOKS_CONFIG (path of hooks.yaml) choose the files. Every other key is
# set here only; any other AMDL_* variable is ignored with a startup warning.

server:
  # string: API listen address in "host:port" form, for example "127.0.0.1:18080" or ":18080". Requires a restart.
  listen: "127.0.0.1:18080"

database:
  # string: SQLite database file path. Relative paths are resolved from the backend working directory. Requires a restart.
  path: "data/db/amdl.db"

logging:
  # enum: debug, info, warn, error. Records below this severity are discarded from every output.
  # Runtime-mutable through PUT /api/v1/config and config reload; no restart required.
  level: "info"
  # bool: true writes logs to stdout as text lines; false disables console output. Requires a restart.
  # The backend writes no log file; collect stdout (docker logs) to keep logs beyond the buffer below.
  console: true
  # bool: true emits one structured record per completed HTTP request; false disables HTTP access records.
  # Panic recovery and the X-Request-ID response header remain active when false.
  # Runtime-mutable through PUT /api/v1/config and config reload; no restart required.
  access_log: false
  # integer records: number of recent structured records retained for GET /api/v1/logs and its SSE stream.
  # 0 disables in-memory retention, and both log APIs then answer 503 feature_unavailable; valid range: 0-100000.
  # console: false with buffer_size: 0 is rejected, since no log would be kept anywhere. Requires a restart.
  buffer_size: 2000

wrapper:
  # string: wrapper base URL, "http://host:port" or "https://host:port", optionally with a path
  # prefix when a reverse proxy serves it under one. Either a wrapper-lite, or a wrapper-manager v2 in
  # front of it: only the wrapper-manager has the login API the console's Account page uses. The
  # scheme picks the transport: http is plaintext;
  # https uses TLS 1.2+ and verifies the certificate against the operating system trust store and the
  # hostname. A bare "host:port" is rejected at startup. Requires a restart.
  address: "http://127.0.0.1:12340"
  # integer seconds: timeout for one wrapper HTTP request. A failed key-template request (/key) is
  # retried up to 3 more times, 1, 2 and 4 seconds apart, each with this timeout. A /key or /m3u8 also
  # waits at most 10 times this for a free playback slot, not taken from its timeout; a /key that runs
  # out of that wait skips the retries above, and the track's own decrypt attempts (download.max_attempts)
  # still apply. Decryption itself runs in this process and has no wrapper timeout. Values <= 0 fall back
  # to 30 seconds. Requires a restart.
  timeout_seconds: 30
  # integer seconds: bound on one console login request, for a wrapper-manager (a bare wrapper-lite has
  # no login API and logs in from its own command line, --login). A login that needs a two-step code
  # takes two requests, each bounded by this. amdl's CLI, terminal interface and console wait up to 10
  # minutes for each, so a longer value does not help them. A wrapper amdl runs itself ignores this key.
  # Values <= 0 fall back to 120 seconds. Requires a restart.
  login_timeout_seconds: 120

catalog:
  # The following catalog client keys are startup-bound and require a restart.
  # string: default Apple Music storefront code, for example "us", "cn", "jp". GET /api/v1/search and
  # GET /api/v1/artists/{artist_id}/albums use it when the request names no storefront. Submissions never do: a link
  # without a storefront in its path is refused with invalid_url. The web console reads it from GET /api/v1/system
  # (default_storefront) to complete pasted links that have no region.
  default_storefront: "cn"
  # string: Apple Music catalog language tag passed as the "l" query parameter, for example "en-US", "zh-Hans_CN", "ja-JP".
  # It is also the language of lyrics translations (download.lyrics_extras, the .ttml sidecar).
  language: "zh-Hans_CN"
  # integer: maximum Apple control-plane HTTP requests in flight across the whole process, including Catalog API,
  # web-player token discovery, Enhanced HLS manifests, and artwork. Positive values allow 1-64; values <=0 behave
  # as 1; values above 64 in this file are clamped to 64. Default: 16.
  # This sizes a process-wide pool at startup; changing it requires a restart.
  max_parallel_requests: 16
  # integer hours: validity window for the bearer token the backend discovers on music.apple.com (the web player's
  # JWT, used for every catalog request). The cached token is proactively refreshed halfway through this window: for
  # example, 12 refreshes after 6 hours. Values <= 0 use a 12-hour window and refresh after 6 hours.
  token_cache_ttl_hours: 12
  # The following catalog behavior keys are runtime-mutable through PUT /api/v1/config
  # and config reload; no restart is required.
  # enum: song, album. song means album URLs containing ?i= are single-song tasks; album downloads the full album.
  album_track_url_mode: "song"
  # string: optional Apple Music subscription token (media-user-token). Station downloads need it, private playlist covers
  # and library sync use it, and it is the only token they use: a download or lookup request cannot supply its own.
  # Runtime: a change applies to jobs and lookups that start afterwards. GET /api/v1/config returns it; protect this
  # service at the deployment layer if the token is sensitive. Empty means none: stations fail and private playlists keep
  # the catalog cover.
  media_user_token: ""
  # bool: true/false. Whether to look up Apple Music animated album covers (attributes.editorialVideo) and
  # expose them on jobs as motion_artwork_url / motion_artwork_tall_url plus each variant's palette.
  # Default: true.
  # - true: after a job's input resolves, one extra amp-api request per album runs out of band, on a context
  #     detached from the job. It never blocks or fails a download; the fields appear a moment later via the
  #     motion_artwork_resolved event. Requires a scraped music.apple.com web-player token — the public API
  #     host never returns editorialVideo, whatever token it is given.
  # - false: no lookup, no request, no token scrape. Jobs simply carry no motion artwork fields, which is
  #     indistinguishable to clients from an album that has no animated cover. Set this if nothing you use
  #     renders animated covers and you would rather not generate undocumented-endpoint traffic.
  # This is the only amp-api traffic the backend makes purely for decoration.
  motion_artwork_enabled: true

download:
  # quality_priority, codec_alternative, and memory_mode below are runtime-mutable;
  # they appear first to match the DownloadConfig field order.
  # list enum: alac, aac, aac-binaural, aac-downmix, ec3, ac3.
  # - alac: Apple Lossless Audio Codec
  # - aac: standard Enhanced HLS AAC
  # - aac-binaural: binaural AAC
  # - aac-downmix: Dolby downmix AAC
  # - ec3: Dolby Digital Plus / Dolby Atmos
  # - ac3: Dolby Digital
  # AAC-LC does not need to be listed; it is always appended as the final fallback. Default: ["alac"].
  # Runtime-mutable through PUT /api/v1/config and config reload; no restart required.
  quality_priority: ["alac"]
  # bool: true tries the next codec in quality_priority after failure; false only tries the first codec.
  # Runtime-mutable through PUT /api/v1/config and config reload; no restart required.
  codec_alternative: true
  # enum: low, high. Controls the per-track RAM/disk trade-off for Enhanced HLS processing. Default: low.
  # - low: streams encrypted Enhanced HLS media into a resumable checkpoint, then reads it fragment by fragment
  #     and decrypts directly into ffmpeg. The normal path uses bounded fragment-sized RAM; the encrypted
  #     checkpoint and flattened output can coexist in temp_dir, for roughly two track-sized files per parallel track.
  # - high: keeps one encrypted track in RAM and decrypts it fragment by fragment directly into ffmpeg. The live
  #     media payload per parallel track is roughly one encrypted track plus the current encrypted and plaintext
  #     fragments; pathological single-fragment media can approach three track sizes. The observed Go heap may
  #     temporarily approach about twice the track size (or more for unusually large fragments) because garbage
  #     collection retains allocation headroom; ffmpeg and runtime overhead are additional. Only the flattened
  #     output remains in temp_dir, so its peak is roughly one track per parallel track. In-memory media is limited
  #     to 512 MiB per track; larger enhanced-media responses fail explicitly instead of risking process OOM. If a
  #     CDN response has a usable ETag or Last-Modified validator and is interrupted after making progress, high
  #     mode retries one Range request from its in-memory prefix. It does not persist that prefix, so process or
  #     container restarts still begin at byte zero.
  # AAC-LC WebPlayback is unchanged by this option: both modes keep its encrypted retry buffer in memory (subject
  # to the same 512 MiB download limit) and stream gowidevine's decrypted output directly into ffmpeg instead of
  # retaining another plaintext []byte or input file. The Widevine parser may still hold decoded track structures
  # until that stream completes. The rare ALAC integrity-repair fallback also reads and copies one full flattened
  # track in either mode; the fragment-sized low-mode estimate applies to the normal path.
  # For the normal ffmpeg layout (media before a final moov), metadata tagging rewrites only a moov-plus-artwork
  # sized shell in temp_dir and another shell of similar size in the operating system temp directory. Unusual
  # compatible layouts fall back to go-mp4tag's legacy whole-track rewrite in the operating system temp directory.
  # Total RAM and temporary disk usage scale with max_parallel_downloads below and the fixed limit of 32
  # decrypts in flight.
  # Runtime-mutable through PUT /api/v1/config and config reload; no restart required.
  memory_mode: "low"
  # The following worker and process-wide pool sizes are startup-bound and require a restart.
  # integer: maximum concurrently running jobs; sizes the worker pool built at startup.
  # Positive values allow 1-32; values <=0 behave as 1; values above 32 in this file are
  # clamped to 32 (the config API rejects them). Default: 3.
  max_running_jobs: 3
  # integer: maximum media transfers in flight across all jobs. Positive values allow 1-64; values <=0 behave as 1;
  # values above 64 in this file are clamped to 64. Default: 16.
  # This sizes a process-wide pool at startup, cannot be overridden per job, and requires a restart to change.
  # Upgrade note: this replaces the removed max_parallel_tracks key; old configs must be edited or startup fails.
  max_parallel_downloads: 16
  # The remaining download keys are runtime-mutable through PUT /api/v1/config
  # and config reload; no restart is required.
  # integer: maximum total attempts (including the first) for metadata, cover, lyrics,
  # and each codec's download/decrypt phase. Positive values allow 1-10; values <=0 behave as 1;
  # values above 10 in this file are clamped to 10 (the config API rejects them). Default: 3.
  max_attempts: 3
  # integer milliseconds: minimum gap between two consecutive item_progress events for the same item
  # while it stays in one state. Only movement of the download/decrypt meters is delayed by this;
  # status changes (queued -> resolving -> waiting_download -> downloading -> waiting_decrypt ->
  # decrypting -> remuxing -> saving -> tagging) and pipeline-stage completions (resolved, remuxed,
  # verified, tagged, saved) are always published immediately, as are item_completed, item_failed,
  # item_skipped and every other one-shot event. A meter value held back by this interval is flushed
  # out just before whichever event supersedes it, so the last percentage before a state change is
  # never lost and clients resuming from an event cursor see the same stream as live ones.
  # This is a floor on spacing, layered on top of the unconditional whole-percent rounding gate, so a
  # meter still never emits more than ~101 times per stage no matter how low this is set.
  # Allowed 0-10000; values <=0 disable time-based coalescing and leave only the percent gate;
  # values above 10000 in this file are clamped to 10000 (the config API rejects them). Default: 500.
  # Raise it to cut event volume for clients that fan the feed out (amdl-portal) or forward it to
  # APNs (amdl-ios-gateway); lower it for a more granular progress bar at higher cost.
  # Read once when a job starts, so a change applies to jobs started after it, not to running ones.
  progress_event_interval_ms: 500
  # string path: root download directory. Relative paths are resolved from the backend working directory.
  downloads_dir: "data/downloads"
  # Per-task-type output path templates, relative to downloads_dir. Each is a single
  # "/"-separated path template, non-empty; the last segment is the file name and gets
  # the .m4a extension appended automatically. Every segment is sanitized independently,
  # so template values cannot create extra directories. Absolute templates and ".."
  # segments are rejected (they would only collapse into "_" folders): the path must
  # stay relative to downloads_dir.
  # Variables: {SongId}, {SongNumber}, {SongName}, {ArtistName}, {UrlArtistName}, {ArtistId},
  # {AlbumName}, {AlbumId}, {AlbumArtist}, {ReleaseDate}, {ReleaseYear}, {UPC}, {Copyright},
  # {RecordLabel}, {DiscNumber}, {DiscCount}, {TrackNumber}, {TrackCount}, {PlaylistName},
  # {PlaylistId}, {StationName}, {StationId}, {Quality}, {Codec}, {Tag}. Numeric variables {SongNumber}, {DiscNumber},
  # {DiscCount}, {TrackNumber}, and {TrackCount} also support :02d padding, for example
  # {TrackNumber:02d}; it is the only spec, and other "{Variable:spec}" forms are
  # rejected. Unknown variables are preserved literally.
  # {UrlArtistName} is an alias of {ArtistName} and resolves exactly like it.
  # {Tag} always expands to an empty string; it is accepted so templates that use it
  # still parse, and contributes nothing to the path.
  # In directory segments, {ArtistName} resolves to the collection's grouping artist
  # (album artist when available) so all tracks of a collection share one folder; in the
  # file-name segment it resolves to the track's own artist.
  # {SongNumber} is the track's 1-based position within the collection it is downloaded
  # as: the position in the playlist or station, and for album and artist tasks the
  # position within that album, counting on across discs. {TrackNumber} is instead
  # Apple's own number, which restarts at 1 on every disc — on a multi-disc album a
  # file-name segment built from {TrackNumber} alone repeats 01, 02, ... once per disc,
  # and two identically titled tracks on different discs then resolve to the same path,
  # where the second is skipped as already downloaded. Pair it with {DiscNumber} (for
  # example "{DiscNumber}-{TrackNumber:02d}. {SongName}") if you want Apple's numbering.
  # {TrackCount} matches {TrackNumber}: it is the number of tracks on the track's own
  # disc, not the whole release.
  # string template: output path for single-song tasks. A single song is a collection of
  # one, so {SongNumber} is always 1 here; use {TrackNumber} to keep the album position.
  song_path_format: "songs/{ArtistName}/{AlbumName}/{TrackNumber:02d}. {SongName}"
  # An install upgrading from a version whose album and artist templates used
  # {TrackNumber} keeps that layout: its config.yaml already carries the old value,
  # and a config omitting the key falls back to the old value too, so nothing that
  # has already been downloaded is stranded under a name the backend no longer
  # produces. Switch by editing the key (or via PUT /api/v1/config).
  # string template: output path for album tasks.
  album_path_format: "albums/{ArtistName}/{AlbumName}/{SongNumber:02d}. {SongName}"
  # string template: output path for artist tasks (expanded album/song lists). {SongNumber}
  # restarts at 1 for each of the artist's albums, matching the {AlbumName} folder.
  artist_path_format: "artists/{ArtistName}/{AlbumName}/{SongNumber:02d}. {SongName}"
  # string template: output path for playlist tasks. {SongNumber} is the 1-based position in the playlist.
  playlist_path_format: "playlists/{PlaylistName}/{SongNumber:02d}. {SongName}"
  # string template: output path for radio station (station/ra.xxxx) tasks. A station resolves to a
  # rolling next-tracks list, so it gets its own folder. {StationName}/{StationId} carry the station's
  # name/id; {SongNumber} is the 1-based position.
  station_path_format: "stations/{StationName}/{SongNumber:02d}. {SongName}"
  # string path: temporary media working directory. Relative paths are resolved from the backend working directory.
  # All disk-backed per-track scratch and the flattened/verified/tagged file are
  # staged here and only the finished file is
  # moved to downloads_dir. If temp_dir shares a filesystem with downloads_dir the
  # move is a cheap rename; if not, the finished file is copied across once. Put
  # temp_dir on fast local storage (e.g. SSD) to keep the flatten/verify/tag work
  # off a slower downloads volume. For Enhanced HLS, peak usage in this directory depends
  # on memory_mode: roughly two times one track's size per in-flight track in low mode,
  # or one track's size per in-flight track in high mode (in-flight tracks are bounded by
  # the startup pools above). AAC-LC uses roughly one track here in either mode.
  # The common metadata rewrite briefly uses only moov-plus-artwork sized shells in temp_dir and the operating
  # system temp directory; a compatible non-tail-moov layout can still use one track-sized legacy rewrite file.
  # Assumed single-writer: stale non-resumable scratch
  # in temp_dir is swept on startup. Encrypted HLS checkpoints (low mode) are grouped by
  # task: failed/recoverable tasks retain them for retry, while completed, cancelled,
  # and deleted tasks remove them.
  temp_dir: "data/tmp"
  # string: cover artwork size as "{width}x{height}" in pixels, for example "5000x5000", "3000x3000",
  # "1400x1400"; any other value is rejected. If Apple cannot serve that size, the standard sizes
  # 5000x5000, 3000x3000, 1400x1400, 600x600 and 300x300 are tried in turn.
  cover_size: "5000x5000"
  # enum: jpg, jpeg, png.
  cover_format: "jpg"
  # bool: true embeds track cover art into the MP4 metadata; false skips embedded cover art.
  embed_cover: true
  # bool: true saves standalone album cover files for album downloads; false skips them.
  # The cover is written into the deepest directory segment of the task's path template
  # that references {AlbumName} or {AlbumId}; if no segment does, it is written next to the tracks.
  save_album_cover: true
  # bool: true saves standalone artist cover files when available; false skips them.
  # The cover is written into the deepest directory segment of the task's path template
  # that references {ArtistName}, {UrlArtistName}, {AlbumArtist}, or {ArtistId};
  # if no directory segment references the artist, the artist cover is skipped.
  save_artist_cover: true
  # bool: true saves standalone playlist cover files for playlist downloads; false skips them.
  save_playlist_cover: true
  # Lyrics are fetched only when embed_lyrics is true or lyrics_files is not empty. The wrapper
  # serves them from its own account's storefront as Apple's word-timed TTML, with the translation
  # in catalog.language when Apple has one.
  # bool: true embeds the lyrics into the MP4 tag as LRC, shaped by lyrics_timing and lyrics_extras;
  # false leaves the tag without lyrics. Default: true.
  embed_lyrics: true
  # list enum: lrc, ttml, each at most once. Writes one sidecar per entry next to the track, with
  # the track's file name: <track>.lrc holds the same LRC as the tag; <track>.ttml holds Apple's TTML
  # unchanged, with word timing, the translation, the romanization, background vocals and duet
  # voices (Navidrome 0.63+ reads all of these; Jellyfin reads .lrc only). A song that Apple has only
  # plain-text lyrics for gets no .ttml, even when the wrapper wraps that text in a TTML document
  # marked itunes:timing="None". Empty list: no sidecar. Default: [].
  lyrics_files: []
  # enum: line, word. line stamps each LRC line with its start time. word writes enhanced LRC, which
  # also stamps each word (<mm:ss.xx> before it, the line's end after the last one); songs that
  # Apple does not time word by word stay line by line. Applies to the tag and the .lrc sidecar.
  # Default: line.
  lyrics_timing: "line"
  # list enum: translation, pronunciation. Adds each LRC line's translation and its romanization
  # (romaji, Korean romanization, pinyin or jyutping, as Apple picks for the lyrics language) as
  # extra lines with the same timestamp, when Apple has them and they differ from the line.
  # Applies to LRC only; the .ttml sidecar always carries both. Empty list: none. Default: [].
  lyrics_extras: []
  # integer Hz: maximum selected ALAC sample rate; 0 or less sets no ceiling. Use 192000 for up to
  # 192 kHz. Apple Music serves ALAC at 44100 Hz and above, so a lower value skips every ALAC stream.
  # Above 48000, or at 0 or less (no ceiling), a Hi-Res Lossless track takes its master playlist from the
  # wrapper's device manifest (one wrapper /m3u8 request per song, remembered for 12 hours), because the
  # web player's playlist can leave out the 88.2, 96 and 192 kHz renditions. From 1 to 48000, and for
  # every other track, no such request is made. If the wrapper cannot supply the manifest the track keeps the web player's.
  alac_max_sample_rate: 192000
  # integer bits: maximum selected ALAC bit depth; 0 or less sets no ceiling. Use 24 for up to 24-bit.
  # Apple Music serves 16- and 24-bit ALAC, so 16 to 23 keeps 16-bit streams only.
  alac_max_bit_depth: 24
  # bool: true verifies output MP4 integrity and repairs known ALAC terminator issues; false skips the integrity gate.
  check_integrity: true
  # bool: true overwrites an existing output file (and its lyrics sidecars) when
  # a job downloads the same track again; false skips tracks whose output file
  # already exists. Default: false. Can be overridden per submission via the
  # overrides.force_overwrite field of POST /api/v1/downloads.
  force_overwrite: false

tools:
  # string path or command name: ffmpeg executable. Used to flatten the
  # remuxed MP4 and to run the optional integrity check. All MP4 box/atom
  # operations (sample extraction, re-encapsulation, metadata, cover art) are
  # now handled in-process via the Go mp4ff/go-mp4tag libraries, so gpac,
  # MP4Box and the Bento4 tools (mp4extract/mp4edit) are no longer required.
  # Requires a restart.
  ffmpeg: "ffmpeg"

simulate:
  # All simulate keys are runtime-mutable through PUT /api/v1/config and
  # config reload; no restart is required.
  # bool: true enables local test mode. The encrypted media transfer, decryption, remux, and disk
  # writes are simulated: nothing is downloaded or decrypted, ffmpeg is not needed, and no output
  # file is written. Catalog metadata and enhanced-HLS media selection still run for real, so
  # titles, albums, artwork, and the reported codec quality (bit depth / sample rate / bitrate) are
  # authentic values, and selection failures fall back through quality_priority exactly like a real
  # download. Every API response, job/item status, progress breakdown, status message, and SSE event
  # matches a real download. The wrapper decryptor status/storefront check is skipped so jobs can be
  # submitted without a running wrapper; a Hi-Res track then keeps the web player's manifest, which can
  # leave out its 88.2 kHz and higher ALAC renditions.
  # false runs real downloads.
  enabled: false
  # integer KB/s (kilobytes per second): lower bound of the randomized simulated transfer speed.
  # Must be >= 1 when simulate mode is enabled. Default: 512.
  min_speed_kbps: 512
  # integer KB/s (kilobytes per second): upper bound of the randomized simulated transfer speed.
  # Must be >= min_speed_kbps. Default: 4096.
  max_speed_kbps: 4096

library_sync:
  # Library monitor: polls the signed-in Apple Music library and submits the **album** of each
  # newly added track as an ordinary download job. Add a song to your library on your phone and
  # the whole album downloads here automatically, with no manual submission.
  #
  # Both keys are runtime-mutable through PUT /api/v1/config and config reload; no restart
  # is required. The polling loop re-reads them at the start of every round, so turning the
  # monitor off really stops polling rather than just discarding the results.
  #
  # Requires catalog.media_user_token — a personal library can be read only with the
  # subscription token; the web-player token alone is not enough. While that key is empty the
  # monitor idles and warns once, instead of reporting an error every round.
  #
  # How it detects "new": Apple does not return when a library track was added (library-songs
  # has no dateAdded attribute, and a library album's dateAdded is when its first track was
  # added and does not change when songs are added to it later), but the **order** of
  # sort=-dateAdded is accurate. So on first enable it records the ids of the current newest
  # batch of tracks as the anchor (submitting no albums at all: everything already in the
  # library at that moment counts as existing), and every later round pages newest-first until
  # it sees the oldest track of the anchor again; anything in between that is not in the
  # anchor is new.
  # bool: true enables polling. Default: false — this is the only feature that creates
  # download jobs on its own, so it stays off until enabled explicitly.
  enabled: false
  # integer minutes: polling interval, range 1..1440. Default: 15. In steady state a round
  # usually makes only 1 Apple request (one page covers the anchor window), plus 1 more per new
  # album to map its library id to a catalog id.
  interval_minutes: 15

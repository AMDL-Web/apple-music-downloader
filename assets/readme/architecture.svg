<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1045" width="1040" height="1045" role="img" aria-labelledby="t d">
<title id="t">amdl architecture</title>
<desc id="d">The web console calls amdl's /api/v1 REST and SSE API. Inside amdl, the HTTP API feeds the job queue, which stores jobs, items and events in SQLite, fires job hooks, and runs each track through the media pipeline; the pipeline decrypts samples in-process with internal/fairplay and writes tagged files to downloads_dir. A wrapper, wrapper-manager v2 (recommended, console login) in front of wrapper-lite or a bare wrapper-lite, supplies white-box key templates, the device manifest for Hi-Res ALAC, lyrics and the AAC-LC license. Apple's amp-api serves the catalog with a token scraped from music.apple.com, and Apple's media CDN serves the encrypted segments.</desc>

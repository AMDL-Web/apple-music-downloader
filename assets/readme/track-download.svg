<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1600" width="1020" height="1600" role="img" aria-labelledby="t d">
<title id="t">How amdl downloads one track</title>
<desc id="d">Statechart of one track: resolving metadata, cover and lyrics; then for each codec in download.quality_priority, followed by aac-lc when codec_alternative is on, a fetch phase (choose the web enhancedHls manifest, the wrapper's device manifest for Hi-Res ALAC above 48 kHz, or webplayback for aac-lc; claim the output path; download the encrypted segments) and a decrypt phase (decrypt in-process with internal/fairplay, remux with ffmpeg, verify when check_integrity is on, tag, move into downloads_dir). Each phase has its own download.max_attempts budget; when one runs out the next codec is tried. End states: completed, skipped_existing, failed and cancelled.</desc>
